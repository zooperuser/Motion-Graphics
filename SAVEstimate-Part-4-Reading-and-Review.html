    // Markup mode swap
    const sw = prog(t, tMarkup + 0.12, tMarkup + 0.62, ease.outCubic);
    O(UI.gView, 1 - sw * 1.6);
    O(UI.gMarkup, sw * 1.4);
    S(UI.gView, 'transform', `translateX(${r2(-26 * sw)}px)`);

  return tMarkup + 0.75;
}

// ========================================================= 2. calibrate
function sceneCalibrate(t0) {
  const A_ = MODEL.calib.a;
  const B_ = MODEL.calib.b;
  const tBtn = t0 + 0.9;
  const tA = t0 + 2.9;
  const tB = t0 + 4.4;
  const tDlg = t0 + 4.95;
  const tInput = t0 + 5.75;
  const tType = t0 + 6.15;
  const tOk = t0 + 7.55;
  const tEnd = t0 + 9.2;
  TL.calibrated = tOk + 0.1;

  tool(tBtn + 0.05, 'calibrate');
  anchor('cal.btn', tBtn);
  anchor('cal.A', tA);
  anchor('cal.B', tB);
  anchor('cal.dialog', tDlg);
  anchor('cal.type', tType);
  anchor('cal.ok', tOk);
  tool(tOk + 0.45, 'select'); // setting the scale returns the app to Select
  vcbProvider(tBtn + 0.1, tDlg, (t) => ({ label: 'Scale', value: 'Calibrating....', prompt: t < tA ? 'Pick 2 points' : 'Pick point 2' })); // real VCB wording
  camMove(t0 + 0.95, t0 + 2.35, 320, 592, 2.0);
  camMove(tOk + 0.4, tEnd - 0.3, 490, 368, 1.5);
  // working area of this step (focus camera, 43-focus-camera.js): the 12.00 m dimension; the legacy camMoves above stay for parts without it
  focus(t0 + 1.0, tEnd, [[A_[0], A_[1] - 10], [B_[0], B_[1] + 10]], { z: 2.0 });

  // sheet-space marks
  const g = sv('g', {}, SH.overlay);
  const line = sv('line', { stroke: '#0284c7', 'stroke-width': 1.7, 'stroke-linecap': 'round' }, g);
  const mk = (cls) => {
    const m = sv('g', {}, g);
    sv('circle', { r: 4.4, fill: '#0284c7', stroke: '#fff', 'stroke-width': 1.2 }, m);
    sv('line', { x1: -11, y1: 0, x2: 11, y2: 0, stroke: '#0284c7', 'stroke-width': 0.9 }, m);
    sv('line', { x1: 0, y1: -11, x2: 0, y2: 11, stroke: '#0284c7', 'stroke-width': 0.9 }, m);
    return m;
  };
  const mA = mk();
  const mB = mk();
  const okLine = sv('line', { x1: A_[0], y1: A_[1], x2: B_[0], y2: B_[1], stroke: '#22c55e', 'stroke-width': 3.4, 'stroke-linecap': 'round', opacity: 0 }, SH.overlay);

  // loupe
  const loupe = h('div', { class: 'loupe' }, `<svg width="230" height="230" viewBox="-115 -115 230 230"><defs><clipPath id="lpClip"><circle r="108"/></clipPath></defs><circle r="112" fill="#fff"/><g clip-path="url(#lpClip)"><g id="lpContent"><use href="#sheetLayer"/></g></g><circle r="108" fill="none" stroke="#0284c7" stroke-width="5"/><line x1="-108" y1="0" x2="108" y2="0" stroke="#0284c7" stroke-width="1" opacity=".55"/><line x1="0" y1="-108" x2="0" y2="108" stroke="#0284c7" stroke-width="1" opacity=".55"/><circle r="4" fill="none" stroke="#e11d48" stroke-width="2"/></svg>`);
  OV().appendChild(loupe);
  const lpContent = loupe.querySelector('#lpContent');
  const loupeA = t0 + 2.55;
  const loupeB = tB + 0.5;

  // cursor: to button, then to both ends of the 12.00 m dimension
  cGoP(tBtn, POS.btn.calibrate, { click: true });
  cGoS(tA, A_[0], A_[1], { click: true, hold: 0.3 });
  cGoS(tB, B_[0], B_[1], { click: true, hold: 0.3, e: 'inOutQuad' });

  // dialog
  const dlg = h('div', { class: 'dlg', style: 'left:0;top:0' }, `
    <h3>Calibrate Scale <span style="color:#8b8b8f">${ic('x', 18)}</span></h3>
    <p>You drew a line of <b>${Math.round(dist(A_, B_))} pixels</b>. How long is this in the real world?</p>
    <div class="lab">Calibration Mode</div>
    <div class="seg"><span>Uniform</span><span class="on">X-Axis</span><span>Y-Axis</span></div>
    <div class="lab">Known Length</div>
    <div class="inp" id="calInp"><span id="calTxt">10</span><span class="caret" id="calCaret" style="opacity:0"></span></div>
    <div class="lab">Unit</div>
    <div class="inp" style="justify-content:space-between"><span>Meters (m)</span>${ic('chevDown', 16)}</div>
    <div class="btnrow"><span class="btn">Cancel</span><span class="btn pri" id="calOk">Set Scale</span></div>`);
  const scrim = h('div', { class: 'scrim' });
  OV().appendChild(scrim);
  OV().appendChild(dlg);
  dlg.style.left = CV.x + (CV.w - 440) / 2 + 'px';
  dlg.style.top = CV.y + (CV.h - dlg.offsetHeight) / 2 - 10 + 'px';
  const inpPos = layoutRect($('calInp'));
  const okPos = layoutRect($('calOk'));
  cGo(tInput, inpPos.x + 120, inpPos.cy, { click: true, hold: 0.25 });
  cGo(tOk, okPos.cx, okPos.cy, { click: true, hold: 0.3 });

  const calTxt = $('calTxt');
  const calCaret = $('calCaret');
  const calInp = $('calInp');
  const typed = '12.00';
  cueTyping('calibrate length', Array.from(typed, (ch, k) => tType + k * 0.17)); // char k+1 appears at tType + k*0.17
  onFrame((t) => {
    // sheet marks
    V(g, t >= tA - 0.05 && t < tEnd - 0.2);
    if (t >= tA - 0.05 && t < tEnd) {
      const end = t < tB ? cursorSheet(t) : B_;
      A(line, 'x1', r2(A_[0]));
      A(line, 'y1', r2(A_[1]));
      A(line, 'x2', r2(end[0]));
      A(line, 'y2', r2(end[1]));
      A(mA, 'transform', `translate(${r2(A_[0])} ${r2(A_[1])}) scale(${r3(1 / camAt(t).z * (0.6 + 0.4 * prog(t, tA, tA + 0.25, ease.outBack)))})`);
      A(mB, 'transform', `translate(${r2(end[0])} ${r2(end[1])}) scale(${r3(1 / camAt(t).z * (t < tA + 0.3 ? 0 : 1))})`);
      A(g, 'opacity', r3(1 - prog(t, tOk + 0.3, tOk + 0.9)));
    }
    A(okLine, 'opacity', r3(pulse(t, tOk + 0.1, tOk + 1.6) * 1.0));
    // loupe
    const la = prog(t, loupeA, loupeA + 0.25, ease.outBack) * (1 - prog(t, loupeB, loupeB + 0.2));
    O(loupe, la);
    if (la > 0) {
      const p = cursorPos(t);
      const c = camAt(t);
      const lx = p[0] + 150;
      const ly = p[1] - 170;
      S(loupe, 'left', r2(lx - 115) + 'px');
      S(loupe, 'top', r2(ly - 115) + 'px');
      S(loupe, 'transform', `scale(${r3(0.6 + 0.4 * la)})`);
      const m = 3.2;
      A(lpContent, 'transform', `scale(${m}) translate(${r2(-p[0] + CV.x + c.tx)} ${r2(-p[1] + CV.y + c.ty)}) scale(${r3(c.z)})`);
    }
    // dialog
    const da = prog(t, tDlg, tDlg + 0.3, ease.outBack) * (1 - prog(t, tOk + 0.15, tOk + 0.4, ease.inQuad));
    O(dlg, da);
    O(scrim, 1 * prog(t, tDlg, tDlg + 0.25) * (1 - prog(t, tOk + 0.2, tOk + 0.5)));
    if (da > 0) {
      S(dlg, 'transform', `scale(${r3(0.9 + 0.1 * Math.min(da, 1))})`);
      let html;
      if (t < tInput) html = '10';
      else if (t < tType) html = '<span class="sel">10</span>';
      else html = typed.slice(0, Math.min(5, Math.floor((t - tType) / 0.17) + 1));
      if (calTxt.__h !== html) {
        calTxt.__h = html;
        calTxt.innerHTML = html;
      }
      setClass(calInp, 'focus', t >= tInput);
      S(calCaret, 'opacity', t >= tInput && Math.floor(t * 2.2) % 2 === 0 && t >= tType ? 1 : 0);
      setClass($('calOk'), 'hov', t >= tOk - 0.35 && t < tOk + 0.1);
    }
  });
  chipProvider(tA, tB + 0.05, (t) => ['Length', dist(A_, t < tB ? cursorSheet(t) : B_).toFixed(1) + ' px']);

  // toast + status
  const toast = h('div', { class: 'toast' }, `<div class="ck">${ic('check', 18, 3)}</div><div>Scale set - 1 : 100<small>Calibrated from 12.00 m · ${MODEL.scale().toFixed(2)} pt per metre</small></div>`);
  OV().appendChild(toast);
  const tToast = tOk + 0.35;
  cue('calibrationOk', tToast, { t1: tToast + 0.45 });
  timed(toast, tToast, tOk + 2.6, { dx: 60, fin: 0.45 });
  onFrame((t) => {
    V(UI.stScale, t >= TL.calibrated + 0.25);
  });

  caption(tBtn + 0.2, tOk + 1.9, 'Calibrate', 'Set true scale from any known dimension - every quantity after this is real.', 'calibrate');
  return tEnd;
}

/* ---- shared/60-endcard.js ---- */
// ---------------------------------------------------------------------------
// End card: the UI recedes, a rain of tool icons falls behind the logo, a "next up" block and the brand row appear.
// The rain is a pure function of time and keeps looping after the timeline ends.
//   sceneEndCard(t0, { kicker, title, sub, fine, nextPart })  -> end time
//   Defaults come from PARTS_INDEX[PART_META.next_part]: kicker 'Up next - Part 2', title the next part's title.
//   The last part passes its own kicker/title (for example a thank-you line) instead.
// ---------------------------------------------------------------------------
const RAIN_ICONS = ['areaTool', 'wand', 'chain', 'linear', 'count', 'similar', 'calibrate', 'text', 'highlight', 'polyline', 'line', 'polygon', 'rect', 'circle', 'dimension', 'leader', 'cloud', 'cloudy', 'callout', 'imageUp', 'stamp', 'moon', 'eyeOff', 'table', 'fileText', 'undo', 'redo', 'squaresSubtract', 'lineSquiggle', 'copy', 'move', 'paintbrush'];
const RAIN_TIERS = [
  { size: 30, blur: 1.4, alpha: 0.4, v0: 70, v1: 115, n: 42 },
  { size: 54, blur: 0.5, alpha: 0.78, v0: 150, v1: 230, n: 34 },
  { size: 92, blur: 3.6, alpha: 0.9, v0: 300, v1: 420, n: 15 },
];
const RAIN = { canvas: null, ctx: null, sprites: [], parts: [], k: 1, spr: 2, pad: 16 };

function buildRain(tStart) {
  const cv = $('rain');
  RAIN.canvas = cv;
  RAIN.ctx = cv.getContext('2d');
  const SPR = RAIN.spr;
  RAIN_TIERS.forEach((tier, ti) => {
    RAIN.sprites[ti] = RAIN_ICONS.map((name) => {
      const dim = (tier.size + RAIN.pad * 2) * SPR;
      const c = document.createElement('canvas');
      c.width = dim;
      c.height = dim;
      const x = c.getContext('2d');
      const sc = (tier.size * SPR) / 24;
      x.translate(RAIN.pad * SPR, RAIN.pad * SPR);
      x.scale(sc, sc);
      const grad = x.createLinearGradient(0, 0, 0, 24);
      grad.addColorStop(0, '#fff3cf');
      grad.addColorStop(1, '#c9a24a');
      x.strokeStyle = grad;
      x.lineWidth = 1.8;
      x.lineCap = 'round';
      x.lineJoin = 'round';
      x.shadowColor = 'rgba(240,213,138,0.85)';
      x.shadowBlur = 9 * SPR;
      if ('filter' in x && tier.blur > 0.4) x.filter = `blur(${tier.blur * SPR}px)`;
      iconToPaths(name).forEach((d) => x.stroke(new Path2D(d)));
      return c;
    });
    for (let i = 0; i < tier.n; i++) {
      const id = ti * 100 + i;
      RAIN.parts.push({
        tier: ti,
        icon: (i * 5 + ti * 11) % RAIN_ICONS.length,
        x0: rnd(id * 3.7 + 1) * 1920,
        sz: 0.8 + rnd(id + 5) * 0.45,
        v: lerp(tier.v0, tier.v1, rnd(id + 11)),
        amp: 8 + rnd(id + 17) * 34,
        fr: 0.35 + rnd(id + 23) * 0.8,
        ph: rnd(id + 29) * 6.28,
        rot0: (rnd(id + 31) - 0.5) * 1.2,
        rv: (rnd(id + 37) - 0.5) * 0.7,
        t0: tStart + rnd(id + 41) * 2.6,
      });
    }
  });
  RAIN.parts.sort((a, b) => a.tier - b.tier);
}

function sizeRain(scale) {
  if (!RAIN.canvas) return;
  const k = clamp(scale * (window.devicePixelRatio || 1), 0.5, 2);
  RAIN.k = k;
  RAIN.canvas.width = Math.round(1920 * k);
  RAIN.canvas.height = Math.round(1080 * k);
}

/** Size and fall geometry of one rain particle (shared by drawRain and the audio cues). */
function rainGeom(p) {
  const size = RAIN_TIERS[p.tier].size * p.sz;
  const dimS = size + RAIN.pad * 2 * p.sz;
  return { size, dimS, span: 1080 + dimS * 2 };
}
/** Sheet position of a rain particle at time t (centre of its sprite). */
function rainPos(p, t) {
  const { dimS, span } = rainGeom(p);
  return [p.x0 + Math.sin(t * p.fr + p.ph) * p.amp, ((t - p.t0) * p.v) % span - dimS];
}

function drawRain(t, alpha) {
  const ctx = RAIN.ctx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, RAIN.canvas.width, RAIN.canvas.height);
  if (alpha <= 0.001) return;
  ctx.setTransform(RAIN.k, 0, 0, RAIN.k, 0, 0);
  for (const p of RAIN.parts) {
    if (t < p.t0) continue;
    const tier = RAIN_TIERS[p.tier];
    const { dimS } = rainGeom(p);
    const [x, y] = rainPos(p, t);
    const edge = Math.min(1, (y + dimS) / 120);
    ctx.globalAlpha = tier.alpha * alpha * clamp01(edge);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(p.rot0 + t * p.rv);
    ctx.drawImage(RAIN.sprites[p.tier][p.icon], -dimS / 2, -dimS / 2, dimS, dimS);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function sceneEndCard(t0, o = {}) {
  const nextId = PART_META.next_part;
  const nxt = nextId && PARTS_INDEX[nextId] ? PARTS_INDEX[nextId] : null;
  const kicker = o.kicker != null ? o.kicker : nxt ? `Up next · Part ${nxt.letter}` : 'Thank you';
  const title = o.title != null ? o.title : nxt ? nxt.title : 'Take off. Mark up. Estimate.';
  const sub = o.sub != null ? o.sub : '';
  const fineText = o.fine != null ? o.fine : 'Sample drawing, names and quantities in this video are fictitious.';
  TL.finA = t0;
  TL.finB = t0 + 2.2;
  curVisKeys.push([t0 - 0.25, 1], [t0 + 0.35, 0]);
  const root = $('finale');
  root.innerHTML = `
    <div class="gridbg" id="fnGrid"></div>
    <canvas id="rain"></canvas>
    <div class="logobox" id="fnBox">
      <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
      <div class="logostage"><img class="logoimg" id="fnImg" src="${SPLASH_URI}" alt="SAVEstimate logo"><div class="glow" id="fnGlow"></div><img class="sheenimg" id="fnSheen" src="${SHEEN_URI}" alt=""></div>
      <div class="scan" id="fnScan"></div>
    </div>
    <div class="ptitle" id="fnTag" style="top:592px"><div class="kick">${kicker}</div><div class="ttl sm">${title}</div></div>
    <div class="endcard" id="fnEnd" style="top:760px">
      <img class="tile" src="${LOGO_URI}" alt="SAVEstimate app icon">
      <div class="row"><b>Takeoff</b> &nbsp;&middot;&nbsp; <b>Markup</b> &nbsp;&middot;&nbsp; <b>Estimating</b></div>
      ${sub ? `<div class="sub">${sub}</div>` : ''}
    </div>
    <div class="fine" id="fnFine">${fineText}</div>`;
  const tRain = t0 + 0.3;
  buildRain(tRain);
  sizeRain(fit.scale);
  window.__onFit = sizeRain;

  const stg = root.querySelector('.logostage');
  const img = $('fnImg');
  const scan = $('fnScan');
  const sheen = $('fnSheen');
  const glow = $('fnGlow');
  const tag = Array.from($('fnTag').children);
  const end = $('fnEnd');
  const fine = $('fnFine');
  const grid = $('fnGrid');
  const tLogo = t0 + 1.35;
  // timing constants shared by the visuals and the audio cues (70-audio-cues.js expands the periodic ones)
  const tRainRamp = t0 + 2.0;
  const tSheen0 = tLogo + 1.3; // first logo sheen; it repeats every SHEEN_PERIOD and sweeps for SHEEN_DUR
  const SHEEN_PERIOD = 4.8;
  const SHEEN_DUR = 2.4;
  const tTag0 = t0 + 3.0;
  const tTagStep = 0.45;
  const tEnd0 = t0 + 4.6;
  TL.rain = { t: tRain, rampEnd: tRainRamp };
  TL.sheen = { t0: tSheen0, period: SHEEN_PERIOD, dur: SHEEN_DUR };
  cue('finaleRecede', TL.finA, { t1: TL.finB });
  anchor('end.recede', TL.finA);
  anchor('end.logo', tLogo);
  anchor('end.kicker', tTag0);
  anchor('end.title', tTag0 + tTagStep);
  anchor('end.row', tEnd0);
  cue('logoWipe', tLogo, { t1: tLogo + 1.15, scene: 'finale' });
  cue('rainStart', tRain, { t1: tRainRamp });
  tag.forEach((w, i) => cue('tagline', tTag0 + i * tTagStep, { t1: tTag0 + 0.6 + i * tTagStep, n: i + 1, scene: 'finale' }));
  cue('endCard', tEnd0, { t1: t0 + 5.4 });
  onFrame((t) => {
    const a = prog(t, t0 + 0.1, t0 + 1.5, ease.inOutCubic);
    O(root, a);
    if (a <= 0) return;
    S(grid, 'opacity', r3(a));
    drawRain(t, prog(t, tRain, tRainRamp, ease.outCubic));
    const p = prog(t, tLogo, tLogo + 1.15, ease.inOutCubic);
    S(stg, 'clipPath', `inset(0 ${r2((1 - p) * 100)}% 0 0)`);
    S(scan, 'left', r2(p * 100) + '%');
    S(scan, 'opacity', p > 0.001 && p < 0.999 ? 1 : 0);
    S(img, 'transform', `scale(${r3(1.06 - 0.06 * prog(t, tLogo, tLogo + 1.6, ease.outCubic))})`);
    const cyc = ((t - tSheen0) % SHEEN_PERIOD + SHEEN_PERIOD) % SHEEN_PERIOD;
    const sp = r2(lerp(100, 0, prog(cyc, 0, SHEEN_DUR, ease.inOutCubic)));
    S(sheen, 'maskPosition', `${sp}% 0`);
    S(sheen, 'webkitMaskPosition', `${sp}% 0`);
    S(glow, 'opacity', r3(0.65 + 0.35 * Math.sin(t * 1.9)));
    root.querySelectorAll('.corner').forEach((c) => S(c, 'opacity', prog(t, tLogo - 0.2, tLogo + 0.4)));
    tag.forEach((w, i) => {
      const u = prog(t, tTag0 + i * tTagStep, tTag0 + 0.6 + i * tTagStep, ease.outCubic);
      S(w, 'opacity', u);
      S(w, 'transform', `translateY(${r2((1 - u) * 24)}px)`);
      S(w, 'filter', u < 1 ? `blur(${r2((1 - u) * 6)}px)` : '');
    });
    const e = prog(t, tEnd0, t0 + 5.4, ease.outCubic);
    S(end, 'opacity', e);
    S(end, 'transform', `translateY(${r2((1 - e) * 22)}px)`);
    S(fine, 'opacity', r3(prog(t, t0 + 5.2, t0 + 5.8) * 0.9));
  });
  return t0 + 7.6 + (o.hold || 0); // o.hold: extra seconds to linger on the end card (the rain keeps falling)
}

/* ---- shared/70-audio-cues.js ---- */
// ---------------------------------------------------------------------------
// Audio cue export. The page is silent; this only publishes WHEN things happen so
// build_soundtrack.py can score the MP4. Every time comes from the same variables the
// animations use (see cue() calls in the scene files), so sound cannot drift from picture.
//
//   window.AUDIO_CUES    object (see shape below)
//   window.getAudioCues() JSON string of the same object
//
// Shape: { version, duration, tail, chapters[], clicks[], tools[], events[] }
//   chapters[]  {t, label}                       chapter start times (CHAPTERS)
//   clicks[]    {t, kind, x, y, pan, zone, tool} every cursor click (CLICKS); x/y stage px at click time,
//                                                pan -1..1 from x, zone 'canvas'|'chrome', tool = a toolbar/menu tool was selected by it
//   tools[]     {t, id, badge, click}            tool selections (TOOLSEL); click = a click accompanies it
//   events[]    {kind, t, ...}                   one-shot semantic cues, sorted by t (kinds listed in README);
//                                                cues carrying sheet coords (sx, sy) also get stage x, y, pan; `follow` cues get
//                                                x0/x1/pan0/pan1 from the cursor at t and t1
// Periodic finale material (logo sheen, rain pings) is expanded up to SCENE_END + AUDIO_TAIL seconds.
// ---------------------------------------------------------------------------
const AUDIO_TAIL = 12;

function buildAudioCues() {
  const end = window.SCENE_END;
  const horizon = end + AUDIO_TAIL;
  const R = (v) => Math.round(v * 1e5) / 1e5;
  const round = (v) => (typeof v === 'number' ? R(v) : Array.isArray(v) ? v.map(round) : v);
  const cleanObj = (o) => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, round(v)]));

  // periodic finale logo sheen: sweeps at sheen.t0 + k * period for `dur` seconds
  for (let k = 0; TL.sheen && TL.sheen.t0 + k * TL.sheen.period < horizon; k++) {
    const t = TL.sheen.t0 + k * TL.sheen.period;
    cue('logoSheen', t, { t1: t + TL.sheen.dur, scene: 'finale', k });
  }

  // icon-rain twinkles: every particle emits one ping when its sprite crosses the mid line (y = 540)
  const rampAt = (t) => prog(t, TL.rain.t, TL.rain.rampEnd, ease.outCubic) * prog(t, TL.finA + 0.1, TL.finA + 1.5, ease.inOutCubic);
  for (const p of TL.rain ? RAIN.parts : []) {
    const { dimS, span, size } = rainGeom(p);
    for (let j = 0; ; j++) {
      const t = p.t0 + (540 + dimS + j * span) / p.v;
      if (t >= horizon) break;
      const level = RAIN_TIERS[p.tier].alpha * rampAt(t);
      if (level < 0.03) continue;
      const x = rainPos(p, t)[0];
      cue('rainPing', t, { tier: p.tier, size: R(size), x: R(x), pan: R(clamp(x / (STAGE_W / 2) - 1, -1, 1)), level: R(level) });
    }
  }

  const toolSel = TOOLSEL.filter((s) => s.t >= 0 && s.id && s.id !== 'select');
  const clicks = CLICKS.slice()
    .sort((a, b) => a.t - b.t)
    .map((c) => {
      const p = cursorPos(c.t);
      return {
        t: R(c.t),
        kind: c.kind,
        x: R(p[0]),
        y: R(p[1]),
        pan: R(clamp(p[0] / (STAGE_W / 2) - 1, -1, 1)),
        zone: p[1] < CV.y || p[0] < CV.x ? 'chrome' : 'canvas',
        tool: toolSel.some((s) => Math.abs(s.t - c.t) < 0.1),
      };
    });
  const tools = toolSel.map((s) => ({ t: R(s.t), id: s.id, badge: s.badge || null, click: CLICKS.some((c) => Math.abs(c.t - s.t) < 0.12) }));
  const panOf = (x) => R(clamp(x / (STAGE_W / 2) - 1, -1, 1));
  const events = CUES.map((c) => {
    const o = { ...c };
    if (o.sx != null) {
      const p = sheetToStage(o.sx, o.sy, o.t);
      Object.assign(o, { x: p[0], y: p[1], pan: panOf(p[0]) });
    }
    if (o.follow) {
      const a = cursorPos(o.t)[0];
      const b = cursorPos(o.t1)[0];
      Object.assign(o, { x0: a, x1: b, pan0: panOf(a), pan1: panOf(b) });
      delete o.follow;
    }
    return cleanObj(o);
  }).sort((a, b) => a.t - b.t || (a.kind < b.kind ? -1 : a.kind > b.kind ? 1 : 0));

  window.AUDIO_CUES = {
    version: 1,
    duration: R(end),
    tail: AUDIO_TAIL,
    chapters: CHAPTERS.map((c) => ({ t: R(c.t), label: c.label })),
    clicks,
    tools,
    events,
  };
  window.getAudioCues = () => JSON.stringify(window.AUDIO_CUES);
}

    const tag = (x, col, str) => `<path d="M${x} ${y + 18} h120 v74 h-120 z" fill="${col}" stroke="#333"/><circle cx="${x + 16}" cy="${y + 34}" r="6" fill="#fff" stroke="#333"/><text x="${x + 60}" y="${y + 62}" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">${str}</text>`;
    s.push(tag(x0 + 20, '#2e7d32', 'SAFE'), tag(x0 + 170, '#c62828', 'DO NOT USE'));

  if (kind === 'evac') {
    const h = 230;
    s.push(`<rect x="${x0}" y="${y}" width="${TW}" height="${h}" fill="#fff" stroke="#9aa0a6" stroke-width="0.8"/>`);
    s.push(`<rect x="${x0 + 40}" y="${y + 30}" width="300" height="160" fill="#f1f3f5" stroke="#444" stroke-width="2"/>`);
    s.push(`<path d="M${x0 + 190} ${y + 30} V${y + 190} M${x0 + 40} ${y + 110} H${x0 + 340}" stroke="#888" stroke-width="1"/>`);
    const arrow = (x1, y1, x2, y2) => `<path d="M${x1} ${y1} L${x2} ${y2}" stroke="#2e7d32" stroke-width="3" marker-end="url(#pdArrow)"/>`;
    s.push(arrow(x0 + 110, y + 70, x0 + 40, y + 70), arrow(x0 + 270, y + 150, x0 + 340, y + 150), arrow(x0 + 190, y + 110, x0 + 190, y + 190));
    s.push(`<circle cx="${x0 + 400}" cy="${y + 120}" r="22" fill="#fff" stroke="#2e7d32" stroke-width="2"/>`, `<text x="${x0 + 400}" y="${y + 160}" font-size="9" text-anchor="middle" fill="#2e7d32">ASSEMBLY POINT</text>`);
    s.push(`<text x="${x0 + 46}" y="${y + 62}" font-size="9" fill="#2e7d32">EXIT</text>`, `<text x="${x0 + 300}" y="${y + 142}" font-size="9" fill="#2e7d32">EXIT</text>`);

/** One page as SVG markup (page coordinates, 595 x 842). Records geometry for page 10. */
function pdPageSVG(n) {
  const s = [`<rect width="${PD.PW}" height="${PD.PH}" fill="${PD.PAPER}"/>`];
  const T = (x, y, str, size, o = {}) => `<text x="${r2(x)}" y="${r2(y)}" font-size="${size}"${o.w ? ` font-weight="${o.w}"` : ''}${o.anchor ? ` text-anchor="${o.anchor}"` : ''} fill="${o.fill || PD.INK}">${pdEsc(str)}</text>`;
  if (n === 1) {
    s.push(`<rect x="0" y="0" width="${PD.PW}" height="16" fill="#e0a526"/>`, `<rect x="${ML}" y="250" width="54" height="5" fill="#e0a526"/>`);
    s.push(T(ML, 300, 'SITE SAFETY HANDBOOK', 30, { w: 700 }), T(ML, 340, 'Fictitious sample - Sample Holdings Inc.', 14), T(ML, 365, 'Revision A - for tutorial use only', 11));
  } else if (n === 2) {
    s.push(T(ML, 90, 'Contents', 22, { w: 700 }));
    let y = 140;
    for (const [lvl, t, pg] of PD.TOC) {
      s.push(T(ML + (lvl - 1) * 24, y, t, lvl === 2 ? 11 : 12, { w: lvl === 2 ? 400 : 700 }), T(470, y, String(pg), 11));
      y += 22;
    }
  } else {
    let y = 90;
    for (const b of PG[n] || []) {
      if (b.h1) {
        s.push(T(ML, y, b.h1, 20, { w: 700 }));
        y += 34;
      } else if (b.h2) {
        s.push(T(ML, y, b.h2, 14, { w: 700 }));
        y += 26;
      } else if (b.p) {
        for (const ln of pdWrap(b.p, TW, 11)) {
          s.push(T(ML, y, ln, 11));
          y += 16;
        }
        y += 12;
      } else if (b.list) {
        s.push(T(ML, y, b.list.title, 11.5, { w: 700 }));
        y += 18;
        for (const it of b.list.items) {
          s.push(`<rect x="${ML + 4}" y="${y - 9}" width="9" height="9" fill="none" stroke="#333" stroke-width="0.9"/>`, T(ML + 22, y, it, 11));
          y += 17;
        }
        y += 14;
      } else if (b.hazard) {
        const lines = pdWrap(b.hazard, TW - 92, 13, 700);
        const h = 26 + lines.length * 19;
        s.push(`<rect x="${ML}" y="${y - 6}" width="${TW}" height="${h}" rx="3" fill="#fdecea" stroke="#c62828" stroke-width="1.6"/>`);
        s.push(`<rect x="${ML}" y="${y - 6}" width="74" height="${h}" rx="3" fill="#c62828"/>`, `<path d="M${ML + 37} ${y + 4} l14 24 h-28 z" fill="#fff"/>`, `<text x="${ML + 37}" y="${y + 24}" font-size="12" font-weight="700" text-anchor="middle" fill="#c62828">!</text>`, T(ML + 37, y + 46, 'HAZARD', 9.5, { w: 700, anchor: 'middle', fill: '#fff' }));
        const lineY = [];
        lines.forEach((ln, i) => {
          const ly = y + 18 + i * 19;
          s.push(T(ML + 88, ly, ln, 13, { w: 700, fill: '#7f1414' }));
          lineY.push({ y: ly, x0: ML + 88, x1: ML + 88 + pdTextW(ln, 13, 700), text: ln });
        });
        if (n === PD.MK_PAGE) PD.GEO.hazard = { x: ML, y: y - 6, w: TW, h, lines: lineY };
        y += h + 18;
      } else if (b.table) {
        const tb = b.table;
        s.push(T(ML, y, tb.title, 11.5, { w: 700 }));
        y += 10;
        const rh = 22;
        const top = y;
        const xs = [ML];
        tb.w.forEach((f) => xs.push(xs[xs.length - 1] + f * TW));
        s.push(`<rect x="${ML}" y="${y}" width="${TW}" height="${rh}" fill="#dfe3e8"/>`);
        tb.cols.forEach((c, i) => s.push(T(xs[i] + 8, y + 15, c, 10.5, { w: 700 })));
        y += rh;
        tb.rows.forEach((row, ri) => {
          if (ri % 2 === 1) s.push(`<rect x="${ML}" y="${y}" width="${TW}" height="${rh}" fill="#eceff2"/>`);
          row.forEach((c, i) => {
            if (tb.box && i > 0) s.push(`<rect x="${xs[i] + 10}" y="${y + 6}" width="10" height="10" fill="#fff" stroke="#555" stroke-width="0.8"/>`);
            else s.push(T(xs[i] + 8, y + 15, c, 10.5));
          });
          y += rh;
        });
        s.push(`<rect x="${ML}" y="${top}" width="${TW}" height="${y - top}" fill="none" stroke="#8a9096" stroke-width="0.9"/>`);
        xs.slice(1, -1).forEach((x) => s.push(`<path d="M${r2(x)} ${top} V${y}" stroke="#8a9096" stroke-width="0.6"/>`));
        for (let yy = top + rh; yy < y; yy += rh) s.push(`<path d="M${ML} ${yy} H${ML + TW}" stroke="#b6bbc0" stroke-width="0.5"/>`);
        if (n === PD.MK_PAGE && tb.id === 'edge') PD.GEO.table = { x: ML, y: top - 22, w: TW, h: y - top + 26 };
        y += 24;
      } else if (b.fig) {
        const f = pdFigure(b.fig.kind, y);
        s.push(f.svg);
        y += f.h + 16;
        s.push(T(ML, y, b.fig.caption, 9.5, { fill: '#444' }));
        y += 26;
      } else if (b.form) {
        for (const lab of b.form) {
          s.push(T(ML, y, lab, 10.5, { w: 700 }), `<rect x="${ML}" y="${y + 6}" width="${TW}" height="38" fill="#fff" stroke="#8a9096" stroke-width="0.8"/>`);
          y += 62;
        }
      } else if (b.sign) {
        for (let i = 0; i < b.sign; i++) {
          [['Name', 0], ['Signature', 170], ['Date', 340]].forEach(([lab, dx]) => s.push(T(ML + dx, y + 30, lab, 10, { fill: '#555' }), `<path d="M${ML + dx} ${y + 16} h150" stroke="#555" stroke-width="0.8"/>`));
          y += 56;
        }
        s.push(T(ML, y + 30, 'Supervisor', 10, { fill: '#555' }), `<path d="M${ML} ${y + 16} h300" stroke="#555" stroke-width="0.8"/>`);
      }
    }
  }
  s.push(T(ML, PD.PH - 40, `Site Safety Handbook (fictitious)   |   Page ${n} of 24`, 9));
  return s.join('');
}

/** Builds every page as an SVG <symbol id="pdpg-N"> in one hidden <svg> (thumbnails, the views and the export cards all <use> them). */
function pdBuildPages(host) {
  const defs = [`<marker id="pdArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2e7d32"/></marker>`];
  for (let n = 1; n <= PD.N; n++) defs.push(`<symbol id="pdpg-${n}" viewBox="0 0 ${PD.PW} ${PD.PH}" font-family="${PD.FONT}">${pdPageSVG(n)}</symbol>`);
  const svg = h('div', { style: 'position:absolute;width:0;height:0;overflow:hidden' }, `<svg xmlns="${NS}" width="0" height="0"><defs>${defs.join('')}<g id="pdmk"></g></defs></svg>`);
  host.appendChild(svg);
  PD.mkLayer = svg.querySelector('#pdmk');
}

/* ---- parts/d/12-hands.js ---- */
// ---------------------------------------------------------------------------
// Part 4 - detailed vector hands for the touch-gesture scene (inline SVG, no images), plus a mouse and a trackpad.
//
// Flat illustration style: one skin colour, one outline around the whole hand, short joint lines and flat nails; no
// gradients or 3D shading. A hand is built from "limbs" (fingers, thumb, curled fingers) laid along a jointed axis, so one
// builder serves every pose. Proportions follow drawing guides and hand anthropometry: the middle finger (knuckle to tip) is
// as long as the back of the hand (wrist to knuckle, 1 : 1), the index finger is about 0.9 of the middle finger, finger
// segments split about 50 / 30 / 20 %, the hand is about 0.45 as wide as it is long, the knuckles arc up to the middle
// finger, and the thumb leaves the side of the hand near the wrist. All skin parts sit in one group whose outline is drawn by a filter around their union, so the
// silhouette has no seams; a faint contact line stays only where one part lies over another. Everything is a pure function
// of the pose parameters, so the scenes can animate it frame by frame.
// ---------------------------------------------------------------------------
const SKIN = {
  base: '#e8b48f',
  outline: '#8a5236',
  line: 'rgba(138, 82, 54, 0.55)',
  crease: 'rgba(138, 82, 54, 0.45)',
  nail: '#f6d9c6',
  sleeve: '#2f4c70',
  cuff: '#3f6390',
};
let HANDN = 0;
const dirOf = (a) => [Math.sin((a * Math.PI) / 180), -Math.cos((a * Math.PI) / 180)]; // 0 deg = up, positive = clockwise

/** Axis of a jointed limb: base point, start angle, segment lengths, flex per joint (deg, + = clockwise). */
function limbAxis(base, ang, segs, flex) {
  const pts = [base.slice()];
  const angs = [];
  let a = ang;
  let p = base;
  segs.forEach((l, i) => {
    const d = dirOf(a);
    p = [p[0] + d[0] * l, p[1] + d[1] * l];
    pts.push(p);
    angs.push(a);
    a += (flex && flex[i]) || 0;
  });
  return { pts, angs };
}

/** Outline points of a limb (left side up, rounded tip, right side down); widths has one entry per axis point. */
function limbOutline(ax, widths) {
  const { pts, angs } = ax;
  const n = pts.length;
  const L = [];
  const R = [];
  const nrm = [];
  const wTip = widths[n - 1];
  const rT = wTip / 2;
  const lastD = dirOf(angs[angs.length - 1]);
  const cap = [pts[n - 1][0] - lastD[0] * rT, pts[n - 1][1] - lastD[1] * rT]; // centre of the rounded tip
  for (let i = 0; i < n - 1; i++) {
    const a = i === 0 ? angs[0] : (angs[i - 1] + angs[i]) / 2;
    const d = dirOf(a);
    const nx = -d[1];
    const ny = d[0]; // normal pointing to the right of the direction
    nrm.push([nx, ny]);
    const hw = widths[i] / 2 + (i > 0 ? 0.9 : 0); // a little swelling at the joints
    L.push([pts[i][0] - nx * hw, pts[i][1] - ny * hw]);
    R.push([pts[i][0] + nx * hw, pts[i][1] + ny * hw]);
    if (i < n - 2) {
      // waist between two joints: the shaft of a phalanx is a touch slimmer than its joints
      const m = [(pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2];
      const dm = dirOf(angs[i]);
      const hm = (widths[i] + widths[i + 1]) / 4 - 0.8;
      L.push([m[0] + dm[1] * hm, m[1] - dm[0] * hm]);
      R.push([m[0] - dm[1] * hm, m[1] + dm[0] * hm]);
    }
  }
  const dn = [-lastD[1], lastD[0]];
  nrm.push(dn);
  L.push([cap[0] - dn[0] * rT, cap[1] - dn[1] * rT]);
  R.push([cap[0] + dn[0] * rT, cap[1] + dn[1] * rT]);
  const arc = [];
  for (let k = 1; k < 8; k++) {
    const th = Math.PI - (k / 8) * Math.PI; // from the left side over the tip to the right side
    const c = Math.cos(th);
    const s = Math.sin(th);
    // the tip is a little flatter than a half circle (a finger pad, not a ball)
    arc.push([cap[0] + dn[0] * c * rT + lastD[0] * s * rT * 0.9, cap[1] + dn[1] * c * rT + lastD[1] * s * rT * 0.9]);
  }
  return { ring: L.concat(arc, R.reverse()), cap, rT, lastD, nrm };
}

let _limbId = 0;
/**
 * A limb element: build once, then pose(ax, widths) every frame. Flat style: one skin fill, a faint contact line (only seen
 * where the limb lies over another part), short joint lines and a flat nail.
 * o: { nail, nailSide: -1..1, nailW, creases: [[segIndex, count]], stub (a curled finger seen from the back) }
 */
function mkLimb(parent, defs, o = {}) {
  const g = sv('g', {}, parent);
  const fill = sv('path', { fill: SKIN.base }, g);
  const line = sv('path', { fill: 'none', stroke: SKIN.line, 'stroke-width': 1.6 }, g);
  const crG = sv('g', { fill: 'none', stroke: SKIN.crease, 'stroke-width': 1.6, 'stroke-linecap': 'round' }, g);
  const creases = (o.creases || []).map(([seg]) => ({ seg, el: sv('path', {}, crG) }));
  const nail = o.nail ? sv('path', { fill: SKIN.nail }, g) : null;
  return {
    g,
    pose(ax, widths) {
      const { ring, cap, rT } = limbOutline(ax, widths);
      const d = splinePathD(ring, true);
      A(fill, 'd', d);
      A(line, 'd', d);
      // one short, slightly bowed line per joint (a curled finger: on its rounded end, the bent middle joint)
      creases.forEach((c) => {
        const i = c.seg;
        const last = i >= ax.pts.length - 1;
        const p = last ? cap : ax.pts[i];
        const a = i === 0 ? ax.angs[0] : last ? ax.angs[ax.angs.length - 1] : (ax.angs[i - 1] + ax.angs[i]) / 2;
        const half = widths[Math.min(i, widths.length - 1)] * 0.2;
        A(c.el, 'd', `M${r2(-half)} 0 Q0 2.5 ${r2(half)} 0`);
        A(c.el, 'transform', `translate(${r2(p[0])} ${r2(p[1])}) rotate(${r2(a)})`);
      });
      if (nail) {
        const a = ax.angs[ax.angs.length - 1];
        const segL = Math.hypot(ax.pts[ax.pts.length - 1][0] - ax.pts[ax.pts.length - 2][0], ax.pts[ax.pts.length - 1][1] - ax.pts[ax.pts.length - 2][1]);
        const nw = widths[widths.length - 2] * (o.nailW || 0.56);
        const top = -rT * 0.6;
        const bot = top + Math.max(10, segL * 0.5);
        const sx = (o.nailSide || 0) * nw * 0.2;
        const x0 = sx - nw / 2;
        const x1 = sx + nw / 2;
        A(nail, 'd', `M${r2(x0)} ${r2(bot)} V${r2(top + nw * 0.45)} A${r2(nw / 2)} ${r2(nw / 2)} 0 0 1 ${r2(x1)} ${r2(top + nw * 0.45)} V${r2(bot)} Q${r2(sx)} ${r2(bot + 3)} ${r2(x0)} ${r2(bot)} Z`);
        A(nail, 'transform', `translate(${r2(cap[0])} ${r2(cap[1])}) rotate(${r2(a)})`);
      }
      return { cap, rT };
    },
  };
}

/** Shared <defs> of one hand: the union outline and a soft drop shadow. */
function handDefs(svg) {
  const defs = sv('defs', {}, svg);
  const k = HANDN;
  defs.innerHTML = `
    <filter id="hol_${k}" x="-20%" y="-20%" width="140%" height="140%"><feMorphology in="SourceAlpha" operator="dilate" radius="1.6" result="d"/><feFlood flood-color="${SKIN.outline}"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="hsh_${k}" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="10" dy="16" stdDeviation="10" flood-color="#000" flood-opacity="0.22"/></filter>`;
  return defs;
}

/** Back of the hand: one flat shape over the roots of the fingers (the skin group's union outline draws its edge). */
function mkPalm(parent, defs, pts) {
  return sv('path', { d: splinePathD(pts, true), fill: SKIN.base }, parent);
}

/** Wrist skin (inside the skin group, so the outline wraps it with the hand). */
function mkWrist(parent) {
  return sv('path', { d: 'M-54 -20 C-56 14 -57 40 -58 72 L56 72 C59 40 58 14 56 -20 Z', fill: SKIN.base }, parent);
}

/** Flat cuff and sleeve, drawn over the bottom of the wrist. */
function mkSleeve(parent) {
  const g = sv('g', {}, parent);
  sv('path', { d: 'M-62 36 C-66 100 -72 180 -80 320 L86 320 C80 180 72 100 68 36 Z', fill: SKIN.sleeve }, g);
  sv('path', { d: 'M-60 22 Q2 14 62 22 L64 50 Q2 42 -62 50 Z', fill: SKIN.cuff }, g);
  return g;
}

/** Touch disc (brand blue ring, faint translucent fill, soft glow; open centre so the fingertip and nail stay visible). */
function mkDisc(parent) {
  const g = sv('g', { opacity: 0 }, parent);
  sv('circle', { r: 38, fill: 'rgba(0,122,204,0.07)', stroke: 'rgba(0,122,204,0.28)', 'stroke-width': 10 }, g);
  sv('circle', { r: 33, fill: 'none', stroke: '#007acc', 'stroke-width': 3.4 }, g);
  return g;
}

/** The svg, defs, shadowed root and outlined skin group shared by both hands. */
function handShell(host) {
  HANDN++;
  const el = h('div', { class: 'pd-hand' });
  host.appendChild(el);
  const svg = sv('svg', { width: 760, height: 900, viewBox: '-380 -560 760 900', style: 'overflow:visible' }, null);
  el.appendChild(svg);
  const defs = handDefs(svg);
  const root = sv('g', { filter: `url(#hsh_${HANDN})` }, svg);
  const skin = sv('g', { filter: `url(#hol_${HANDN})` }, root);
  return { el, svg, defs, root, skin };
}

/**
 * Back of the hand, shared by both hands. Wrist centre (0, 0), fingers up. It is about as wide at the knuckles (~130) as the
 * fingers are long, narrows to the wrist (~104), and its left edge runs straight up the index side: the thumb and the web
 * between thumb and index are separate shapes, so the hand gets the deep thumb notch a foot does not have.
 */
const PALM = [[-52, 40], [-53, 0], [-57, -40], [-62, -90], [-66, -128], [-64, -152], [-52, -168], [-34, -166], [-16, -176], [2, -170], [20, -172], [36, -162], [52, -158], [68, -144], [76, -118], [76, -80], [66, -36], [57, 0], [56, 40]];

/**
 * Thumb with its metacarpal: it leaves the hand near the wrist and angles away from the fingers, so the hand's left edge
 * runs wrist -> outside of the thumb -> tip -> inside of the thumb -> the web (a shallow concave curve) -> the index finger.
 * pose(aM, aP, aD, ia): metacarpal / first / last segment angles (deg) and the index axis (for the web).
 */
function mkThumb(skin, defs) {
  const web = sv('path', { fill: SKIN.base }, skin);
  const thumb = mkLimb(skin, defs, { nail: true, nailSide: -0.5, nailW: 0.5, creases: [[2, 1]] });
  return {
    pose(aM, aP, aD, ia) {
      const ax = limbAxis([-30, -8], aM, [90, 44, 36], [aP - aM, aD - aP]);
      const c = thumb.pose(ax, [44, 40, 35, 31]);
      // web: from the inside of the thumb's first segment to the index finger's left side, bowed toward the wrist
      const m = ax.pts[1];
      const dP = dirOf(aP);
      const a = [m[0] + dP[0] * 10 - dP[1] * 17, m[1] + dP[1] * 10 + dP[0] * 17];
      const dI = dirOf(ia.angs[0]);
      const b = [ia.pts[0][0] + dI[0] * 18 + dI[1] * 16, ia.pts[0][1] + dI[1] * 18 - dI[0] * 16];
      const ctrl = [(a[0] + b[0]) / 2 + 10, (a[1] + b[1]) / 2 + 14];
      A(web, 'd', `M${r2(a[0])} ${r2(a[1])} Q${r2(ctrl[0])} ${r2(ctrl[1])} ${r2(b[0])} ${r2(b[1])} L-30 -150 L-30 -10 Z`);
      return c;
    },
  };
}

// ------------------------------------------------------------------------------------------------- two-finger hand
/**
 * Right hand seen from the back, index and middle finger extended together (two-finger drag), ring and little finger curled
 * under (only their knuckles show, stepping down toward the little finger), thumb relaxed out to the side.
 * Local frame: wrist centre at (0, 0), fingers point up. Returns { el, svg, tips }.
 */
function mkTwoFingerHand(host) {
  const { el, svg, defs, root, skin } = handShell(host);
  mkWrist(skin);
  const thumb = mkThumb(skin, defs);
  const little = mkLimb(skin, defs, { stub: true });
  const ring = mkLimb(skin, defs, { stub: true });
  const index = mkLimb(skin, defs, { nail: true, creases: [[1, 1], [2, 1]] });
  const middle = mkLimb(skin, defs, { nail: true, creases: [[1, 1], [2, 1]] });
  ring.pose(limbAxis([20, -154], 10, [34], []), [33, 32]);
  little.pose(limbAxis([51, -142], 20, [26], []), [29, 28]);
  const ia = limbAxis([-48, -154], -5, [74, 44, 30], [2, 1]);
  const ma = limbAxis([-14, -162], 1, [82, 49, 33], [-1, -1]);
  const ti = index.pose(ia, [33, 30, 28, 26]);
  const tm = middle.pose(ma, [34, 31, 29, 27]);
  thumb.pose(-34, -28, -20, ia);
  mkPalm(skin, defs, PALM);
  mkSleeve(root);
  // touch points: the finger pads, just behind the rounded tips
  const tips = [ti, tm].map((c) => [c.cap[0], c.cap[1] - 2]);
  return { el, svg, tips };
}

/**
 * Right hand from the back: thumb and index make the pinch, middle / ring / little finger curled. pose(s): s = 0 gives the
 * starting spread (thumb turned in toward the index), s = 1 the open spread (thumb swung out); the tips are returned so the
 * touch discs (and the zoom) follow them.

function mkPinchHand(host) {
  const { el, svg, defs, root, skin } = handShell(host);
  mkWrist(skin);
  const thumb = mkThumb(skin, defs);
  const little = mkLimb(skin, defs, { stub: true });
  const ring = mkLimb(skin, defs, { stub: true });
  const middle = mkLimb(skin, defs, { stub: true });
  const index = mkLimb(skin, defs, { nail: true, creases: [[1, 1], [2, 1]] });
  middle.pose(limbAxis([-14, -162], 4, [40], []), [35, 34]);
  ring.pose(limbAxis([20, -154], 10, [34], []), [33, 32]);
  little.pose(limbAxis([51, -142], 20, [26], []), [29, 28]);
  mkPalm(skin, defs, PALM);
  mkSleeve(root);
  const api = {
    el,
    svg,
    tips: null,
    /** s in [0, 1]: 0 = starting spread, 1 = open. Returns the two touch points (index, thumb) in local coordinates. */
    pose(s) {
      const aI = lerp(-24, 6, s);
      const ia = limbAxis([-48, -154], aI, [74, 44, 30], [lerp(-10, -6, s), lerp(-8, -4, s)]);
      const ti = index.pose(ia, [33, 30, 28, 26]);

/* ---- parts/d/15-helpers.js ---- */
// ---------------------------------------------------------------------------
// Part 4 - helpers used by the scenes.
//   narration slots   say('id', t) takes a speech slot at time t (js/05-voice.js knows how long it is, generated by
//                     parts/d/sync_voice.py); act() records "this action needs that sentence" so checkPacing() reports any
//                     action that would start before it is announced, sentences closer than MIN_SLACK, overlapping captions
//                     and key chips without a free lane (window.PB_PACING, the same contract as Part 2).
//   UI camera         the recreated app sits in #pdCam; ucam() keys a zoom/pan of the whole app (the status bar is only
//                     34 px tall at the very bottom, so the camera lifts it into frame before the cursor clicks it: the
//                     52 x 82 px cursor arrow must stay inside the 1920 x 1080 stage). The cursor stays in stage space and
//                     is keyed through the camera (cu / cuFollow), so it never scales and the cursor probe reads it as is.
//   chips, captions   key chips with one or more keycaps; lower-third captions held 2.5 s + 0.28 s per word.
// Everything is a pure function of the master time once the timeline is built.
// ---------------------------------------------------------------------------
const PB_LOG = { say: [], acts: [], caps: [], bad: [] };
const MIN_SLACK = 0.12; // the mix keeps at least this between two sentences
const vdur = (id) => {
  const v = typeof VOICE !== 'undefined' ? VOICE[id] : null;
  if (!v) {
    PB_LOG.bad.push(`no spoken length for narration piece ${id} (run parts/d/sync_voice.py)`);
    return 2;
  }
  return v.dur;
};
/** Take the speech slot of piece `id` at time t. Returns { id, t0, t1 }. */
function say(id, t) {
  const s = { id, t0: t, t1: t + vdur(id) };
  anchor('say.' + id, t);
  PB_LOG.say.push(s);
  return s;
}
/** An action (key press, click, camera move) that sentence `s` announces: it must not start before the sentence does. */
function act(label, t, s) {
  PB_LOG.acts.push({ label, t, id: s.id });
  if (t < s.t0 - 0.02) PB_LOG.bad.push(`action "${label}" at ${t.toFixed(2)} s starts before its sentence ${s.id} (${s.t0.toFixed(2)} s)`);
  return t;
}
/** Next speech slot after sentence s (or a time) plus a breath. */
const after = (s, gap = 0.3) => (typeof s === 'number' ? s : s.t1) + gap;

// ---------------------------------------------------------------- key chips (top right of the canvas unless o.at)
const KEY_X = 1520;
const KEY_Y = 176;
const CHIP_LANES = [[], [], []];
/**
 * A keycap chip ("Ctrl" + "→", or "C") pressed at tKey: visible from 0.45 s before the press to o.hold after it (default 1.8,
 * so at least 2.25 s), stacked in a free lane. keys: string or array of strings; o: { label, hold, at: [x, y], tKeys: [t...] }.
 */
function chip(tKey, keys, o = {}) {
  const list = Array.isArray(keys) ? keys : [keys];
  const t0 = tKey - 0.45;
  const t1 = tKey + Math.max(1.75, o.hold != null ? o.hold : 1.8); // a chip stays at least 2.2 s (0.45 s before the press + 1.75 s after)
  let x = KEY_X;
  let y = KEY_Y;
  if (o.at) [x, y] = o.at;
  else {
    let lane = 0;
    while (lane < CHIP_LANES.length && CHIP_LANES[lane].some(([a, b]) => t0 < b + 0.05 && t1 > a - 0.05)) lane++;
    if (lane >= CHIP_LANES.length) {
      PB_LOG.bad.push(`no free chip lane at ${tKey.toFixed(2)} s (${list.join('+')})`);
      lane = 0;
    }
    CHIP_LANES[lane].push([t0, t1]);
    y += lane * 84;
  }
  const caps = list.map((k) => `<div class="key">${k}</div>`).join(`<div class="plus">${o.sep || '+'}</div>`);
  const el = h('div', { class: 'keys small pd-keys', style: `left:${x}px;top:${y}px` }, `${caps}${o.label ? `<span class="klabel">${o.label}</span>` : ''}`);
  OV().appendChild(el);
  timed(el, t0, t1, { dy: 10, fin: 0.22, fout: 0.2 });
  const capEls = Array.from(el.querySelectorAll('.key'));
  const presses = o.tKeys || list.map(() => tKey);
  presses.forEach((tp, i) => cue('keyPress', tp, { key: list[i] || list[0] }));
  onFrame((t) => capEls.forEach((c, i) => S(c, 'transform', `translateY(${r2(pulse(t, presses[i] ?? tKey, (presses[i] ?? tKey) + 0.26) * 5)}px)`)));
  return el;
}

/** Lower-third caption, held 2.5 s plus 0.28 s per word of its second line (at least 4.2 s). Returns its end time. */
function cap(t0, title, sub, icon, pos = {}) {
  const words = sub.split(/\s+/).length;
  const dur = Math.max(4.2, 2.5 + 0.28 * words);
  caption(t0, t0 + dur, title, sub, icon, pos.left);
  const el = OV().lastElementChild;
  el.style.zIndex = '9';
  if (pos.top != null) el.style.top = pos.top + 'px';
  if (pos.maxW != null) el.style.maxWidth = pos.maxW + 'px';
  PB_LOG.caps.push({ t0, t1: t0 + dur, title });
  return t0 + dur;
}

function checkPacing() {
  const s = PB_LOG.say.slice().sort((a, b) => a.t0 - b.t0);
  for (let i = 1; i < s.length; i++) if (s[i].t0 < s[i - 1].t1 + MIN_SLACK - 0.001) PB_LOG.bad.push(`sentences ${s[i - 1].id} (ends ${s[i - 1].t1.toFixed(2)}) and ${s[i].id} (starts ${s[i].t0.toFixed(2)}) are closer than ${MIN_SLACK} s`);
  const c = PB_LOG.caps.slice().sort((a, b) => a.t0 - b.t0);
  for (let i = 1; i < c.length; i++) if (c[i].t0 < c[i - 1].t1 - 0.001) PB_LOG.bad.push(`captions "${c[i - 1].title}" and "${c[i].title}" overlap`);
  const ids = new Set(s.map((x) => x.id));
  for (const id of Object.keys(typeof VOICE !== 'undefined' ? VOICE : {})) if (!ids.has(id)) PB_LOG.bad.push(`narration piece ${id} has no say() slot`);
  window.PB_PACING = { sentences: s.length, speech: r2(s.reduce((a, x) => a + (x.t1 - x.t0), 0)), actions: PB_LOG.acts.length, problems: PB_LOG.bad.slice() };
  if (PB_LOG.bad.length) console.error('Part 4 pacing check failed:\n' + PB_LOG.bad.join('\n'));
}

// ---------------------------------------------------------------- UI camera (zoom / pan of the whole recreated app)
const UCAM = { keys: [{ t: -1, s: 1, ox: 0, oy: 0, e: 'lin' }] };
/** Hold the previous framing until t0, then ease to (s, ox, oy) by t1. App point (x, y) shows at (ox + s x, oy + s y). */
function ucam(t0, t1, s, ox, oy, e = 'inOutCubic') {
  const k = UCAM.keys;
  const last = k[k.length - 1];
  if (last.t < t0) k.push({ t: t0, s: last.s, ox: last.ox, oy: last.oy, e: 'lin' });
  k.push({ t: t1, s, ox, oy, e });
}
/** Framing that shows app point (ax, ay) at stage point (sx, sy) with zoom s. */
const ucamFrame = (ax, ay, sx, sy, s) => ({ s, ox: sx - s * ax, oy: sy - s * ay });
const ucamTo = (t0, t1, f, e) => ucam(t0, t1, f.s, f.ox, f.oy, e);
function ucamAt(t) {
  const k = UCAM.keys;
  if (t <= k[0].t) return k[0];
  if (t >= k[k.length - 1].t) return k[k.length - 1];
  let i = 1;
  while (t >= k[i].t) i++;
  const a = k[i - 1];
  const b = k[i];
  const u = ease[b.e](invLerp(a.t, b.t, t));
  const s = Math.exp(lerp(Math.log(a.s), Math.log(b.s), u));
  // interpolate the fixed point so the move feels like one camera, not a zoom plus a slide
  return { s, ox: lerp(a.ox, b.ox, u), oy: lerp(a.oy, b.oy, u) };
}
const ucamPt = (x, y, t) => {
  const c = ucamAt(t);
  return [c.ox + c.s * x, c.oy + c.s * y];
};

// ---------------------------------------------------------------- cursor in app coordinates
const PDC = { ax: 2100, ay: 420, t: 0 };
/** Cursor key at app point (ax, ay), converted through the UI camera at time t (a stage-space key for the engine). */
function cu(t, ax, ay, o = {}) {
  const p = ucamPt(ax, ay, t);
  cGo(t, p[0], p[1], o);
  PDC.ax = ax;
  PDC.ay = ay;
  PDC.t = t + (o.hold != null ? o.hold : o.click ? 0.24 : 0);
  return t;
}
/** Keep the cursor on app point (ax, ay) from t0 to t1 while the UI camera moves (dense linear keys). */
function cuFollow(t0, t1, ax, ay) {
  for (let t = t0; t < t1 - 1e-6; t += 1 / 30) {
    const p = ucamPt(ax, ay, t);
    cGo(t, p[0], p[1], { e: 'lin' });
  }
  const p = ucamPt(ax, ay, t1);
  cGo(t1, p[0], p[1], { e: 'lin' });
  PDC.ax = ax;
  PDC.ay = ay;
  PDC.t = t1;
}
/** Stage point of an app point at time t (for overlays that must sit on the app). */
const appToStage = (x, y, t) => ucamPt(x, y, t);

// ---------------------------------------------------------------- small time helpers
/** Value of a step list [[t, v], ...] at time t. */
const stepAt = (list, t) => {
  let v = list[0][1];
  for (const [tt, vv] of list) if (t >= tt) v = vv;
  return v;
};
/** Toggle class `cls` on el while t is in any of the [t0, t1) windows. */
function hotWin(el, wins, cls = 'hot') {
  onFrame((t) => setClass(el, cls, wins.some(([a, b]) => t >= a && t < b)));
}
/** A short press pulse (scale) on an element at time tp. */
function pressAt(el, tp, amount = 0.12) {
  onFrame((t) => {
    const p = pulse(t, tp, tp + 0.28);
    if (p > 0.002) S(el, 'transform', `scale(${r3(1 - amount * p)})`);
    else if (t > tp + 0.28 && t < tp + 0.4) S(el, 'transform', '');
  });
}
/** Typed text visible at t: characters appear at times[k]. */
const typedAt = (str, times, t) => {
  let n = 0;
  for (let i = 0; i < times.length; i++) if (times[i] <= t) n = i + 1;
  return str.slice(0, n);
};
/** A gold pulse ring around an app-space rectangle (in the app layer, so it zooms with the UI camera). */
function ringAt(t0, t1, x, y, w, hh, o = {}) {
  const el = h('div', { class: 'pd-ring', style: `left:${x - 6}px;top:${y - 6}px;width:${w + 12}px;height:${hh + 12}px;border-radius:${o.r || 10}px` });
  (o.parent || PDUI.pop).appendChild(el);
  onFrame((t) => {
    const a = prog(t, t0, t0 + 0.3, ease.outCubic) * (1 - prog(t, t1 - 0.3, t1, ease.inQuad));
    O(el, a * (0.7 + 0.3 * Math.sin((t - t0) * 5.5)));
  });
  return el;
}

// ---------------------------------------------------------------- cursor visibility (collected, applied in buildPart)
const CURVIS = [[0, 0]];
/** Fade the cursor in (v = 1) or out (v = 0) over 0.4 s from t. */
function curVis(t, v) {
  const prev = CURVIS[CURVIS.length - 1][1];
  CURVIS.push([t, prev], [t + 0.4, v]);
}

// ---------------------------------------------------------------------------
// Part 4 - the recreated reading UI (pure functions of time once built).
//
// What is recreated, and from where (labels verified in the real web build, parts/_FEATURE-NOTES.md section 5):
//   shell      the series shell (src/shared/js/20-shell.js) wrapped in #pdCam (the UI camera), the View-mode toolbar of the
//              real app (Select | Fit to Screen, Fit to Width, continuous, crop | Print, Export Image, hide | rotate, layers),
//              the document title in the title bar, and a status bar rebuilt to the real one ("Viewing" / "Markup",
//              first / previous / "Page [n] of 24" / next / last, the round view button, the "Pages" 1 2 3 pill, the zoom).
//   side panel hover the rail -> flyout (Files first, as in the real app), Bookmarks / Table of Contents (nested, all expanded,
//              "p. N", the current page row blue, chevrons), Thumbnails ("PAGES 24", Scroll to current page, Rename,
//              "Thumbnail size" slider, auto-fill grid of cards: card = size + 28 px [S: PageThumbnailPane.tsx, index.css]),
//              Pin Sidebar / Unpin Sidebar (pin icon) and Close Sidebar (chevron); pinned = docked beside the canvas.
//   viewer     one or two panes; each pane has its own page / zoom / layout (single page with 1, 2 or 3 pages side by side,
//              or continuous with 1, 2 or 3 per row), a hover cluster at its top right, and the page markups.
//   zoom       the readout shows the real app's numbers: Fit to Screen = 107 %, Fit to Width = 312 % (A4, 1920 x 1080). The
//              drawn page size follows sc(z) = SC0 (z / 1.07)^SC_P, exact at both fits in this recreated canvas.
// ---------------------------------------------------------------------------
const PDUI = {};
const SC0 = (918 * 0.99) / PD.PH; // px per pt at Fit to Screen in the recreated canvas (918 px tall)
const SC_P = Math.log(((1862 * 0.99) / PD.PW) / SC0) / Math.log(3.12 / 1.07); // makes Fit to Width (3.12) fill 1862 px
const scOf = (z) => SC0 * Math.pow(z / 1.07, SC_P);
const GAP = 24 / SC0; // gap between pages in points (24 px at 107 %, as measured in the real app)
const PADX = 24;
const PANEL_W = 480; // the side panel (real 380 px x 1.26)

/** Eased 0..1 toggle: set(t, v) in time order, at(t). */
function mkTog(dur = 0.35, e = ease.inOutCubic) {
  const keys = [{ t: -1e9, from: 0, to: 0 }];
  const self = {
    keys,
    set(t, v, d = dur) {
      keys.push({ t, from: self.at(t), to: v, d });
      return self;
    },
    at(t) {
      let k = keys[0];
      for (const q of keys) if (q.t <= t) k = q;
      if (!k.d) return k.to;
      return lerp(k.from, k.to, e(clamp01((t - k.t) / k.d)));
    },
    final(t) {
      let k = keys[0];
      for (const q of keys) if (q.t <= t) k = q;
      return k.to;
    },
  };
  return self;
}
/** Discrete value list [[t, v]...] kept in time order. */
function mkStep(v0) {
  const list = [[-1e9, v0]];
  return {
    list,
    set(t, v) {
      list.push([t, v]);
      list.sort((a, b) => a[0] - b[0]);
    },
    at: (t) => stepAt(list, t),
    lastChange(t) {
      let c = list[0][0];
      for (const [tt] of list) if (tt <= t) c = tt;
      return c;
    },
  };
}

const PDS = {
  docOpen: 1e9,
  mode: mkStep('view'), // 'view' | 'markup'
  pan: mkStep(false), // Select / Pan toggle (A, or the toolbar button)
  space: mkStep(false), // Space held
  cursorKind: mkStep('arrow'), // 'arrow' | 'open' | 'closed'
  dark: mkTog(0.45),
  flyout: mkTog(0.3), // unpinned panel visible
  dock: mkTog(0.42), // pinned panel visible (shifts the toolbar, canvas and status bar)
  tab: mkStep('files'),
  collapsed: mkStep([]), // chapter indices folded in the Bookmarks pane
  thumbW: mkTog(0.6), // thumbnail size (real px, 90..260) via set(t, v)
  thumbScroll: mkTog(0.7), // px
  active: mkStep(0), // active pane
  split: mkStep('none'), // 'none' | 'v' (Split Vertical, side by side) | 'h' (stacked)
  splitT: mkTog(0.45), // progress of the last layout change
  sync: mkStep('off'),
  items: mkStep(0), // "Total Items" (markups)

/** Geometry of the panel at time t: flyout (floating, rounded, shadow) <-> pinned (docked, full height). */
function panelGeo(t) {
  const d = PDS.dock.at(t);
  const f = PDS.flyout.at(t);
  const vis = Math.max(d, f);
  const docked = d >= f ? 1 : 0;
  const k = vis > 0 ? clamp01(d / vis) : 0; // 1 = fully docked, 0 = floating flyout
  return { vis, docked, k, dx: 6 * (1 - k), dy: 10 * (1 - k), slide: (1 - vis) * -26 };
}
/** App position of a panel element (measured in the pinned geometry), adjusted for the flyout offset at time t. */
function panelPos(r, t) {
  const g = panelGeo(t);
  return { x: r.x + g.dx, y: r.y + g.dy, w: r.w, h: r.h, cx: r.cx + g.dx, cy: r.cy + g.dy };
}
function updPanel(t) {
  const el = PNL.el;
  const g = panelGeo(t);
  O(el, g.vis);
  if (g.vis <= 0) return;
  S(el, 'transform', `translate(${r2(g.dx + g.slide)}px, ${r2(g.dy)}px)`);
  S(el, 'height', r2(lerp(1010, 1030, g.k)) + 'px');
  setClass(el, 'flyout', g.k < 0.5);
  const tab = PDS.tab.at(t);
  const tc = PDS.tab.lastChange(t);
  setText(PNL.title, { files: 'Files', outline: 'Outline', thumbs: 'Thumbnails' }[tab]);
  PNL.panes.forEach((p) => {
    const on = p.dataset.tab === tab;
    O(p, on ? prog(t, tc, tc + 0.22, ease.outCubic) : 0);
  });
  const pinned = PDS.dock.final(t) > 0.5;
  O(PNL.pin.querySelector('.i1'), pinned ? 0 : 1);
  O(PNL.pin.querySelector('.i2'), pinned ? 1 : 0);
  // outline rows: folded chapters hide their sections; the row of the current page is blue
  if (tab === 'outline') {
    const folded = PDS.collapsed.at(t);
    const pg = pdPageOf(0, t);
    olLayout(t).forEach((r, i) => {
      const row = PNL.olRows[i];
      O(row, r.h > 0.5 ? clamp01(r.h / 30) : 0);
      S(row, 'transform', `translateY(${r2(r.y)}px)`);
      setClass(row, 'act', r.page === pg);
    });
    PNL.chevs.forEach((c, ci) => {
      const f = folded.includes(ci);
      O(c.querySelector('.d'), f ? 0 : 1);
      O(c.querySelector('.r'), f ? 1 : 0);
    });
  }
  if (tab === 'thumbs') {
    const w = PDS.thumbW.at(t);
    const L = thLayout(w);
    const sc = PDS.thumbScroll.at(t);
    S(PNL.grid, 'transform', `translateY(${r2(-sc)}px)`);
    const pg = pdPageOf(0, t);
    PNL.tiles.forEach((tile, i) => {
      const r = L.tiles[i];
      S(tile, 'transform', `translate(${r2(r.x)}px, ${r2(r.y)}px)`);
      S(tile, 'width', r2(r.w) + 'px');
      S(tile.firstElementChild, 'height', r2(r.fh) + 'px');
      setClass(tile, 'act', i + 1 === pg);
    });
    const u = (w - 90) / (260 - 90);
    S(PNL.knob, 'left', r2(u * 100) + '%');
    S(PNL.fillB, 'width', r2(u * 100) + '%');
  }
}
/** Rows of the Bookmarks pane at time t: y offsets (px inside the list) with folding animated over 0.3 s. */
const OL_ROW = 33;
function olLayout(t) {
  const out = [];
  let y = 0;
  const lc = PDS.collapsed.lastChange(t);
  const now = PDS.collapsed.at(t);
  const prev = PDS.collapsed.at(lc - 1e-6);
  const u = prog(t, lc, lc + 0.3, ease.inOutCubic);
  PD.CHAPTERS.forEach((ch, ci) => {
    out.push({ y, h: OL_ROW, page: ch.page, kind: 'c', ci });
    y += OL_ROW;
    const a = prev.includes(ci) ? 0 : 1;
    const b = now.includes(ci) ? 0 : 1;
    const open = lerp(a, b, u);
    ch.kids.forEach((k) => {
      out.push({ y: y - (1 - open) * OL_ROW * 0.6, h: OL_ROW * open, page: k.page, kind: 's', ci });
      y += OL_ROW * open;
    });
  });
  return out;
}
/** App position of a Bookmarks row (index into the flat list) or its chevron. */
function olPos(i, t, part = 'title') {
  const r = olLayout(t)[i];
  const base = panelPos({ x: 0, y: PNL.olTop, w: 0, h: 0, cx: 0, cy: PNL.olTop }, t);
  const x = part === 'chev' ? PNL.chevX + base.x : PNL.titleX + base.x + (r.kind === 'c' ? 90 : 110);
  return { cx: x, cy: base.y + r.y + OL_ROW / 2 };
}
const olIndex = (ci, ki = -1) => {
  let i = 0;
  for (let c = 0; c < PD.CHAPTERS.length; c++) {
    if (c === ci && ki < 0) return i;
    i++;
    for (let k = 0; k < PD.CHAPTERS[c].kids.length; k++) {
      if (c === ci && k === ki) return i;
      i++;
    }
  }
  return -1;
};
/** Thumbnail grid layout for a thumbnail size w (real px): cards of (w + 28) x 1.3 auto-fill the pane, 13 px gaps [S]. */
function thLayout(w) {
  const K = 1.3;
  const cardW = (w + 28) * K;
  const usable = 440;
  const cols = Math.max(1, Math.floor((usable + 13) / (cardW + 13)));
  const fh = (w * K) * (PD.PH / PD.PW); // the A4 pages fill their cards (the real cards hold the page image)
  const cardH = fh + 16 + 30;
  const tiles = [];
  for (let i = 0; i < PD.N; i++) {
    const c = i % cols;
    const r = Math.floor(i / cols);
    tiles.push({ x: c * (cardW + 13), y: r * (cardH + 13), w: cardW, fh, h: cardH });
  }
  return { cols, cardW, cardH, tiles };
}
/** App position of thumbnail tile p (1-based) at time t. */
function thPos(p, t) {
  const L = thLayout(PDS.thumbW.at(t));
  const r = L.tiles[p - 1];
  const w = panelPos(PNL.wrapPos, t);
  return { cx: w.x + r.x + r.w / 2, cy: w.y + r.y - PDS.thumbScroll.at(t) + r.fh / 2 + 8 };
}
/** App position of the thumbnail-size knob for a size w. */
function thKnobPos(w, t) {
  const r = panelPos(PNL.trackPos, t);
  return { cx: r.x + ((w - 90) / 170) * r.w, cy: r.cy };
}

// ------------------------------------------------------------------------------------------------- viewer (panes, pages)
const VW = { panes: [] };
/** Pane rectangles inside the canvas at time t (canvas width shrinks while the panel is pinned). */
function cvSize(t) {
  return { w: 1862 - pdShift(t), h: 918 };
}
function paneRectsFor(mode, W, H) {
  if (mode === 'v') return [{ x: 0, y: 0, w: (W - 6) / 2, h: H }, { x: (W + 6) / 2, y: 0, w: (W - 6) / 2, h: H }];
  if (mode === 'h') return [{ x: 0, y: 0, w: W, h: (H - 6) / 2 }, { x: 0, y: (H + 6) / 2, w: W, h: (H - 6) / 2 }];
  return [{ x: 0, y: 0, w: W, h: H }, { x: W, y: 0, w: 0, h: H }];
}
function paneRects(t) {
  const { w: W, h: H } = cvSize(t);
  const m = PDS.split.at(t);
  const lc = PDS.split.lastChange(t);
  const pm = PDS.split.at(lc - 1e-6);
  const u = ease.inOutCubic(clamp01((t - lc) / 0.45));
  const a = paneRectsFor(pm, W, H);
  const b = paneRectsFor(m, W, H);
  if (pm === 'none' && m === 'h') a[1] = { x: 0, y: H, w: W, h: 0 };
  if (m === 'none' && pm === 'h') b[1] = { x: 0, y: H, w: W, h: 0 };
  return [0, 1].map((i) => ({ x: lerp(a[i].x, b[i].x, u), y: lerp(a[i].y, b[i].y, u), w: lerp(a[i].w, b[i].w, u), h: lerp(a[i].h, b[i].h, u) }));
}
const pdActive = (t) => PDS.active.at(t);

/** Document layout (points) of a view state. */
function docPos(st, p) {
  if (p < 1 || p > PD.N) return null;
  if (st.mode === 'single') {
    const k = p - st.page;
    if (k < 0 || k >= st.n) return null;
    return [k * (PD.PW + GAP), 0];
  }
  const c = (p - 1) % st.n;
  const r = Math.floor((p - 1) / st.n);
  return [c * (PD.PW + GAP), r * (PD.PH + GAP)];

/** Page point under a stage point (inverse of the UI camera and the pane layout), or null. */
function stageToPage(i, p, sx, sy, t) {
  const c = ucamAt(t);
  const ax = (sx - c.ox) / c.s;
  const ay = (sy - c.oy) / c.s;
  const r = paneRects(t)[i];
  const q = VW.panes[i].frame(t, r.w, r.h).find((e) => e.p === p);
  if (!q) return null;
  const lx = ax - (CV.x + pdShift(t) + r.x + q.x);

/** Stage point of a page point of the markup page in pane i (through the layout and the UI camera). */
function pageToStage(i, px, py, t) {
  const a = pagePt(i, PD.MK_PAGE, px, py, t);

/** Scalloped outline through polygon points (page pt): every edge becomes a row of outward bulging arcs. */
function scallopD(pts, closed = true, r = 7) {

    const b = pts[(i + 1) % n];

    const k = Math.max(1, Math.round(L / (r * 1.7)));
    if (i === 0) d += `M${r2(a[0])} ${r2(a[1])}`;

      d += `A${r2(L / k / 1.6)} ${r2(L / k / 1.6)} 0 0 1 ${r2(p[0])} ${r2(p[1])}`;

    A(MK.hl, 'y', r2(a[1] - hh / 2));
    A(MK.hl, 'width', r2(x1 - a[0]));

    A(MK.hl, 'opacity', t < tEnd ? 0.42 : 0.5);
    const sel = t >= tEnd && t < tSel1;
    A(MK.hlGrips, 'opacity', sel ? 1 : 0);

  });
}

  ringAt(tCam + 1.3, s1.t1 + 1.2, nav.x, nav.y, nav.w, nav.h, { r: 10 });

  const tN = act('next', s2.t0 + 0.55, s2);

  const tEnter = act('Enter', Math.max(s3.t1 - 0.6, typed[1] + 0.6), s3);
  boxEdit(tBox + 0.05, '10', typed, tEnter);
  chip(tEnter, 'Enter', { at: [300, 700] });
  cu(tEnter + 0.55, bx.cx + 40, bx.cy - 150); // off the number box, so the new page number shows
  VW.panes[0].set(tEnter + 0.05, 0.35, { page: 10 });
  cue('pageTurn', tEnter + 0.05, { n: 1 });

  const s4 = say('n4', Math.max(after(s3, 0.25), tEnter + 1.3));
  const tR = act('Ctrl+Right', s4.t0 + 2.1, s4);
  chip(tR, ['Ctrl', '→'], { tKeys: [tR - 0.3, tR], at: [300, 600], hold: 1.6 });

  const tL = tR + 1.3;

  const tBack = Math.max(s4.t1, tL + 0.4) + 0.9;

}

// ============================================================ 4. Light and dark
function sceneTheme(t0) {
  // a warm "morning" tint and a cool "evening" tint over the picture (film graphics, not part of the app)
  const tint = h('div', { class: 'pd-gfx', style: 'left:0;top:0;width:1920px;height:1080px;z-index:2' });
  OV().appendChild(tint);
  const s1 = say('d1', t0 + 0.2);
  const tMorning = s1.t0 + 0.2;
  const s2 = say('d2', after(s1, 0.3));
  const tEvening = s2.t0 + 0.15;
  textChip(tMorning, tEvening, 1430, 176, 'sun', 'Morning');
  const TL4 = { light: 1e9, end: 1e9 }; // set below, once the click back to Light Canvas is scheduled
  onFrame((t) => {
    const m = Math.max(prog(t, tMorning, tMorning + 0.8) * (1 - prog(t, tEvening, tEvening + 0.8)), prog(t, TL4.light, TL4.light + 0.8) * (1 - prog(t, TL4.end, TL4.end + 0.6)));
    const e = prog(t, tEvening, tEvening + 0.8) * (1 - prog(t, TL4.light, TL4.light + 0.8));
    O(tint, Math.max(m, e));
    if (m > 0 || e > 0) S(tint, 'background', m >= e ? 'radial-gradient(circle at 88% -5%, rgba(255,206,120,0.26), rgba(255,206,120,0.06) 38%, transparent 62%)' : 'radial-gradient(circle at 12% 110%, rgba(70,110,220,0.26), rgba(40,70,160,0.08) 42%, transparent 66%)');
  });
  cap(s1.t0 + 0.4, 'Light or dark, your choice', 'The moon at the bottom of the rail switches the canvas.', 'sunMoon', CAP_R);
  // tap the moon: Dark Canvas
  const tGo = act('to the moon', s2.t0 + 1.2, s2);
  cu(tGo + 0.9, MOON.cx, MOON.cy);
  pdTip(tGo + 1.0, tGo + 1.75, 'Dark Canvas', 62, MOON.cy);
  const tDark = act('Dark Canvas', s2.t0 + 2.85, s2);
  cu(tDark, MOON.cx, MOON.cy, { click: true, hold: 0.3 });
  PDS.dark.set(tDark + 0.05, 1);
  cue('themeSwitch', tDark + 0.05, { dir: 1 });
  pdTip(tDark + 0.3, s2.t1 + 1.2, 'Light Canvas', 62, MOON.cy);
  // and back
  const s3 = say('d3', Math.max(after(s2, 0.3), tDark + 1.5));
  const tLight = act('Light Canvas', s3.t0 + 0.95, s3);
  cu(tLight, MOON.cx, MOON.cy, { click: true, hold: 0.3 });
  PDS.dark.set(tLight + 0.05, 0);
  cue('themeSwitch', tLight + 0.05, { dir: -1 });
  pdTip(tLight - 0.5, tLight + 0.2, 'Light Canvas', 62, MOON.cy);
  cu(tLight + 1.3, 1500, 640);
  const tEnd = Math.max(s3.t1, tLight + 1.3) + 1.1;
  TL4.light = tLight + 0.05;
  TL4.end = tEnd - 0.7;
  textChip(tEvening + 0.25, tLight + 0.05, 1430, 176, 'moon', 'Evening');
  textChip(tLight + 0.35, tEnd - 0.7, 1430, 176, 'sun', 'Morning');
  return tEnd;
}

// ============================================================ 5. Page layouts
function sceneLayouts(t0) {
  const pane = VW.panes[0];
  const s1 = say('l1', t0 + 0.2);
  const tCam = act('camera to the pill', s1.t0 + 0.35, s1);
  ucamTo(tCam, tCam + 1.3, UC_STATUS);
  const p1 = sbPos('p1', tCam + 1.6);

  cue('pageTurn', t3 + 0.05, { n: 3 });
  // the third page is clipped at 107 %: zoom out twice (Ctrl + minus, 10 points each) so all three show
  const tZ1 = t3 + 1.2;
  const tZ2 = tZ1 + 0.6;
  chip(tZ2, ['Ctrl', '−'], { tKeys: [tZ1 - 0.25, tZ1, tZ2], label: 'Zoom out', at: [300, 640], hold: 1.8 });
  pane.set(tZ1 + 0.03, 0.3, { z: 0.97 });
  pane.set(tZ2 + 0.03, 0.3, { z: 0.87 });

  const s5 = say('l5', Math.max(after(s4, 0.3), tZ2 + 0.9));
  const tView = act('continuous view', s5.t0 + 1.55, s5);
  const vbp = sbPos('view', tView);
  cu(tView, vbp.cx, vbp.cy, { click: true, hold: 0.3 });

  pane.setKeep(tView + 0.05, 0.6, { mode: 'cont' }, { page: 10 });

  // back to the whole window to see the pages flow
  const tBack = tView + 0.8;
  ucamTo(tBack, tBack + 1.3, UC_ID);
  cu(tBack + 1.35, 1500, 560);
  return Math.max(s5.t1, tBack + 1.3) + 0.9;
}
