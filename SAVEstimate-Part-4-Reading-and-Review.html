// ---------------------------------------------------------------------------
// Part 4 scenes 6-7: gestures (touch two-finger drag and pinch, mouse wheel, Ctrl + wheel, single-page wheel zoom, trackpad
// pinch) and the Select / Pan tool (A key, the toolbar button, Space + drag).
// Facts: parts/_FEATURE-NOTES.md section 5.6 and 5.7. Two-finger drag = pan only (direction [L], ratio [U]: the film moves the
// page with the fingers and states no ratio); pinch = scale x finger distance [L]; a trackpad pinch arrives as Ctrl + wheel [L][S].
// ---------------------------------------------------------------------------
/** Stage point of a hand-local point for a hand placed at (x, y), rotated rot degrees, scaled k. */
function handPt(local, x, y, rot, k = 1) {
  const a = (rot * Math.PI) / 180;
  const c = Math.cos(a);
  const s = Math.sin(a);
  return [x + k * (local[0] * c - local[1] * s), y + k * (local[0] * s + local[1] * c)];
}
/** Place a hand element: local origin at stage (x, y), rotation rot, scale k, opacity a. */
function placeHand(el, x, y, rot, k, a) {
  O(el, a);
  if (a > 0) S(el, 'transform', `translate(${r2(x)}px, ${r2(y)}px) rotate(${r2(rot)}deg) scale(${r3(k)})`);
}
/** Stage -> pane-local point of pane 0 (UI camera at identity). */
const stageToPane0 = (x, y, t) => {
  const c = ucamAt(t);
  return [(x - c.ox) / c.s - CV.x - pdShift(t), (y - c.oy) / c.s - CV.y];
};

// ============================================================ 6. Gestures
function sceneGestures(t0) {
  const pane = VW.panes[0];
  const layer = h('div', { class: 'pd-gfx', style: 'left:0;top:0;width:1920px;height:1080px;opacity:1;display:block;z-index:4' });
  OV().appendChild(layer);
  const discSvg = sv('svg', { width: 1920, height: 1080, style: 'position:absolute;left:0;top:0;overflow:visible;z-index:5' }, null);
  layer.appendChild(discSvg);
  sv('defs', {}, discSvg).innerHTML = '<marker id="pdArr2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4db2ff"/></marker>';

  // ---------------- two-finger drag: the page follows the fingers, up and back down
  const s1 = say('g1', t0 + 0.2);
  curVis(s1.t0 + 0.1, 0);
  const two = mkTwoFingerHand(layer);
  const tEnter = act('hand in', s1.t0 + 0.9, s1);
  const tDown = tEnter + 0.75;
  const tUp1 = tDown + 0.15;
  const tUp2 = tUp1 + 1.05;
  const tDn1 = tUp2 + 0.3;
  const tDn2 = tDn1 + 1.05;
  const tLift = tDn2 + 0.2;
  const tExit = tLift + 0.15;
  const DY = 280;
  const H0 = { x: 1235, y: 905, rot: -8 };
  const twoY = (t) => H0.y - DY * (prog(t, tUp1, tUp2, ease.inOutCubic) - prog(t, tDn1, tDn2, ease.inOutCubic));
  const twoPose = (t) => {
    const ein = prog(t, tEnter, tDown, ease.outCubic);
    const eout = prog(t, tExit, tExit + 0.6, ease.inCubic);
    return { x: H0.x + 260 * (1 - ein) + 300 * eout, y: twoY(t) + 360 * (1 - ein) + 420 * eout, rot: H0.rot - 10 * (1 - ein) + 8 * eout, a: Math.min(1, ein * 1.4) * (1 - eout) };
  };
  const discs2 = [mkDisc(discSvg), mkDisc(discSvg)];
  const trail = sv('g', { opacity: 0 }, discSvg);
  const trLine = sv('path', { fill: 'none', stroke: '#4db2ff', 'stroke-width': 5, 'stroke-linecap': 'round', 'marker-start': 'url(#pdArr2)', 'marker-end': 'url(#pdArr2)', opacity: 0.9 }, trail);
  const trGlow = sv('path', { fill: 'none', stroke: 'rgba(0,122,204,0.35)', 'stroke-width': 16, 'stroke-linecap': 'round' }, trail);
  trail.insertBefore(trGlow, trLine);
  onFrame((t) => {
    const P = twoPose(t);
    placeHand(two.el, P.x, P.y, P.rot, 1, P.a);
    const touching = t >= tDown && t < tLift;
    const da = prog(t, tDown, tDown + 0.15, ease.outCubic) * (1 - prog(t, tLift, tLift + 0.25));
    two.tips.forEach((tp, i) => {
      const s = handPt(tp, P.x, P.y, P.rot);
      A(discs2[i], 'opacity', r3(da));
      if (da > 0) A(discs2[i], 'transform', `translate(${r2(s[0])} ${r2(s[1])}) scale(${r3(0.7 + 0.3 * da + (touching ? 0.03 * Math.sin(t * 12) : 0))})`);
    });
    const ta = prog(t, tUp1 - 0.1, tUp1 + 0.2) * (1 - prog(t, tDn2, tDn2 + 0.4));
    A(trail, 'opacity', r3(ta));
    if (ta > 0) {
      const a = handPt(two.tips[1], H0.x, H0.y, H0.rot);
      const x = a[0] + 78;
      A(trLine, 'd', `M${r2(x)} ${r2(a[1] - DY - 10)} V${r2(a[1] + 10)}`);
      A(trGlow, 'd', `M${r2(x)} ${r2(a[1] - DY - 10)} V${r2(a[1] + 10)}`);
    }
  });
  cue('touchDown', tDown, { n: 2 });
  cue('touchUp', tLift, { n: 2 });
  const A0 = pane.last().A;
  pane.set(tUp1, tUp2 - tUp1, { A: [A0[0], A0[1] - DY] });
  pane.set(tDn1, tDn2 - tDn1, { A: [A0[0], A0[1]] });
  cap(s1.t0 + 0.3, 'Touch, mouse or trackpad', 'Scroll and zoom the way your device likes.', 'pointerHand', CAP_R);

  // ---------------- pinch: thumb and index spread (zoom in), then close (zoom out)
  const pin = mkPinchHand(layer);
  const s2 = say('g2', Math.max(after(s1, 0.3), tLift + 0.35));
  const tPIn = act('pinch hand in', s2.t0 + 0.05, s2);
  const tPDown = tPIn + 0.55;
  const tO0 = tPDown + 0.12;
  const tO1 = tO0 + 1.2;
  const s3 = say('g3', Math.max(after(s2, 0.25), tO1 + 0.35));
  const tC0 = act('pinch in', s3.t0 + 0.2, s3);
  const tC1 = tC0 + 1.2;
  const tPLift = tC1 + 0.2;
  const P0 = { x: 1265, y: 930, rot: 18 };
  const sAt = (t) => prog(t, tO0, tO1, ease.inOutCubic) * (1 - prog(t, tC0, tC1, ease.inOutCubic));
  const pinPose = (t) => {
    const ein = prog(t, tPIn, tPDown, ease.outCubic);
    const eout = prog(t, tPLift + 0.15, tPLift + 0.75, ease.inCubic);
    return { x: P0.x + 240 * (1 - ein) + 300 * eout, y: P0.y + 340 * (1 - ein) + 420 * eout, rot: P0.rot + 8 * (1 - ein) - 6 * eout, a: Math.min(1, ein * 1.4) * (1 - eout) };
  };
  const tips0 = pin.pose(0).map((p) => p.slice());
  const tips1 = pin.pose(1).map((p) => p.slice());
  const d0 = dist(tips0[0], tips0[1]);
  const d1 = dist(tips1[0], tips1[1]);
  const discsP = [mkDisc(discSvg), mkDisc(discSvg)];
  // curved trails along the fingertip paths (sampled from the pose), arrows pointing the way the fingers move
  const loci = [0, 1].map((i) => Array.from({ length: 13 }, (_, k) => pin.pose(k / 12)[i].slice()));
  pin.pose(0);
  const arcs = [0, 1].map(() => sv('path', { fill: 'none', stroke: '#4db2ff', 'stroke-width': 4.5, 'stroke-linecap': 'round', opacity: 0 }, discSvg));
  const zBefore = pane.last().z;
  const mid0 = handPt([(tips0[0][0] + tips0[1][0]) / 2, (tips0[0][1] + tips0[1][1]) / 2], P0.x, P0.y, P0.rot);
  const zOpen = zBefore * (d1 / d0);
  onFrame((t) => {
    const P = pinPose(t);
    if (P.a <= 0) {
      O(pin.el, 0);
      discsP.forEach((d) => A(d, 'opacity', 0));
      arcs.forEach((a) => A(a, 'opacity', 0));
      return;
    }
    const tips = pin.pose(sAt(t));
    placeHand(pin.el, P.x, P.y, P.rot, 1, P.a);
    const da = prog(t, tPDown, tPDown + 0.15, ease.outCubic) * (1 - prog(t, tPLift, tPLift + 0.25));
    tips.forEach((tp, i) => {
      const s = handPt(tp, P.x, P.y, P.rot);
      A(discsP[i], 'opacity', r3(da));
      if (da > 0) A(discsP[i], 'transform', `translate(${r2(s[0])} ${r2(s[1])}) scale(${r3(0.7 + 0.3 * da)})`);
    });
    const opening = t < tC0;
    const aa = opening ? prog(t, tO0, tO0 + 0.3) * (1 - prog(t, tO1, tO1 + 0.4)) : prog(t, tC0, tC0 + 0.3) * (1 - prog(t, tC1, tC1 + 0.4));
    arcs.forEach((arc, i) => {
      A(arc, 'opacity', r3(aa * 0.95));
      if (aa <= 0) return;
      const pts = loci[i].map((p) => handPt(p, P0.x, P0.y, P0.rot));
      const off = i === 0 ? [-16, -10] : [-22, 8];
      const seq = (opening ? pts : pts.slice().reverse()).map((p) => [p[0] + off[0], p[1] + off[1]]);
      A(arc, 'd', splinePathD(seq, false));
      A(arc, 'marker-end', 'url(#pdArr2)');
    });
  });
  cue('touchDown', tPDown, { n: 2 });
  cue('touchUp', tPLift, { n: 2 });
  const anchor0 = stageToPane0(mid0[0], mid0[1], tO0);
  pane.set(tO0, tO1 - tO0, { z: zOpen }, { anchor: anchor0 });
  pane.set(tC0, tC1 - tC0, { z: zBefore }, { anchor: anchor0 });
  zoomChip(tO0, tC1 + 0.5, (t) => {
    const P = pinPose(t);
    const s = handPt(pin.tips[1], P.x, P.y, P.rot);
    return [s[0] - 230, s[1] + 40];
  });

  // ---------------- the mouse: wheel scrolls in continuous view, Ctrl + wheel zooms
  const mouseCard = h('div', { class: 'pd-card', style: 'left:1560px;top:470px;width:250px;text-align:center' }, '<div class="ct" style="justify-content:center">Mouse</div><div class="mh" style="position:relative;height:250px;width:180px;margin:0 auto"></div><div class="cs">The wheel</div>');
  OV().appendChild(mouseCard);
  const mouse = mkMouse(mouseCard.querySelector('.mh'));
  const s4 = say('g4', Math.max(after(s3, 0.3), tPLift + 0.5));
  curVis(s4.t0 + 0.15, 1);
  const cur = [960, 600];
  cu(s4.t0 + 0.2, 2100, 620);
  cu(s4.t0 + 0.9, cur[0], cur[1], { e: 'outCubic' });
  const tW0 = act('wheel', s4.t0 + 1.3, s4);
  const tW1 = tW0 + 1.0;
  const Ac = pane.last().A;
  pane.set(tW0, tW1 - tW0, { A: [Ac[0], Ac[1] - 300] }, { e: 'inOutSine' });
  for (let k = 0; k < 3; k++) cue('wheelTick', tW0 + k * 0.33);
  const s5 = say('g5', Math.max(after(s4, 0.25), tW1 + 0.2));
  const tCw = act('Ctrl + wheel', s5.t0 + 0.75, s5);
  chip(tCw, 'Ctrl', { tKeys: [tCw - 0.35], label: '+ wheel: zoom', hold: 1.9 });
  // anchor the zoom on page 10 so the next steps stay on it
  const p10 = pagePt(0, 10, 300, 600, tCw);
  cu(tCw - 0.45, p10.cx, p10.cy);
  pane.set(tCw + 0.02, 0.35, { z: zBefore * 1.349 }, { anchor: [p10.cx - CV.x, p10.cy - CV.y] });
  cue('wheelTick', tCw);
  wheelBadge([[tW0, tW1, 1], [tCw, tCw + 0.35, -1]]);
  onFrame((t) => {
    const a = prog(t, s4.t0 + 0.3, s4.t0 + 0.7, ease.outCubic) * (1 - prog(t, tCw + 1.4, tCw + 1.8));
    O(mouseCard, a);
    if (a <= 0) return;
    const on = (t >= tW0 && t <= tW1) || (t >= tCw && t <= tCw + 0.35);
    mouse.set(t < tCw ? (t - tW0) * 40 : -(t - tCw) * 40, on ? 1 : 0);
  });

  // ---------------- single page view: the wheel zooms instead
  const s6 = say('g6', Math.max(after(s5, 0.25), tCw + 0.6));
  const tCam = act('status bar', s6.t0 + 0.25, s6);
  ucamTo(tCam, tCam + 1.0, UC_STATUS);
  const vb = sbPos('view', tCam + 1.2);
  cu(tCam + 1.2, vb.cx, vb.cy, { click: true, hold: 0.25 });
  hotWin(SB.view, [[tCam + 0.9, tCam + 1.5]]);
  pane.setKeep(tCam + 1.25, 0.5, { mode: 'single', page: 10 }, { page: 10, A: [460, 459], D: [297.5, 310] });
  const p1b = sbPos('p1', tCam + 2.0);
  cu(tCam + 2.0, p1b.cx, p1b.cy, { click: true, hold: 0.25 });
  hotWin(SB.btn.p1, [[tCam + 1.7, tCam + 2.3]]);
  pane.setKeep(tCam + 2.05, 0.45, { n: 1 }, { page: 10, A: [931, 459], D: [297.5, 310] });
  cue('pageTurn', tCam + 1.25, { n: 1 });
  cue('pageTurn', tCam + 2.05, { n: 1 });
  ucamTo(tCam + 2.55, tCam + 3.55, UC_ID);
  const cc = [1452, CV.y + 459]; // the pointer rests right of the text column, level with the canvas centre (the zoom keeps the page centred horizontally)
  cu(tCam + 3.6, cc[0], cc[1]);
  const tN1 = tCam + 4.0;
  const tN2 = tN1 + 0.45;
  const zS = zBefore * 1.349;
  pane.set(tN1, 0.3, { z: zS * 1.1616 }, { anchor: [931, 459] });
  pane.set(tN2, 0.3, { z: zS * 1.1616 * 1.1616 }, { anchor: [931, 459] });
  cue('wheelTick', tN1);
  cue('wheelTick', tN2);
  wheelBadge([[tN1, tN2 + 0.3, -1]]);
  textChip(tN1 - 0.6, tN2 + 2.2, 1380, 176, 'mouse', 'Single page view: the wheel zooms');

  // ---------------- trackpad: the same pinch (arrives as Ctrl + wheel)
  const s7 = say('g7', Math.max(after(s6, 0.25), tN2 + 0.5));
  const padCard = h('div', { class: 'pd-card', style: 'left:1520px;top:430px;width:380px;text-align:center' }, '<div class="ct" style="justify-content:center">Trackpad</div><div class="th2" style="position:relative;height:250px;width:340px;overflow:hidden;border-radius:26px"></div><div class="cs">Pinch = Ctrl + wheel</div>');
  OV().appendChild(padCard);
  const padHost = padCard.querySelector('.th2');
  mkTrackpad(padHost).el.style.cssText = 'position:absolute;left:0;top:0';
  const mini = mkPinchHand(padHost);
  const miniSvg = sv('svg', { width: 380, height: 250, style: 'position:absolute;left:0;top:0;overflow:visible' }, null);
  padHost.appendChild(miniSvg);
  const md = [mkDisc(miniSvg), mkDisc(miniSvg)];
  // place the small hand so its fingertips sit on the middle of the pad
  const mt = mini.pose(0.6);
  const mm = handPt([(mt[0][0] + mt[1][0]) / 2, (mt[0][1] + mt[1][1]) / 2], 0, 0, 22, 0.4);
  const MINI = [170 - mm[0], 112 - mm[1]];
  const tT0 = act('trackpad pinch', s7.t0 + 1.0, s7);
  const tT1 = tT0 + 1.2;
  const zEnd = 2.0;
  const zFrom = zS * 1.1616 * 1.1616;
  pane.set(tT0, tT1 - tT0, { z: zEnd }, { anchor: [931, 459] });
  cue('touchDown', tT0 - 0.1, { n: 2, soft: 1 });
  cue('touchUp', tT1 + 0.1, { n: 2, soft: 1 });
  onFrame((t) => {
    const a = prog(t, s7.t0 + 0.1, s7.t0 + 0.5, ease.outCubic) * (1 - prog(t, tT1 + 1.2, tT1 + 1.6));
    O(padCard, a);
    if (a <= 0) return;
    const s = 0.2 + 0.8 * prog(t, tT0, tT1, ease.inOutCubic);
    const tips = mini.pose(s);
    const K = 0.4;
    const X = MINI[0];
    const Y = MINI[1];
    placeHand(mini.el, X, Y, 22, K, 1);
    tips.forEach((tp, i) => {
      const p = handPt(tp, X, Y, 22, K);
      A(md[i], 'opacity', t >= tT0 - 0.1 && t < tT1 + 0.1 ? 1 : 0);
      A(md[i], 'transform', `translate(${r2(p[0])} ${r2(p[1])}) scale(0.45)`);
    });
  });
  zoomChip(tT0 - 0.2, tT1 + 0.8, () => [150, 560]);
  void zFrom;
  return Math.max(s7.t1, tT1) + 1.4;
}

// ---------------------------------------------------------------------------
// Part 4 scenes 8-9: review notes (Review Note C then O, Revision Cloud R then C in polygon mode, Highlight H: start, end,
// Enter; the status bar switches from "Viewing" to "Markup" by itself) and Fit (Shift+W Fit to Width 312 %, Shift+Z Fit to
// Screen 107 %). Facts: parts/_FEATURE-NOTES.md section 5.5 and 5.8 [L].

/** App position of a point on the markup page (page 10) in pane 0. */
const mkPt = (px, py, t) => pagePt(0, PD.MK_PAGE, px, py, t);
const KEY_REV = [1610, 470]; // key chips of the review scene: right of the page, below the note and its popup

// ============================================================ 8. Review notes
function sceneReview(t0) {
  mkMarkups();
  const G = PD.GEO;
  const hz = G.hazard;
  const tb = G.table;
  const s1 = say('r1', t0 + 0.2);
  const hzA = mkPt(hz.x, hz.y, s1.t0 + 0.6);
  const hzB = mkPt(hz.x + hz.w, hz.y + hz.h, s1.t0 + 0.6);
  ringAt(s1.t0 + 0.9, s1.t1 + 0.6, hzA.cx, hzA.cy, hzB.cx - hzA.cx, hzB.cy - hzA.cy, { r: 6 });
  const near = mkPt(hz.x + hz.w * 0.75, hz.y + hz.h + 30, s1.t0 + 0.6);
  cu(s1.t0 + 1.0, near.cx, near.cy);
  cap(s1.t0 + 0.4, 'Review while you read', 'Notes, revision clouds and highlights, straight from the keyboard.', 'stickyNote', { left: 92, top: 868, maxW: 560 });

  // ---- Review Note: C then O, click, type, Save
  const s2 = say('r2', after(s1, 0.3));
  const tC = act('C', s2.t0 + 0.3, s2);
  const tO = tC + 0.32;
  chip(tO, ['C', 'O'], { sep: 'then', tKeys: [tC, tO], at: KEY_REV });
  PDS.mode.set(tO + 0.05, 'markup');
  tool(tO + 0.05, 'comment', 'stickyNote', true);
  cue('modeSwitch', tO + 0.05);
  const s3 = say('r3', after(s2, 0.2));
  const pin = [550, hz.y + 14];
  const tClick = act('click the spot', s3.t0 + 0.55, s3);
  const pp = mkPt(pin[0], pin[1], tClick);
  cu(tClick, pp.cx, pp.cy, { click: true, hold: 0.3 });
  cu(tClick + 0.75, pp.cx - 40, pp.cy + 170); // out of the way while the note is typed
  crosshairAt(tO + 0.05, tClick + 0.05, 'rgba(59,130,246,0.7)');
  optBar(OBH.noteCreate, tO + 0.1, tClick + 0.05);
  optBar(OBH.noteText, tClick + 0.08, s3.t1 + 2.6);
  const text = 'Check the barrier on Level 3';
  const times = typeTimes(text, tClick + 0.75, 15);
  const tSave = act('Save', Math.max(times[times.length - 1] + 0.75, s3.t1 + 0.4), s3);
  const tEsc = tSave + 0.75;
  const tSel = tEsc + 0.85;
  const tPopEnd = tSel + 2.4;
  noteMarkup({ px: pin[0], py: pin[1], tClick, tSave, text, times, tPop0: tSel + 0.05, tPop1: tPopEnd, tSel0: tSel + 0.05, tSel1: tPopEnd });
  cueTyping('note', times);
  const sv0 = noteSavePos(pin[0], pin[1], tSave);
  cu(tSave - 0.05, sv0.cx, sv0.cy, { click: true, hold: 0.2 });
  hotWin(MK.noteSave, [[tSave - 0.35, tSave + 0.1]]);
  PDS.items.set(tSave + 0.05, 1);
  cue('notePin', tSave + 0.05);
  // Esc (back to Select), then click the note: its popup with the reply box, and the EDIT bar
  chip(tEsc, 'Esc', { at: KEY_REV });
  tool(tEsc + 0.03, 'select', null, true);
  cu(tSel, pp.cx, pp.cy, { click: true, hold: 0.3 });
  optBar(OBH.noteEdit, tSel + 0.08, tPopEnd);

  // ---- Revision Cloud: R then C, corners around the table, Enter
  const s4 = say('r4', Math.max(after(s3, 0.25), tPopEnd + 0.1));
  const s5 = say('r5', after(s4, 0.25));
  const tR = act('R', s5.t0 + 0.3, s5);
  const tRC = tR + 0.32;
  chip(tRC, ['R', 'C'], { sep: 'then', tKeys: [tR, tRC], at: KEY_REV });
  tool(tRC + 0.05, 'cloud', null, true);
  const ty = tb.y;
  const corners = [[62, ty - 3], [534, ty - 5], [538, ty + tb.h], [66, ty + tb.h + 2]];
  const tc = [s5.t0 + 1.35];
  for (let i = 1; i < corners.length; i++) tc.push(tc[i - 1] + 0.9);
  corners.forEach((c, i) => {
    const q = mkPt(c[0], c[1], tc[i]);
    cu(tc[i], q.cx, q.cy, { click: true, hold: 0.2 });
  });
  const tCE = tc[tc.length - 1] + 0.85;
  chip(tCE, 'Enter', { at: KEY_REV });
  cloudMarkup(corners, tc, tCE);
  PDS.items.set(tCE + 0.05, 2);
  crosshairAt(tRC + 0.05, tCE + 0.05, 'rgba(59,130,246,0.7)');
  optBar(OBH.cloud, tRC + 0.1, tCE + 1.3);

  // ---- Highlight: H, start, end, Enter
  const s6 = say('r6', Math.max(after(s5, 0.25), tCE + 0.5));
  const tH = act('H', s6.t0 + 1.7, s6);
  chip(tH, 'H', { at: KEY_REV });
  tool(tH + 0.03, 'highlight', null, true);
  const ln = hz.lines[0];
  const a = [ln.x0 - 3, ln.y - 4.5];
  const b = [ln.x1 + 3, ln.y - 4.5];
  const s7 = say('r7', after(s6, 0.2));
  const tA = act('start', s7.t0 + 0.5, s7);
  const qa = mkPt(a[0], a[1], tA);
  cu(tA, qa.cx, qa.cy, { click: true, hold: 0.2 });
  const tB = act('end', s7.t0 + 1.55, s7);
  const qb = mkPt(b[0], b[1], tB);
  cu(tB, qb.cx, qb.cy, { click: true, hold: 0.2, e: 'inOutSine' });
  const tHE = act('Enter', Math.max(s7.t1 - 0.25, tB + 0.8), s7);
  chip(tHE, 'Enter', { at: KEY_REV });
  highlightMarkup(a, b, tA, tB, tHE, tHE + 3.2);
  PDS.items.set(tHE + 0.05, 3);
  crosshairAt(tH + 0.05, tHE + 0.05, 'rgba(59,130,246,0.7)');
  optBar(OBH.hlCreate, tH + 0.1, tHE + 0.05);
  optBar(OBH.hlEdit, tHE + 0.1, tHE + 3.2);
  tool(tHE + 0.03, 'select', null, true);
  cu(tHE + 1.1, qb.cx + 140, qb.cy + 160);

  // ---- no mode switching needed: the status bar says Markup by itself
  const s8 = say('r8', Math.max(after(s7, 0.3), tHE + 1.3));
  const m = sbPos('mode', s8.t0);
  ringAt(s8.t0 + 0.4, s8.t1 + 0.6, m.x - 6, m.y - 2, m.w + 12, m.h + 4, { r: 6 });
  const mb = POS.markupBtn;
  ringAt(s8.t0 + 0.4, s8.t1 + 0.6, mb.x, mb.y, mb.w, mb.h, { r: 9 });
  return s8.t1 + 1.0;
}

// ============================================================ 9. Fit

  cap(s1.t0 + 0.4, 'Fit the page', 'Shift+W fits the width, Shift+Z fits the whole page.', 'maximizeC', { left: 92, top: 868, maxW: 600 });
  const s2 = say('f2', Math.max(after(s1, 0.35), tW + 2.0));

  return Math.max(s2.t1, tZ + 0.7) + 1.3;
}

// ---------------------------------------------------------------------------
// Part 4 scenes 10-11: the hover cluster and split view (Split Vertical = side by side, own page and zoom per pane, Sync Pg,
// Flip, Unsplit), then the two image exports (the cluster's "Export current view image" menu and the toolbar's "Export PDF
// Content" dialog). Facts: parts/_FEATURE-NOTES.md section 5.9 and 5.10 [L]; Unsplit keeps the active pane [S: App.tsx
// unsplitView]; a format click in the dialog exports and closes it [S: App.tsx, ExportDialog.tsx].
// The cluster is invisible until the pointer is over it, so the cursor always goes there first.
// ---------------------------------------------------------------------------
/** Pointer over pane i's cluster from t0 to t1 (it fades in only then). */
const clHover = (i, t0, t1) => VW.panes[i].hover.push([t0, t1]);
const clHot = (i, name, t0, t1) => VW.panes[i].btnHot.push([name, t0, t1]);
/** Click a cluster button of pane i at t (cursor arrives at t). */
function clClick(i, name, t, o = {}) {
  const p = clPos(i, name, t);
  cu(t, p.cx, p.cy, { click: true, hold: o.hold != null ? o.hold : 0.25 });
  clHot(i, name, t - 0.35, t + 0.25);
  return p;
}
/** Copy pane a's state into pane b at time t (a new split pane starts on the same page and zoom). */
function paneClone(a, b, t) {
  const st = VW.panes[a].stAt(t);
  VW.panes[b].keys.push({ t, dur: 0, e: 'lin', st: { ...st, A: st.A.slice(), D: st.D.slice() } });
}

// ============================================================ 10. Split view
function sceneSplit(t0) {
  const P0 = VW.panes[0];
  const P1 = VW.panes[1];
  const s1 = say('p1', t0 + 0.2);
  const tArr = act('to the corner', s1.t0 + 2.1, s1);
  const fit = clPos(0, 'fit', tArr);
  cu(tArr, fit.cx, fit.cy);
  const syncP = clPos(0, 'sync', tArr);
  const closeP = clPos(0, 'close', tArr);
  const s2t = after(s1, 0.3) + 1.05; // when Split Vertical is clicked (scheduled below): the legend is gone by then
  clusterLegend(tArr + 0.4, s2t - 0.45, closeP.cx - 560, syncP.cy + 70, [
    [null, 'Sync  (Off, Pg, Doc)'],
    ['splitH', 'Split Vertical'],
    ['splitV', 'Split Horizontal'],
    ['maximizeC', 'Fit to Screen'],
    ['moveH', 'Fit to Width'],
    ['printer', 'Print Preview'],
    ['fileImage', 'Export current view image'],
    ['fileText', 'Export as PDF'],
    ['x', 'Close View'],
  ]);
  cap(s1.t0 + 0.4, 'Split the view', 'Two views of one document, each with its own page and zoom.', 'columns2', { left: 92, top: 868, maxW: 600 });

  const s2 = say('p2', after(s1, 0.3));
  const tSv = act('Split Vertical', s2.t0 + 1.05, s2);
  const svp = clClick(0, 'splitV', tSv);
  clHover(0, tArr - 0.05, tSv + 0.5);
  pdTip(tSv - 0.6, tSv + 0.1, 'Split Vertical', svp.cx, svp.cy + 26, 'b');
  paneClone(0, 1, tSv + 0.05);
  PDS.split.set(tSv + 0.05, 'v');
  cue('splitPanes', tSv + 0.05, { t1: tSv + 0.5 });
  cu(tSv + 1.2, CV.x + 700, CV.y + 640);

  // each pane its own page and zoom: chapter one on the left, chapter five on the right (zoomed in)
  const s3 = say('p3', Math.max(after(s2, 0.3), tSv + 1.3));
  const tCam = act('status bar', s3.t0 + 0.4, s3);
  ucamTo(tCam, tCam + 1.1, UC_STATUS);
  const bx = (t) => sbPos('box', t);
  const tB1 = tCam + 1.35;
  cu(tB1, bx(tB1).cx, bx(tB1).cy, { click: true, hold: 0.25 });
  const typ1 = typeTimes('3', tB1 + 0.55, 4);
  const tE1 = typ1[0] + 0.5;
  boxEdit(tB1 + 0.05, '3', typ1, tE1);
  chip(tE1, 'Enter', { at: [300, 700], hold: 1.2 });
  P0.set(tE1 + 0.05, 0.35, { page: 3 });
  cue('pageTurn', tE1 + 0.05, { n: 1 });
  const tAct = tE1 + 1.0;
  const rp = [CV.x + 1250, CV.y + 330];
  cu(tAct, rp[0], rp[1], { click: true, hold: 0.25 });
  PDS.active.set(tAct + 0.05, 1);
  const tB2 = tAct + 0.85;
  cu(tB2, bx(tB2).cx, bx(tB2).cy, { click: true, hold: 0.25 });
  const typ2 = typeTimes('19', tB2 + 0.55, 4.5);
  const tE2 = typ2[1] + 0.5;
  boxEdit(tB2 + 0.05, '19', typ2, tE2);
  chip(tE2, 'Enter', { at: [300, 700], hold: 1.2 });
  P1.set(tE2 + 0.05, 0.35, { page: 19 });
  cue('pageTurn', tE2 + 0.05, { n: 1 });
  const tZ = tE2 + 1.0;
  cu(tZ - 0.35, rp[0], rp[1]);
  chip(tZ, 'Ctrl', { label: '+ wheel: zoom', tKeys: [tZ - 0.3], hold: 1.6 });
  const r1 = paneRects(tZ)[1];
  P1.set(tZ + 0.02, 0.35, { z: 1.07 * 1.349 }, { anchor: [rp[0] - CV.x - r1.x, rp[1] - CV.y - r1.y] });
  cue('wheelTick', tZ);
  wheelBadge([[tZ, tZ + 0.35, -1]]);
  const tBack = tZ + 0.8;
  ucamTo(tBack, tBack + 1.15, UC_ID);

// ---------------------------------------------------------------------------
// Part 4 timeline: intro card -> Bookmarks -> Thumbnails -> page navigation -> light and dark -> page layouts -> gestures ->

// Every scene takes its speech slots with say('<id>') (js/05-voice.js, generated by parts/d/sync_voice.py from narration.json)
// and schedules its actions from them; checkPacing() reports any action that would start before its sentence and any overlap.
// ---------------------------------------------------------------------------
function buildPart() {
  pdShell();
  // the document's first state: page 1, single page, Fit to Screen (107 %); the second pane exists only while split
  const st0 = { mode: 'single', n: 1, page: 1, z: 1.07, A: [931, 459], D: [297.5, 421] };
  VW.panes[0].init(-1, st0);
  VW.panes[1].init(-1, st0);

  let t = sceneIntroCard(); // "Part 4" + "Reading and review"
  CHAPTERS.push({ t: 0, label: 'Intro' });
  const i1 = say('i1', 0.75); // intro.wipe + 0.4
  const i2 = say('i2', Math.max(after(i1, 0.2), TL.zoomA + 0.1));
  const scene = (label, fn) => {
    CHAPTERS.push({ t, label });
    t = fn(t);
  };
  CHAPTERS.push({ t, label: 'Bookmarks' });
  const b = sceneBookmarks(t, i2);
  t = b.t;
  scene('Thumbnails', sceneThumbs);
  scene('Page navigation', sceneNav);
  scene('Light and dark', sceneTheme);
  scene('Page layouts', sceneLayouts);
  scene('Gestures', sceneGestures);
  scene('Select or Pan', scenePan);
  scene('Review notes', sceneReview);
  scene('Fit', sceneFit);
  scene('Split view', sceneSplit);
  scene('Two image exports', sceneExport);
  const tRecap = t;
  curVis(tRecap - 0.1, 0);
  scene('Recap', sceneRecapD);
  scene('Closing note', sceneWishD);
  CHAPTERS.push({ t, label: 'End card' });
  const end = sceneEndCard(t, { kicker: 'Thank you', title: 'Open it. Read it. Mark it.', sub: 'Try SAVEstimate · tell us what you’d like to see next', fine: 'The sample handbook, names and notes in this video are fictitious.' });
  curVisKeys = CURVIS.slice().sort((a, b2) => a[0] - b2[0]);
  checkPacing();
  return end;
}

/* ---- shared/99-player.js ---- */
// ---------------------------------------------------------------------------
// Player: single master clock, stage fitting, controls, public API.
// ---------------------------------------------------------------------------
const clock = { t: 0, playing: false, last: 0 };
window.duration = 0; // set to the timeline length once the show is built
const CHAPTERS = []; // {t, label}
let DURATION = 100;
let uiHideTimer = 0;

function fitStage() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const s = Math.min(vw / STAGE_W, vh / STAGE_H);
  const x = (vw - STAGE_W * s) / 2;
  const y = (vh - STAGE_H * s) / 2;
  $('stage').style.transform = `translate(${r2(x)}px, ${r2(y)}px) scale(${s})`;
  fit.scale = s;
  if (window.__onFit) window.__onFit(s);
}
const fit = { scale: 1 };

function render() {
  const t = clock.t;
  for (let i = 0; i < FRAME.length; i++) FRAME[i](t);
  updControls();
}

function tick(ts) {
  if (clock.playing) {
    const dt = clamp((ts - clock.last) / 1000, 0, 0.1);
    clock.t += dt;
    render();
  }
  clock.last = ts;
  requestAnimationFrame(tick);
}

const api = {
  seek(s) {
    clock.t = Math.max(0, +s || 0);
    render();
  },
  play() {
    clock.playing = true;
    clock.last = performance.now();
    updPlayIcon();
  },
  pause() {
    clock.playing = false;
    updPlayIcon();
  },
};
window.seek = api.seek;
window.play = api.play;
window.pause = api.pause;

// --------------------------------------------------------------- controls
const ICON_PLAY = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>';
const ICON_PAUSE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4.5" height="16" rx="1.2"/><rect x="13.5" y="4" width="4.5" height="16" rx="1.2"/></svg>';
const ICON_RESTART = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>';
const ICON_FULL = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';

function updPlayIcon() {
  $('btnPlay').innerHTML = clock.playing ? ICON_PAUSE : ICON_PLAY;
}

function updControls() {
  const shown = Math.min(clock.t, DURATION);
  $('timeText').textContent = `${fmtTime(shown)} / ${fmtTime(DURATION)}`;
  S($('scrubFill'), 'width', r2((shown / DURATION) * 100) + '%');
}

function showControls() {
  $('controls').classList.add('show');
  clearTimeout(uiHideTimer);
  uiHideTimer = setTimeout(() => $('controls').classList.remove('show'), 2400);
}

function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else (document.documentElement.requestFullscreen || (() => {})).call(document.documentElement);
}

function buildControls() {
  $('btnPlay').innerHTML = ICON_PLAY;
  $('btnRestart').innerHTML = ICON_RESTART;
  $('btnFull').innerHTML = ICON_FULL;
  const ticks = $('scrubTicks');
  CHAPTERS.forEach((c) => {
    const i = document.createElement('i');
    i.style.left = (c.t / DURATION) * 100 + '%';
    i.title = c.label;
    ticks.appendChild(i);
  });
  $('btnPlay').onclick = () => (clock.playing ? api.pause() : api.play());
  $('btnRestart').onclick = () => {
    api.seek(0);
    api.play();
  };
  $('btnFull').onclick = toggleFullscreen;

  const scrub = $('scrub');
  const tip = $('scrubTip');
  const posToTime = (ev) => {
    const r = $('scrubTrack').getBoundingClientRect();
    return clamp01((ev.clientX - r.left) / r.width) * DURATION;
  };
  const chapterAt = (tm) => {
    let c = CHAPTERS[0];
    for (const ch of CHAPTERS) if (ch.t <= tm + 0.01) c = ch;
    return c;
  };
  let dragging = false;
  scrub.addEventListener('pointerdown', (ev) => {
    dragging = true;
    scrub.setPointerCapture(ev.pointerId);
    api.seek(posToTime(ev));
  });
  scrub.addEventListener('pointermove', (ev) => {
    const tm = posToTime(ev);
    tip.textContent = `${fmtTime(tm)}  ${chapterAt(tm).label}`;
    const r = $('scrubTrack').getBoundingClientRect();
    tip.style.left = ev.clientX - r.left + 'px';
    tip.style.opacity = 1;
    if (dragging) api.seek(tm);
  });
  scrub.addEventListener('pointerleave', () => (tip.style.opacity = 0));
  scrub.addEventListener('pointerup', () => (dragging = false));
  scrub.addEventListener('keydown', (ev) => {
    if (ev.key === 'ArrowLeft') api.seek(clock.t - 5);
    if (ev.key === 'ArrowRight') api.seek(clock.t + 5);
  });

  window.addEventListener('mousemove', showControls);
  window.addEventListener('touchstart', showControls, { passive: true });
  window.addEventListener('keydown', (ev) => {
    if (ev.target && ev.target.id === 'scrub' && (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight')) return;
    const k = ev.key;
    if (k === ' ' || k === 'Spacebar') {
      ev.preventDefault();
      clock.playing ? api.pause() : api.play();
    } else if (k === 'ArrowLeft') api.seek(clock.t - 5);
    else if (k === 'ArrowRight') api.seek(clock.t + 5);
    else if (k === 'r' || k === 'R') {
      api.seek(0);
      api.play();
    } else if (k === 'f' || k === 'F') toggleFullscreen();
    else return;
    showControls();
  });
  window.addEventListener('resize', () => {
    fitStage();
    render();
  });
  document.addEventListener('visibilitychange', () => (clock.last = performance.now()));
}

// -------------------------------------------------------------------- boot
async function boot() {
  const params = new URLSearchParams(location.search);
  buildShell();
  try {
    await Promise.all([document.fonts.load('400 16px "Plus Jakarta Sans"'), document.fonts.load('800 16px "Plus Jakarta Sans"')]);
    await document.fonts.ready;
  } catch (e) {
    /* fall back to system font metrics */
  }
  fitStage();
  measureShell();
  buildSheet();
  buildTimeline(); // scenes register FRAME callbacks, cursor keys, captions...
  DURATION = window.SCENE_END;
  window.duration = DURATION;
  buildControls();
  updPlayIcon();

  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const tParam = params.has('t') ? parseFloat(params.get('t')) : null;
  const auto = params.has('autoplay') ? params.get('autoplay') !== '0' : tParam == null && !reduced;
  clock.t = tParam != null && isFinite(tParam) ? Math.max(0, tParam) : reduced ? DURATION - 2.5 : 0;
  render();
  if (reduced && !params.has('autoplay') && tParam == null) $('motionNote').hidden = false;
  if (auto) api.play();
  requestAnimationFrame((ts) => {
    clock.last = ts;
    requestAnimationFrame(tick);
  });
  window.__ready = true;
}

boot().catch((err) => {
  console.error('boot failed', err);
});

</script>
</body>
