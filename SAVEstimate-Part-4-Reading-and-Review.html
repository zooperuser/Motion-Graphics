:root {
  --bg: #1e1e1e;
  --panel: #252526;
  --border: #3e3e42;
  --accent: #007acc;
  --gold: #c9a24a;
  --gold-hi: #f0d58a;
  --text: #d4d4d4;
  --muted: #8b8b8f;
  --font: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #050505; overflow: hidden; font-family: var(--font); color: var(--text); -webkit-font-smoothing: antialiased; }
svg { display: block; }
.ic { flex: none; }

#viewport { position: fixed; inset: 0; overflow: hidden; background: #050505; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: #0a0a0a; }
#world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 50% 50%; }
#app { position: absolute; inset: 0; background: var(--bg); overflow: hidden; }
#overlays, #cursorLayer, #fxLayer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
#fxLayer { z-index: 6; }

/* ---------------------------------------------------------------- title bar */
#titlebar { position: absolute; left: 0; top: 0; width: 1920px; height: 50px; background: var(--panel); border-bottom: 1px solid var(--border); }
.brand { position: absolute; left: 22px; top: 0; line-height: 50px; font-weight: 800; font-size: 21px; color: #fff; letter-spacing: -0.2px; }
.menus { position: absolute; left: 170px; top: 0; height: 50px; display: flex; align-items: center; gap: 8px; }
.mi { position: relative; height: 32px; line-height: 32px; padding: 0 13px; border-radius: 6px; font-size: 16.5px; font-weight: 500; color: #c9c9c9; }
.mi.open { background: rgba(255, 255, 255, 0.11); color: #fff; }

/* --------------------------------------------------------------------- rail */
#rail { position: absolute; left: 0; top: 50px; width: 58px; height: 1030px; background: var(--panel); border-right: 1px solid var(--border); }
.rbtn { position: absolute; left: 0; width: 58px; height: 58px; display: grid; place-items: center; color: #9da3ab; }
.rbtn .bi { grid-area: 1 / 1; display: grid; place-items: center; }

/* ------------------------------------------------------------------ toolbar */
#toolbar { position: absolute; left: 58px; top: 50px; width: 1862px; height: 78px; background: var(--panel); border-bottom: 1px solid var(--border); }
#tbRow { position: absolute; left: 16px; top: 0; height: 78px; display: flex; align-items: center; gap: 12px; }
.tg { position: relative; height: 56px; display: flex; align-items: center; gap: 3px; padding: 0 5px; border: 1px solid rgba(62, 62, 66, 0.9); border-radius: 12px; background: rgba(30, 30, 30, 0.62); box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.35); }
.mbtn { height: 42px; border-radius: 8px; padding: 0 14px; display: flex; align-items: center; gap: 8px; font-size: 15.5px; font-weight: 600; color: #b9b9bd; }
.mbtn.on { background: rgba(255, 255, 255, 0.12); color: #fff; }
.mbtn.mk.on { background: var(--accent); color: #fff; }
.tb { position: relative; width: 44px; height: 44px; border-radius: 9px; display: grid; place-items: center; color: #cdcdd0; flex: none; }
.tb.wide { width: 56px; }
.tb.dim { color: #6f747b; }
.tb .bi { grid-area: 1 / 1; display: grid; place-items: center; }
.tb .cv { position: absolute; right: 5px; bottom: 5px; color: #858a92; }
.tb.on { background: var(--accent); color: #fff; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12) inset; }
.tb.on .cv { color: #dbeafe; }
.sep { width: 1px; height: 26px; background: var(--border); margin: 0 5px; flex: none; }
.dtools { display: flex; align-items: center; gap: 9px; padding: 0 12px 0 8px; height: 44px; font-size: 17.5px; font-weight: 500; color: #d3d3d6; }
#tbSwap { position: relative; width: 1200px; height: 56px; }
#gView { position: absolute; left: 0; top: 0; }
#gMarkup { position: absolute; left: 0; top: 0; display: flex; gap: 12px; }

/* ------------------------------------------------------------------- canvas */
#cv { position: absolute; left: 58px; top: 128px; width: 1862px; height: 918px; background: #2d2f33; overflow: hidden; }
#cvSvg { position: absolute; left: 0; top: 0; }
#cvHtml { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#cvBorder { position: absolute; inset: 0; box-shadow: inset 0 0 0 2px var(--accent); pointer-events: none; z-index: 5; }
#cvEmpty { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; color: #3c4453; }
.emptyText { font-size: 27px; font-weight: 400; letter-spacing: 0.1px; }
.paper-shimmer { position: absolute; top: 0; bottom: 0; width: 260px; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.55), transparent); mix-blend-mode: soft-light; }

/* -------------------------------------------------------------- status bar */
#status { position: absolute; left: 58px; top: 1046px; width: 1862px; height: 34px; background: var(--accent); color: #fff; font-size: 15.5px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px 0 26px; }
#stLeft { display: flex; align-items: center; gap: 0; white-space: nowrap; }
.stx { margin-left: 22px; padding-left: 22px; border-left: 1px solid rgba(255, 255, 255, 0.35); }
.stScale { color: #e8fbe8; font-weight: 600; }
#stRight { display: flex; align-items: center; gap: 18px; font-size: 16px; }
#stZoom { min-width: 52px; text-align: center; }

/* ----------------------------------------------------------------- popups */
.pop { position: absolute; background: var(--panel); border: 1px solid var(--border); border-radius: 9px; box-shadow: 0 22px 52px rgba(0, 0, 0, 0.6); padding: 6px; font-size: 15.5px; color: #d7d7da; opacity: 0; transform-origin: 0 0; z-index: 3; }
.pi { display: flex; align-items: center; gap: 11px; height: 36px; padding: 0 12px 0 11px; border-radius: 6px; white-space: nowrap; }
.pi.hov { background: var(--accent); color: #fff; }
.pi .k { margin-left: auto; padding-left: 34px; color: #8b8b8f; font-size: 14px; }
.pi.hov .k { color: #dbeafe; }
.pi .ic { color: #a9aeb6; }
.pi.hov .ic { color: #fff; }
.psep { height: 1px; background: var(--border); margin: 5px 4px; }
.plabel { font-size: 11.5px; letter-spacing: 0.09em; text-transform: uppercase; color: #7f8791; padding: 7px 11px 4px; }

/* --------------------------------------------------------------- dialogs */
.scrim { position: absolute; left: 58px; top: 128px; width: 1862px; height: 918px; background: rgba(0, 0, 0, 0.5); opacity: 0; z-index: 2; }
.dlg { position: absolute; width: 440px; background: var(--panel); border: 1px solid var(--border); border-radius: 9px; box-shadow: 0 30px 70px rgba(0, 0, 0, 0.65); padding: 22px 22px 20px; color: #cfcfd3; opacity: 0; z-index: 4; transform-origin: 50% 50%; }
.dlg h3 { font-size: 20px; font-weight: 700; color: #fff; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.dlg p { font-size: 15px; line-height: 1.5; color: #a4a8b0; margin-bottom: 16px; }
.dlg p b { color: #e6e6e8; }
.dlg .lab { font-size: 12.5px; font-weight: 700; color: #cfcfd3; margin: 0 0 6px; }
.seg { display: flex; gap: 8px; margin-bottom: 16px; }
.seg span { flex: 1; text-align: center; padding: 7px 0; font-size: 13.5px; border-radius: 5px; border: 1px solid var(--border); background: var(--bg); color: #9a9ea6; }
.seg span.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.inp { height: 42px; border-radius: 5px; border: 1px solid var(--border); background: var(--bg); color: #fff; font-size: 17px; padding: 0 12px; display: flex; align-items: center; margin-bottom: 14px; }
.inp.focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.inp .caret { display: inline-block; width: 2px; height: 22px; background: #fff; margin-left: 1px; }
.btnrow { display: flex; justify-content: flex-end; gap: 12px; margin-top: 6px; }
.btn { padding: 8px 18px; border-radius: 6px; font-size: 15px; color: #cfcfd3; }
.btn.pri { background: var(--accent); color: #fff; font-weight: 700; }
.btn.hov { filter: brightness(1.25); }

/* ------------------------------------------------------ panels, toasts, chips */
.toast { position: absolute; right: 28px; top: 146px; display: flex; align-items: center; gap: 12px; padding: 14px 22px 14px 16px; border-radius: 10px; background: rgba(28, 32, 38, 0.96); border: 1px solid #2f7d4f; box-shadow: 0 18px 44px rgba(0, 0, 0, 0.5); font-size: 17px; font-weight: 600; color: #fff; opacity: 0; z-index: 4; }
.toast .ck { width: 30px; height: 30px; border-radius: 50%; background: #1f9d55; display: grid; place-items: center; color: #fff; }
.toast small { display: block; font-weight: 400; font-size: 13.5px; color: #9fb3a7; margin-top: 2px; }

/* ---- page effects panel (Watermark & Hide) */
.fxpanel { position: absolute; width: 350px; background: var(--panel); border: 1px solid var(--border); border-radius: 9px; box-shadow: 0 26px 64px rgba(0, 0, 0, 0.65); color: #e2e2e5; opacity: 0; z-index: 4; overflow: hidden; }

.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.note { margin-top: 12px; font-size: 12.5px; color: #8b8f97; line-height: 1.45; }

/* ---- stamp library popup */

/* ------------------------------------------------------ captions (lower third) */
.cap { position: absolute; left: 92px; top: 928px; max-width: 900px; padding: 16px 30px 17px 24px; background: linear-gradient(90deg, rgba(8, 9, 11, 0.92), rgba(8, 9, 11, 0.74)); border-left: 5px solid var(--gold); border-radius: 0 12px 12px 0; box-shadow: 0 18px 44px rgba(0, 0, 0, 0.5); opacity: 0; z-index: 5; }

.cap .cg { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: linear-gradient(90deg, var(--gold-hi), transparent); transform-origin: 0 0; }

/* -------------------------------------------------------------------- cursor */

.spark { position: absolute; left: 0; top: 0; width: 9px; height: 9px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--gold-hi); box-shadow: 0 0 10px 3px rgba(240, 213, 138, 0.7); opacity: 0; z-index: 8; }
.loupe { position: absolute; width: 230px; height: 230px; opacity: 0; z-index: 7; }

/* ------------------------------------------------------- intro and finale */
#intro, #finale { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0a; pointer-events: none; }
#finale { z-index: 7; }
#intro { z-index: 10; }
.gridbg { position: absolute; inset: -10%; background-image: linear-gradient(rgba(201, 162, 74, 0.09) 1px, transparent 1px), linear-gradient(90deg, rgba(201, 162, 74, 0.09) 1px, transparent 1px); background-size: 54px 54px; -webkit-mask-image: radial-gradient(ellipse 55% 55% at 50% 47%, #000 15%, transparent 75%); mask-image: radial-gradient(ellipse 55% 55% at 50% 47%, #000 15%, transparent 75%); }

.logostage { position: relative; overflow: hidden; background: #0a0a0a; }
.logoimg { display: block; width: 100%; height: auto; -webkit-mask-image: radial-gradient(ellipse 72% 72% at 50% 50%, #000 55%, transparent 98%); mask-image: radial-gradient(ellipse 72% 72% at 50% 50%, #000 55%, transparent 98%); }
.sheenimg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; pointer-events: none; -webkit-mask-image: linear-gradient(100deg, transparent 33%, #000 50%, transparent 67%); mask-image: linear-gradient(100deg, transparent 33%, #000 50%, transparent 67%); -webkit-mask-size: 250% 100%; mask-size: 250% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: 100% 0; mask-position: 100% 0; }

.scan { position: absolute; top: -4%; bottom: -4%; left: 0; width: 3px; background: linear-gradient(to bottom, transparent, var(--gold-hi) 20%, var(--gold-hi) 80%, transparent); box-shadow: 0 0 18px 4px rgba(240, 213, 138, 0.6); }
.corner { position: absolute; width: 26px; height: 26px; border: 0 solid rgba(201, 162, 74, 0.75); }

.corner.tr { top: -16px; right: -16px; border-top-width: 1px; border-right-width: 1px; }
.corner.bl { bottom: -16px; left: -16px; border-bottom-width: 1px; border-left-width: 1px; }
.corner.br { bottom: -16px; right: -16px; border-bottom-width: 1px; border-right-width: 1px; }
.tagline { position: absolute; left: 0; width: 1920px; text-align: center; font-size: 58px; font-weight: 800; letter-spacing: -0.5px; color: #e9e2cf; }
.tagline span { display: inline-block; margin: 0 14px; background: linear-gradient(180deg, #fff3cf, var(--gold) 70%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.mote { position: absolute; border-radius: 50%; background: var(--gold-hi); box-shadow: 0 0 8px 2px rgba(240, 213, 138, 0.6); }
.flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(255, 236, 190, 0.9), rgba(201, 162, 74, 0.0) 62%); opacity: 0; }
#rain { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
.endcard { position: absolute; left: 0; width: 1920px; text-align: center; color: #cfc8b6; }
.endcard .tile { width: 92px; height: 92px; border-radius: 22px; margin: 0 auto 18px; box-shadow: 0 0 0 1px rgba(240, 213, 138, 0.5), 0 0 50px rgba(240, 213, 138, 0.35); }
.endcard .row { font-size: 21px; letter-spacing: 0.28em; text-transform: uppercase; color: #b9b19a; }

.endcard .sub { margin-top: 12px; font-size: 16px; letter-spacing: 0.16em; color: #7f7a6c; text-transform: uppercase; }

/* ---------------------------------------------------------------- controls */
#controls { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(880px, calc(100vw - 32px)); height: 50px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-radius: 26px; background: rgba(14, 15, 18, 0.82); border: 1px solid rgba(240, 213, 138, 0.25); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #e6e0cf; font-size: 13px; opacity: 0; transition: opacity 0.35s; z-index: 30; }

#controls button:focus-visible, #scrub:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }

#scrubTip { position: absolute; bottom: 30px; padding: 3px 9px; border-radius: 5px; background: #000; border: 1px solid #333; color: #fff; font-size: 12px; white-space: nowrap; opacity: 0; pointer-events: none; transform: translateX(-50%); }
#motionNote { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); padding: 8px 16px; border-radius: 8px; background: rgba(0, 0, 0, 0.8); color: #f0d58a; font-size: 13px; z-index: 40; }

@media (max-width: 520px) {
  #controls { height: 44px; gap: 6px; padding: 0 8px; bottom: 10px; }

}

/* ---------------------------------------------------------- sheet theming */
#cvSvg, .loupe { --pb: #2d2f33; --paper: #ffffff; --ink: #1c2230; --ink2: #5b6473; --wall: #262b36; --grid: #a9b3c2; --dim: #1f5fa8; --glass: #dbeeff; --col: #9aa3b2; --furn: #8a93a2; --tint: rgba(30, 60, 120, 0.035); --riser: #e7ecf4; --chip: #ffffff; }
#cvSvg .darkTheme { --pb: #101114; --paper: #0d1424; --ink: #e3e9f4; --ink2: #8a97ad; --wall: #cfd8e6; --grid: #3d4a63; --dim: #6db3ff; --glass: #1f3a5c; --col: #56627a; --furn: #5d6b85; --tint: rgba(150, 190, 255, 0.045); --riser: #16233b; --chip: #0d1424; }
.pb { fill: var(--pb); }
.paper { fill: var(--paper); }
.ln { stroke: var(--ink); fill: none; }
.grd { stroke: var(--grid); fill: none; }
.dim { stroke: var(--dim); fill: none; }
.wall { fill: var(--wall); }
.glass { fill: var(--glass); stroke: var(--ink); }
.col { fill: var(--col); stroke: var(--ink); }
.furn { stroke: var(--furn); fill: none; }
.riser { fill: var(--riser); stroke: var(--ink); }
.roomtint { fill: var(--tint); }
.fillink { fill: var(--ink); }
.t { fill: var(--ink); font-family: var(--font); }
.t2 { fill: var(--ink2); font-family: var(--font); }
.dimt { fill: var(--dim); font-family: var(--font); }
.sf { font-family: var(--font); }

#finale .logostage { background: transparent; }
#finale .logoimg { mix-blend-mode: lighten; }
.fine { position: absolute; left: 0; width: 1920px; text-align: center; bottom: 26px; font-size: 15px; letter-spacing: 0.06em; color: #6c6858; opacity: 0; }
.inp .sel { background: rgba(0, 122, 204, 0.6); border-radius: 2px; padding: 0 3px; margin-left: -3px; }

function iconInner(name) {
  const nodes = ICON_NODES[name];
  if (!nodes) throw new Error('missing icon ' + name);
  return nodes
    .map(([tag, attrs]) => `<${tag} ${Object.keys(attrs).map((k) => `${k}="${attrs[k]}"`).join(' ')}/>`)
    .join('');
}

/** Inline lucide SVG string. */
function ic(name, size = 22, sw = 2, cls = '') {
  return `<svg class="ic ${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${iconInner(name)}</svg>`;
}

/** Convert an icon to plain path strings so it can be drawn with Path2D on a canvas. */
function iconToPaths(name) {
  const out = [];
  for (const [tag, a] of ICON_NODES[name]) {
    if (tag === 'path') out.push(a.d);
    else if (tag === 'circle') {
      const cx = +a.cx;
      const cy = +a.cy;
      const r = +a.r;
      out.push(`M${cx - r} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0`);
    } else if (tag === 'line') out.push(`M${a.x1} ${a.y1}L${a.x2} ${a.y2}`);
    else if (tag === 'polyline' || tag === 'polygon') {
      const pts = a.points.trim().split(/[\s,]+/).map(Number);
      let d = `M${pts[0]} ${pts[1]}`;
      for (let i = 2; i < pts.length; i += 2) d += `L${pts[i]} ${pts[i + 1]}`;
      out.push(tag === 'polygon' ? d + 'Z' : d);
    } else if (tag === 'rect') {
      const x = +a.x;
      const y = +a.y;
      const w = +a.width;
      const hh = +a.height;
      const rx = +(a.rx || 0);
      out.push(rx ? `M${x + rx} ${y}h${w - 2 * rx}a${rx} ${rx} 0 0 1 ${rx} ${rx}v${hh - 2 * rx}a${rx} ${rx} 0 0 1 ${-rx} ${rx}h${-(w - 2 * rx)}a${rx} ${rx} 0 0 1 ${-rx} ${-rx}v${-(hh - 2 * rx)}a${rx} ${rx} 0 0 1 ${rx} ${-rx}z` : `M${x} ${y}h${w}v${hh}h${-w}z`);
    } else if (tag === 'ellipse') {
      const cx = +a.cx;
      const cy = +a.cy;
      const rx = +a.rx;
      const ry = +a.ry;
      out.push(`M${cx - rx} ${cy}a${rx} ${ry} 0 1 0 ${2 * rx} 0a${rx} ${ry} 0 1 0 ${-2 * rx} 0`);
    }
  }
  return out;
}

function tbButton(def) {
  if (def === 'sep') return '<div class="sep"></div>';
  const icons = def.icons.map((k, i) => `<span class="bi" data-k="${k}" style="opacity:${i === 0 ? 1 : 0}">${ic(k, 22)}</span>`).join('');

  return `<div class="tb${def.wide ? ' wide' : ''}" id="tb-${def.id}" data-tip="${def.tip}">${icons}${chev}</div>`;
}

/** Position of an element in stage coordinates from layout offsets (unaffected by CSS transforms). */
function layoutRect(el) {
  let x = 0;
  let y = 0;
  for (let e = el; e && e.id !== 'stage'; e = e.offsetParent) {
    x += e.offsetLeft;
    y += e.offsetTop;
  }
  const w = el.offsetWidth;
  const hh = el.offsetHeight;
  return { x, y, w, h: hh, cx: x + w / 2, cy: y + hh / 2 };
}

function measureShell() {
  for (const k of Object.keys(UI.tbBtns)) POS.btn[k] = layoutRect(UI.tbBtns[k]);
  for (const m of MENU_NAMES) POS.menu[m] = layoutRect($('mi-' + m));
  POS.viewBtn = layoutRect(UI.viewBtn);
  POS.markupBtn = layoutRect(UI.markupBtn);
  POS.moon = layoutRect(UI.railMoon);
  POS.dtools = layoutRect($('tb-dtools'));
  POS.canvas = layoutRect($('cv'));
  POS.zoomBox = layoutRect($('stRight'));
}

// ----- static drawing string helpers ---------------------------------------
const f1 = (v) => (Math.round(v * 10) / 10).toString();

function T(x, y, str, o = {}) {
  const size = o.size || 8;
  const cls = o.cls || 't';
  const w = o.weight || 500;
  const anchor = o.anchor || 'start';
  const rot = o.rot ? ` transform="rotate(${o.rot} ${f1(x)} ${f1(y)})"` : '';
  const id = o.id ? ` id="${o.id}"` : '';
  const ls = o.ls ? ` letter-spacing="${o.ls}"` : '';
  return `<text${id} class="${cls}" x="${f1(x)}" y="${f1(y)}" font-size="${size}" font-weight="${w}" text-anchor="${anchor}"${ls}${rot}>${str}</text>`;
}
const L = (x1, y1, x2, y2, cls = 'ln', sw = 0.8, extra = '') => `<line class="${cls}" x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" stroke-width="${sw}" ${extra}/>`;
const R = (x, y, w, hh, cls = 'ln', sw = 0.8, extra = '') => `<rect class="${cls}" x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(hh)}" stroke-width="${sw}" ${extra}/>`;
const C = (x, y, r, cls = 'ln', sw = 0.8, extra = '') => `<circle class="${cls}" cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" stroke-width="${sw}" ${extra}/>`;

/** Wall as filled rectangles with openings cut out (metres in, points out). */
function wallSVG(x1, y1, x2, y2, t, openings) {
  const horiz = y1 === y2;
  const a = horiz ? Math.min(x1, x2) : Math.min(y1, y2);
  const b = horiz ? Math.max(x1, x2) : Math.max(y1, y2);
  const cuts = (openings || []).map((o) => [o.c - o.w / 2, o.c + o.w / 2]).sort((p, q) => p[0] - q[0]);
  const pieces = [];
  let cur = a;
  for (const [s, e] of cuts) {
    pieces.push([cur, s]);
    cur = e;
  }
  pieces.push([cur, b]);
  let out = '';
  for (const [s, e] of pieces) {
    if (e - s <= 0) continue;
    const s2 = s === a ? s - t / 2 : s;
    const e2 = e === b ? e + t / 2 : e;
    if (horiz) out += `<rect class="wall" x="${f1(mx(s2))}" y="${f1(my(y1 - t / 2))}" width="${f1((e2 - s2) * PPM)}" height="${f1(t * PPM)}"/>`;
    else out += `<rect class="wall" x="${f1(mx(x1 - t / 2))}" y="${f1(my(s2))}" width="${f1(t * PPM)}" height="${f1((e2 - s2) * PPM)}"/>`;
  }
  return out;
}

function windowSVG(horiz, at, c, w, t) {
  if (horiz) {
    const x = mx(c - w / 2);
    const y = my(at - t / 2);
    return `<rect class="glass" x="${f1(x)}" y="${f1(y)}" width="${f1(w * PPM)}" height="${f1(t * PPM)}" stroke-width="0.7"/>${L(x, my(at), x + w * PPM, my(at), 'ln', 0.6)}`;
  }
  const x = mx(at - t / 2);
  const y = my(c - w / 2);
  return `<rect class="glass" x="${f1(x)}" y="${f1(y)}" width="${f1(t * PPM)}" height="${f1(w * PPM)}" stroke-width="0.7"/>${L(mx(at), y, mx(at), y + w * PPM, 'ln', 0.6)}`;
}

/** Door leaf + swing arc. hinge = 'a' (low end) or 'b' (high end); dir = +1/-1 side of the swing. */
function doorSVG(horiz, at, c, w, hinge, dir) {
  const lo = c - w / 2;
  const hi = c + w / 2;
  const hg = hinge === 'a' ? lo : hi;
  const other = hinge === 'a' ? hi : lo;
  const P = (u, v) => (horiz ? [mx(u), my(v)] : [mx(v), my(u)]);
  const H = P(hg, at);
  const closed = P(other, at);
  const open = P(hg, at + dir * w);
  const a0 = Math.atan2(closed[1] - H[1], closed[0] - H[0]);
  const a1 = Math.atan2(open[1] - H[1], open[0] - H[0]);
  let d = a1 - a0;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  const r = w * PPM;
  const pts = [];
  for (let i = 0; i <= 12; i++) {
    const a = a0 + (d * i) / 12;
    pts.push([H[0] + r * Math.cos(a), H[1] + r * Math.sin(a)]);
  }
  return `<polyline class="ln" points="${ptsStr(pts)}" stroke-width="0.5" stroke-dasharray="2 1.6"/>${L(H[0], H[1], open[0], open[1], 'ln', 1.4)}`;
}

/* ---- shared/40-engine.js ---- */
// ---------------------------------------------------------------------------
// Timeline engine: camera (with cursor-follow), cursor, tool selection, popups, captions.
// Every function here is a pure function of time t; nothing accumulates (the follow camera is a table built once).
// ---------------------------------------------------------------------------
const FRAME = [];
const onFrame = (fn) => FRAME.push(fn);

const OV = () => $('overlays');

// ---------------------------------------------------------------- camera
// The camera the scene author writes (cam / camMove) is the BASE camera. On top of it finalizeCamera() adds a pan
// correction, computed once when the timeline is built (a table sampled at 60 Hz, so every frame stays a pure function
// of time): the camera follows the cursor, looking ahead of it, so the cursor and the spot it is heading for are always
// inside the comfort zone of the frame. See finalizeCamera() below.
const ANCHOR = { x: CV.w / 2, y: CV.h / 2 };
const CAMKEYS = [];
let camCache = { t: NaN, v: null };
const CAMF = { step: 1 / 60, table: null, sim: null, lookahead: 1.0, follow: 0.09, relax: 0.7 };
/** Comfort zone of the cursor on the stage (stage px): well inside the canvas, clear of the option bar, VCB and captions. */
const SAFE = { x0: CV.x + 180, x1: CV.x + CV.w - 180, y0: CV.y + 170, y1: CV.y + CV.h - 170 };

/** Camera key: at time t the sheet point (fx, fy) sits at the canvas centre with zoom z. */
function cam(t, fx, fy, z, e = 'inOutCubic') {
  CAMKEYS.push({ t, fx, fy, z, e });
}

/** Hold the previous camera until t0, then ease to the new framing by t1. */
function camMove(t0, t1, fx, fy, z, e = 'inOutCubic') {
  const last = CAMKEYS[CAMKEYS.length - 1];
  if (last.t < t0) CAMKEYS.push({ t: t0, fx: last.fx, fy: last.fy, z: last.z, e: 'lin' });
  CAMKEYS.push({ t: t1, fx, fy, z, e });
}

/** The authored camera at time t (no follow correction). In focus mode (43-focus-camera.js) the planned focus camera. */
function camBase(t) {
  const k = FOCUS.keys || CAMKEYS;
  if (t <= k[0].t) return { fx: k[0].fx, fy: k[0].fy, z: k[0].z };
  if (t >= k[k.length - 1].t) return { fx: k[k.length - 1].fx, fy: k[k.length - 1].fy, z: k[k.length - 1].z };
  let i = 1;
  while (t >= k[i].t) i++;
  const a = k[i - 1];
  const b = k[i];
  const u = ease[b.e](invLerp(a.t, b.t, t));
  return { fx: lerp(a.fx, b.fx, u), fy: lerp(a.fy, b.fy, u), z: Math.exp(lerp(Math.log(a.z), Math.log(b.z), u)) };
}

/** The camera actually shown: authored camera + follow correction (or a trial correction while the table is being built). */
function camAt(t) {
  if (!CAMF.sim && camCache.t === t) return camCache.v;
  const b = camBase(t);
  let fx = b.fx;
  let fy = b.fy;
  if (CAMF.sim) {
    fx += CAMF.sim[0];
    fy += CAMF.sim[1];
  } else if (CAMF.table) {
    const T = CAMF.table;
    const n = T.length / 2 - 1;
    const u = clamp(t / CAMF.step, 0, n);
    const i = Math.min(n - 1, Math.floor(u));
    const f = u - i;
    fx += T[2 * i] + (T[2 * i + 2] - T[2 * i]) * f;
    fy += T[2 * i + 1] + (T[2 * i + 3] - T[2 * i + 1]) * f;
  }
  const v = { z: b.z, fx, fy, tx: ANCHOR.x - b.z * fx, ty: ANCHOR.y - b.z * fy };
  if (!CAMF.sim) camCache = { t, v };
  return v;
}

function sheetToStage(sx, sy, t) {
  const c = camAt(t);
  return [CV.x + c.tx + c.z * sx, CV.y + c.ty + c.z * sy];
}

function stageToSheet(px, py, t) {
  const c = camAt(t);
  return [(px - CV.x - c.tx) / c.z, (py - CV.y - c.ty) / c.z];
}

// ---------------------------------------------------------------- cursor
const CUR = [];
const CLICKS = [];

/**
 * Cursor key: the cursor is at (x, y) at time t. x/y are stage px (cGo, cGoP: toolbar, menus, option bar, dialogs: they
 * never move) or sheet points (cGoS: they move with the camera). Options: click (click 0.05 s after arriving), kind
 * ('left'|'right'), hold (stay this long), e (easing), bend/side (path curvature), sweep: true (keep the legacy
 * behaviour of travelling for the whole gap to the previous key, for slow deliberate sweeps).
 */
function cGo(t, x, y, o = {}) {
  CUR.push({ t, sp: o.sp || 'st', x, y, e: o.e || 'inOutCubic', bend: o.bend, side: o.side, sweep: !!o.sweep });
  const hold = o.hold != null ? o.hold : o.click ? 0.24 : 0;
  if (o.click) CLICKS.push({ t: t + 0.05, kind: o.kind || 'left' });
  if (hold > 0) CUR.push({ t: t + hold, sp: o.sp || 'st', x, y, e: 'lin' });
}
const cGoS = (t, sx, sy, o = {}) => cGo(t, sx, sy, { ...o, sp: 'sh' });
const cGoP = (t, p, o = {}) => cGo(t, p.cx, p.cy, o); // POS rect centre
function cClick(t, kind = 'left') {
  CLICKS.push({ t, kind });
}

// ------------------------------------------------- audio cue registry
// The page itself stays silent. Scenes register semantic one-shot cues with the SAME time
// variables their animations use, so the exported cue list (window.AUDIO_CUES, see
// 70-audio-cues.js) cannot drift from the visuals. build_soundtrack.py turns it into sound.
const CUES = [];
/** Register a cue: `kind` names the event, `t` is its exact master time in seconds, `o` adds fields (t1, dur, n...). */
function cue(kind, t, o = {}) {
  CUES.push({ kind, t, ...o });
}
/** Typing burst: `times[k]` is the instant character k appears on screen. */
function cueTyping(label, times) {
  cue('typing', times[0], { label, t1: times[times.length - 1], times });
}

function curKeyPos(k, t) {
  return k.sp === 'sh' ? sheetToStage(k.x, k.y, t) : [k.x, k.y];
}

/**
 * When the cursor starts travelling to key b from key a. A short gap is travelled in full (the authored, tuned motion).
 * After a long gap the cursor RESTS at a and then makes one quick purposeful move that ends at b.t, so it never drifts
 * slowly across the screen between scenes while the camera is somewhere else.
 */
function travelStart(a, b) {
  const gap = b.t - a.t;
  if (b.sweep || gap <= 1.4) return a.t;
  let dpx = 900;
  if (a.sp === 'sh' && b.sp === 'sh') dpx = Math.hypot(b.x - a.x, b.y - a.y) * (FOCUS.zFn ? FOCUS.zFn(b.t) : camBase(b.t).z);
  else if (a.sp === 'st' && b.sp === 'st') dpx = Math.hypot(b.x - a.x, b.y - a.y);
  return Math.max(a.t, b.t - clamp(0.3 + dpx / 1700, 0.4, 1.1));
}

function cursorPos(t) {
  const n = CUR.length;
  if (t <= CUR[0].t) return curKeyPos(CUR[0], t);
  if (t >= CUR[n - 1].t) return curKeyPos(CUR[n - 1], t);
  let lo = 0;
  let hi = n - 1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (CUR[mid].t <= t) lo = mid;
    else hi = mid;
  }
  const a = CUR[lo];
  const b = CUR[hi];
  const ts = travelStart(a, b);
  if (t <= ts) return curKeyPos(a, t);
  const p0 = curKeyPos(a, t);
  const p1 = curKeyPos(b, t);
  const u = ease[b.e || 'inOutCubic'](invLerp(ts, b.t, t));
  const dx = p1[0] - p0[0];
  const dy = p1[1] - p0[1];
  const d = Math.hypot(dx, dy);
  const bend = b.bend != null ? b.bend : d > 300 ? 0.17 : d > 120 ? 0.07 : 0;
  const mx0 = (p0[0] + p1[0]) / 2;
  const my0 = (p0[1] + p1[1]) / 2;
  let side = b.side;
  if (!side) {
    // the arc of the path always bulges toward the middle of the canvas, never out toward an edge of the frame
    const cc = [CV.x + CV.w / 2, CV.y + CV.h / 2];
    const dPos = Math.hypot(mx0 - dy * bend - cc[0], my0 + dx * bend - cc[1]);
    const dNeg = Math.hypot(mx0 + dy * bend - cc[0], my0 - dx * bend - cc[1]);
    side = dPos <= dNeg ? 1 : -1;
  }
  const cx = mx0 - dy * bend * side;
  const cy = my0 + dx * bend * side;
  const w0 = (1 - u) * (1 - u);
  const w1 = 2 * (1 - u) * u;
  const w2 = u * u;
  return [w0 * p0[0] + w1 * cx + w2 * p1[0], w0 * p0[1] + w1 * cy + w2 * p1[1]];
}

const cursorSheet = (t) => {
  const p = cursorPos(t);
  return stageToSheet(p[0], p[1], t);
};

// ------------------------------------------------------ camera follows the cursor (look-ahead pan)
/**
 * The camera the author writes (cam / camMove) is only the framing; the cursor must never leave the picture. The rules
 * below say where the cursor, or the drawing spot it is heading for, has to be, and finalizeCamera() pans the authored
 * camera so that holds. The constraint point at time t (cursorConstraint) is:
 *   - resting on a sheet point         that point (the last spot worked on stays in the frame)
 *   - travelling sheet -> sheet        the cursor itself
 *   - travelling stage -> sheet        the destination, from 0.5 s before the cursor arrives (toolbar -> drawing trips
 *                                      start in the chrome, so only the target has to be framed)
 *   - travelling to the chrome         none (the cursor is going to the toolbar / a menu / the option bar)
 * and it has to lie inside SAFE (the comfort zone).
 */
function cursorSegment(t) {
  const n = CUR.length;
  if (t <= CUR[0].t) return { a: CUR[0], b: CUR[0] };
  if (t >= CUR[n - 1].t) return { a: CUR[n - 1], b: CUR[n - 1] };
  let lo = 0;
  let hi = n - 1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (CUR[mid].t <= t) lo = mid;
    else hi = mid;
  }
  return { a: CUR[lo], b: CUR[hi] };
}

/** The stage point the camera has to keep inside SAFE at time t (see above), or null. Uses the camera currently in effect. */
function cursorConstraint(t) {
  const { a, b } = cursorSegment(t);
  if (a === b || t <= travelStart(a, b)) return a.sp === 'sh' ? sheetToStage(a.x, a.y, t) : null; // at rest
  if (b.sp !== 'sh') return null; // heading for the chrome
  if (a.sp === 'sh') return cursorPos(t); // drawing -> drawing
  return t >= b.t - 0.5 ? sheetToStage(b.x, b.y, t) : null; // chrome -> drawing: frame the destination
}

/** Debug/probe view of the cursor at time t: where it is and the point the camera is keeping in the comfort zone. */
function cursorDebug(t) {
  const p = cursorPos(t);
  const c = cursorConstraint(t);
  return { x: p[0], y: p[1], vis: curVisible(t), check: c ? [c[0], c[1]] : null };
}

const overshoot = (p, r) => [p[0] < r.x0 ? p[0] - r.x0 : p[0] > r.x1 ? p[0] - r.x1 : 0, p[1] < r.y0 ? p[1] - r.y0 : p[1] > r.y1 ? p[1] - r.y1 : 0];

function finalizeCamera(end) {
  if (!CUR.length || !CAMKEYS.length) return;
  CUR.sort((p, q) => p.t - q.t); // cursorPos() bisects this list
  if (focusCameraOn()) return focusPlan(end); // working-area framing, one eased move per focus change (43-focus-camera.js)
  // ---- original camera: authored keys + cursor-follow correction (parts without part.json "camera": "focus")
  const step = CAMF.step;
  const n = Math.ceil(end / step) + 1;
  const LA = CAMF.lookahead;
  const table = new Float32Array(n * 2);
  const relaxRect = { x0: SAFE.x0 + 70, x1: SAFE.x1 - 70, y0: SAFE.y0 + 60, y1: SAFE.y1 - 60 };
  const K = 10;

  /** Overshoot (stage px, per axis) the camera has to cancel, looking LA ahead with a constant correction d: the first
   *  violation in time decides, together with the next 0.3 s of samples so the pan does not stop short. */
  const need = (t, d, rect) => {
    CAMF.sim = d;
    let nx = 0;
    let ny = 0;
    let firstHit = -1;
    for (let k = 0; k <= K; k++) {
      const tau = t + (LA * k) / K;
      const p = cursorConstraint(tau);
      if (!p) continue;
      const o = overshoot(p, rect);
      if (o[0] === 0 && o[1] === 0) continue;
      if (firstHit < 0) firstHit = tau;
      if (tau > firstHit + 0.3) break;
      if (Math.abs(o[0]) > Math.abs(nx)) nx = o[0];
      if (Math.abs(o[1]) > Math.abs(ny)) ny = o[1];
    }
    CAMF.sim = null;
    return [nx, ny];
  };

  let dx = 0;
  let dy = 0;
  for (let i = 0; i < n; i++) {
    const t = i * step;
    table[2 * i] = dx;
    table[2 * i + 1] = dy;
    const z = camBase(t).z;
    const c = need(t, [dx, dy], SAFE);
    let tx = dx;
    let ty = dy;
    let tau = 1;
    if (c[0] !== 0 || c[1] !== 0) {
      tx = dx + c[0] / z; // the focus moves toward the point, so the point slides back into the zone
      ty = dy + c[1] / z;
      tau = CAMF.follow;
      // the pan may start early, but never so early that the point the cursor is on NOW is pushed out of the zone
      CAMF.sim = [dx, dy];
      const pNow = cursorConstraint(t);
      CAMF.sim = null;
      if (pNow) {
        tx = clamp(tx, dx + (pNow[0] - SAFE.x1) / z, dx + (pNow[0] - SAFE.x0) / z);
        ty = clamp(ty, dy + (pNow[1] - SAFE.y1) / z, dy + (pNow[1] - SAFE.y0) / z);
      }
    } else if (dx !== 0 || dy !== 0) {
      const z0 = need(t, [0, 0], relaxRect);
      if (z0[0] === 0 && z0[1] === 0) {
        tx = 0;
        ty = 0;
        tau = CAMF.relax;
      }
    }
    const a = 1 - Math.exp(-step / tau);
    dx += (tx - dx) * a;
    dy += (ty - dy) * a;
    if (Math.abs(dx) < 1e-4) dx = 0;
    if (Math.abs(dy) < 1e-4) dy = 0;
  }
  CAMF.table = table;
  camCache = { t: NaN, v: null };
}

/** Named moment for the narration: narration.json can place a piece at "anchorName+0.3" (see series_paths.resolve_narration). */
function anchor(name, t) {
  cue('anchor', t, { name });
}

const TOOLSEL = [];
/** Select toolbar button `id` at time t. `badge` is the lucide key shown on the cursor. */
function tool(t, id, badge, noTip) {

const POPS = [];
function makePop(html, x, y, cls = '', w) {

function itemPos(pop, idx) {
  const el = pop.querySelector(`.pi[data-i="${idx}"]`);
  const r = layoutRect(el);
  return { x: r.x, y: r.y, w: r.w, h: r.h, cx: r.x + Math.min(r.w * 0.3, 90), cy: r.cy };
}

function setHover(pop, idx) {
  if (pop.__hov === idx) return;
  pop.__hov = idx;
  pop.querySelectorAll('.pi').forEach((el) => el.classList.toggle('hov', +el.dataset.i === idx));
}

/** Drop-down animation state. hover: array of [time, index]. */
function animPop(pop, t, t0, t1, hover) {
  const a = prog(t, t0, t0 + 0.2, ease.outCubic) * (1 - prog(t, t1, t1 + 0.14, ease.inQuad));
  O(pop, a);
  pop.__alpha = a;
  if (a > 0) {
    const s = 0.94 + 0.06 * a;
    S(pop, 'transform', `translateY(${r2((1 - a) * -8)}px) scale(${r3(s)})`);
    if (hover) {
      let idx = -1;
      for (const [th, i] of hover) if (t >= th) idx = i;
      setHover(pop, idx);
    }
  }
}

/** Generic timed element: fade/slide in at t0, out at t1. */
function timed(el, t0, t1, o = {}) {
  const fin = o.fin != null ? o.fin : 0.3;
  const fout = o.fout != null ? o.fout : 0.25;
  const dx = o.dx || 0;
  const dy = o.dy || 0;
  const s0 = o.s0 != null ? o.s0 : 1;
  const base = o.base || '';
  onFrame((t) => {
    const a = prog(t, t0, t0 + fin, ease.outCubic) * (1 - prog(t, t1, t1 + fout, ease.inQuad));
    O(el, a);
    if (a > 0) {
      const k = 1 - prog(t, t0, t0 + fin, ease.outCubic);
      const sc = lerp(1, s0, k);
      S(el, 'transform', `${base} translate(${r2(dx * k)}px, ${r2(dy * k)}px) scale(${r3(sc)})`);
    }
  });
}

// ----------------------------------------------------- captions / tips
function caption(t0, t1, title, sub, iconKey, left) {

  onFrame((t) => {
    const a = prog(t, t0, t0 + 0.4, ease.outCubic);
    const o = a * (1 - prog(t, t1, t1 + 0.3, ease.inQuad));
    O(el, o);
    if (o > 0) {
      S(el, 'clipPath', `inset(0 ${r2((1 - a) * 100)}% 0 0)`);
      S(el, 'transform', `translateX(${r2((1 - a) * -46)}px)`);
      S(glow, 'transform', `scaleX(${r3(prog(t, t0 + 0.2, t1, ease.lin))})`);
    }
  });
}

/** Tool hint bar (step guide) under the toolbar. */
function hint(t0, t1, title, steps) {
  const el = h('div', { class: 'hint' }, `<b>${title}</b>${steps.map((s) => `<i>${s}</i>`).join('')}`);

const TIP = { el: null };
function buildTip() {

}

function updTip(t) {
  let best = null;
  for (const s of TOOLSEL) {
    if (!s.id || s.id === 'select' || s.noTip || !POS.btn[s.id]) continue;
    if (t >= s.t - 0.6 && t <= s.t + 0.85) best = s;
  }
  if (!best) return O(TIP.el, 0);
  const b = POS.btn[best.id];
  const a = prog(t, best.t - 0.6, best.t - 0.4, ease.outCubic) * (1 - prog(t, best.t + 0.6, best.t + 0.85, ease.inQuad));

    TIP.el.__txt = txt;

  }
  S(TIP.el, 'left', r2(b.cx + 58) + 'px');
  S(TIP.el, 'top', r2(b.y + b.h + 6) + 'px');

}

// ------------------------------------------------- cursor + toolbar render
const CUR_UI = {};
function buildCursor() {
  const layer = $('cursorLayer');
  const badges = Object.keys(ICON_NODES).map((k) => `<span class="bi" data-b="${k}" style="opacity:0">${ic(k, 22, 2.2)}</span>`).join('');
  layer.innerHTML = `<div id="cursor"><div id="cursorArrow" style="left:-4px;top:-4px;transform-origin:4px 4px"><svg width="52" height="82" viewBox="0 0 14 22"><path d="M1 1 L1 17.6 L5.2 13.7 L8 20.4 L10.7 19.3 L7.9 12.8 L13.3 12.8 Z" fill="#fff" stroke="#111" stroke-width="1.15" stroke-linejoin="round"/></svg></div><div id="cursorBadge" style="opacity:0">${badges}</div></div>`;
  CUR_UI.root = $('cursor');
  CUR_UI.arrow = $('cursorArrow');
  CUR_UI.badge = $('cursorBadge');
  CUR_UI.badgeIcons = Array.from(CUR_UI.badge.querySelectorAll('.bi'));
  CUR_UI.rips = [];
  CUR_UI.sparks = [];
  for (let i = 0; i < 4; i++) {
    const r = h('div', { class: 'rip' });
    layer.appendChild(r);
    CUR_UI.rips.push(r);
  }
  for (let i = 0; i < 24; i++) {
    const s = h('div', { class: 'spark' });
    layer.appendChild(s);
    CUR_UI.sparks.push(s);
  }
}

let curVisKeys = [[0, 0]];
const curVisible = (t) => keyed(t, curVisKeys, ease.lin);

function updCursor(t) {
  const vis = curVisible(t);
  O(CUR_UI.root, vis);
  const p = cursorPos(t);
  S(CUR_UI.root, 'transform', `translate(${r2(p[0])}px, ${r2(p[1])}px)`);

  // squash on click
  let sq = 1;
  for (const c of CLICKS) {
    const s = t - c.t;
    if (s >= -0.02 && s < 0.6) {
      const press = clamp01((s + 0.02) / 0.09);
      const rel = s < 0.09 ? 0 : ease.outElastic(clamp01((s - 0.09) / 0.45));
      sq = Math.min(sq, 1 - 0.2 * press + 0.2 * rel);
      if (s > 0.2) sq = Math.min(sq, 1 + 0.02 * Math.sin((s - 0.2) * 20) * (1 - clamp01((s - 0.2) / 0.4)));
    }
  }
  S(CUR_UI.arrow, 'transform', `scale(${r3(sq)}) rotate(${r2((1 - sq) * 20)}deg)`);

  // badge (active tool icon)
  const ts = toolAt(t);
  const menuOpen = POPS.some((p) => p.__alpha > 0.3 && !p.classList.contains('stamplib'));
  const badgeOn = ts.badge && vis > 0 && !menuOpen ? 1 : 0;
  const pop = ts.badge ? prog(t, ts.t, ts.t + 0.35, ease.outBack) : 0;
  O(CUR_UI.badge, badgeOn * clamp01(pop * 1.4));
  S(CUR_UI.badge, 'transform', `scale(${r3(0.5 + 0.5 * pop)})`);
  for (const el of CUR_UI.badgeIcons) O(el, el.dataset.b === ts.badge ? 1 : 0);

  // ripples: latest click per pool slot
  const slots = [null, null, null, null];
  CLICKS.forEach((c, i) => {
    if (c.t <= t) slots[i % 4] = c;
  });
  CUR_UI.rips.forEach((el, i) => {
    const c = slots[i];
    const s = c ? t - c.t : 9;
    if (!c || s > 0.75) return O(el, 0);
    const u = ease.outCubic(clamp01(s / 0.7));
    const pos = c.pos || (c.pos = cursorPos(c.t));
    S(el, 'left', r2(pos[0]) + 'px');
    S(el, 'top', r2(pos[1]) + 'px');
    S(el, 'transform', `scale(${r3(0.35 + 1.9 * u)})`);
    S(el, 'borderColor', c.kind === 'right' ? 'rgba(255,214,120,0.95)' : 'rgba(255,255,255,0.92)');
    O(el, (1 - u) * 0.95);
  });

  // toolbar-selection sparkles
  const bursts = [];
  TOOLSEL.forEach((s, i) => {
    if (s.id && s.id !== 'select' && POS.btn[s.id] && t >= s.t && t < s.t + 0.7) bursts.push([s, i]);
  });
  CUR_UI.sparks.forEach((el, i) => {
    const bi = Math.floor(i / 8);
    const b = bursts[bi];
    if (!b) return O(el, 0);
    const [s, si] = b;
    const u = ease.outCubic((t - s.t) / 0.7);
    const ang = ((i % 8) / 8) * Math.PI * 2 + si;
    const rad = 26 + 34 * u + rnd(si * 9 + i) * 14;
    const bp = POS.btn[s.id];
    S(el, 'left', r2(bp.cx + Math.cos(ang) * rad) + 'px');
    S(el, 'top', r2(bp.cy + Math.sin(ang) * rad) + 'px');
    S(el, 'transform', `scale(${r3(1 - u * 0.8)})`);
    O(el, 1 - u);
  });
}

/** Toolbar buttons: accent highlight follows the active tool with a short ramp + pop. */
let TB_INT = null;
function buildToolIntervals() {
  TB_INT = {};
  const ev = TOOLSEL.slice().sort((a, b) => a.t - b.t);
  for (let i = 0; i < ev.length; i++) {
    let j = i;
    while (j + 1 < ev.length && ev[j + 1].id === ev[i].id) j++;
    const on = ev[i].t;
    const off = j + 1 < ev.length ? ev[j + 1].t : Infinity;
    (TB_INT[ev[i].id] = TB_INT[ev[i].id] || []).push({ on, off, marks: ev.slice(i, j + 1).map((e) => e.t) });
    i = j;
  }
}

function updToolbar(t) {
  if (!TB_INT) buildToolIntervals();
  for (const id of Object.keys(UI.tbBtns)) {
    const el = UI.tbBtns[id];
    let a = 0;
    let pop = 1;
    for (const iv of TB_INT[id] || []) {
      const v = prog(t, iv.on, iv.on + 0.16, ease.outCubic) * (iv.off === Infinity ? 1 : 1 - prog(t, iv.off, iv.off + 0.16, ease.inCubic));
      if (v > a) a = v;
      for (const m of iv.marks) if (t >= m && t < m + 0.34 && id !== 'select') pop = 1 + 0.16 * pulse(t, m, m + 0.34);
    }
    S(el, 'background', a > 0.004 ? `rgba(0,122,204,${r3(a)})` : '');
    S(el, 'color', a > 0.5 ? '#fff' : '');
    S(el, 'transform', pop !== 1 ? `scale(${r3(pop)})` : '');
  }
}

// ------------------------------------------------------- live readout chip
const CHIP = { el: null, providers: [] };
function buildChip() {
  CHIP.el = h('div', { class: 'chip' }, '');
  OV().appendChild(CHIP.el);
}
/** fn(t) returns [label, value] or null while t is inside [t0, t1). */
function chipProvider(t0, t1, fn) {
  CHIP.providers.push({ t0, t1, fn });
}
function updChip(t) {
  let out = null;
  for (const p of CHIP.providers) {
    if (t >= p.t0 - 0.2 && t < p.t1 + 0.25) {
      const v = p.fn(t);
      if (v) out = { v, a: prog(t, p.t0, p.t0 + 0.25, ease.outCubic) * (1 - prog(t, p.t1, p.t1 + 0.25, ease.inQuad)) };
    }
  }
  if (!out || out.a <= 0.01) return O(CHIP.el, 0);
  if (cursorPos(t)[1] < CV.y + 40) return O(CHIP.el, 0);
  const html = `<small>${out.v[0]}</small>${out.v[1]}`;
  if (CHIP.el.__html !== html) {
    CHIP.el.__html = html;
    CHIP.el.innerHTML = html;
  }
  const p = cursorPos(t);
  const w = CHIP.el.offsetWidth || 200;
  const x = p[0] + 66 + w > 1900 ? p[0] - 24 - w : p[0] + 66;
  S(CHIP.el, 'left', r2(x) + 'px');
  S(CHIP.el, 'top', r2(p[1] - 8) + 'px');
  O(CHIP.el, out.a);
}

function setClass(el, name, on) {
  const c = el.__cls || (el.__cls = {});
  if (c[name] === on) return;
  c[name] = on;
  el.classList.toggle(name, on);
}

function setText(el, txt) {
  if (el.__txt === txt) return;
  el.__txt = txt;
  el.textContent = txt;
}

/* ---- shared/41-ui-kit.js ---- */
// ---------------------------------------------------------------------------
// UI kit shared by every part: key chips, label pills, polygon drawing, the Visual Control Box (VCB),
// app-style choice dialogs, selection handles and the small geometry helpers (spline, offset).
// Like the engine, everything here is a pure function of the master time once the timeline is built.
// ---------------------------------------------------------------------------
const RES = {}; // take-off results, filled by the scenes (computed from the geometry model + the calibrated scale)

const _mctx = document.createElement('canvas').getContext('2d');
function textW(str, size, weight = 700) {
  _mctx.font = `${weight} ${size}px "Plus Jakarta Sans", "Segoe UI", sans-serif`;
  return _mctx.measureText(str).width;
}

/** Dark label pill with a coloured dot (on-sheet take-off labels in the overview film). */
function makePill(parent, str, color, size = 11.5) {
  const w = textW(str, size, 700) + 30;
  const hh = size * 2.15;
  const g = sv('g', {}, parent);
  const inner = sv('g', {}, g);
  sv('rect', { x: -w / 2, y: -hh / 2, width: w, height: hh, rx: hh / 2, fill: '#10131a', 'fill-opacity': 0.95, stroke: color, 'stroke-width': 1.4 }, inner);
  sv('circle', { cx: -w / 2 + hh / 2, cy: 0, r: size * 0.3, fill: color }, inner);
  const tx = sv('text', { x: r2((hh - 8) / 2 + 1), y: r2(size * 0.36), 'text-anchor': 'middle', 'font-size': size, 'font-weight': 700, fill: '#fff', class: 'sf' }, inner);
  tx.textContent = str;
  return { g, inner, w, h: hh, text: tx };
}

/** Animate a pill: floats in at t0, optionally out at t1. */
function pillAt(p, x, y, t0, t1) {
  onFrame((t) => {
    const a = prog(t, t0, t0 + 0.35, ease.outCubic) * (t1 ? 1 - prog(t, t1, t1 + 0.25) : 1);
    O(p.g, a);
    if (a > 0) {
      const u = prog(t, t0, t0 + 0.45, ease.outBack);
      A(p.g, 'transform', `translate(${r2(x)} ${r2(y - (1 - u) * 14)}) scale(${r3(0.6 + 0.4 * u)})`);
    }
  });
}

/** Vertex-by-vertex polygon/polyline, driven by click times and the live cursor (overview-film look). */
function polyDraw(parent, o) {
  const g = sv('g', {}, parent);
  const casing = o.casing
    ? sv('polyline', { fill: 'none', stroke: o.stroke, 'stroke-opacity': 0.28, 'stroke-width': o.sw * 2.6, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, g)
    : null;
  const fillEl = o.closed ? sv('polygon', { fill: o.fill, stroke: 'none' }, g) : null;
  const la = { fill: 'none', stroke: o.stroke, 'stroke-width': o.sw, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' };
  if (o.dash) la['stroke-dasharray'] = o.dash;
  const line = sv('polyline', la, g);
  const hs = o.verts.map(() => sv('rect', { x: -3.4, y: -3.4, width: 6.8, height: 6.8, fill: '#fff', stroke: o.stroke, 'stroke-width': 1.6 }, g));
  const self = {
    g,
    state(t) {
      let n = 0;
      for (let i = 0; i < o.tv.length; i++) if (o.tv[i] <= t) n = i + 1;
      const done = t >= o.tEnd;
      let pts = o.verts.slice(0, n);
      if (n > 0 && !done) pts = pts.concat([cursorSheet(t)]);
      return { n, done, pts };
    },
  };
  onFrame((t) => {
    const s = self.state(t);
    O(g, s.n > 0 ? 1 : 0);
    if (s.n === 0) return;
    const shown = s.done ? (o.closed ? o.verts.concat([o.verts[0]]) : o.verts) : s.pts;
    A(line, 'points', ptsStr(shown));
    if (casing) A(casing, 'points', ptsStr(shown));
    if (fillEl) {
      const fp = s.done ? o.verts : s.pts;
      A(fillEl, 'points', ptsStr(fp));
      A(fillEl, 'fill-opacity', r3(s.done ? lerp(o.fillA0, o.fillA, prog(t, o.tEnd, o.tEnd + 0.5, ease.outCubic)) : o.fillA0));
    }
    if (o.handles !== false) {
      hs.forEach((hh, i) => {
        const on = i < s.n;
        O(hh, on ? 1 : 0);
        if (on) A(hh, 'transform', `translate(${r2(o.verts[i][0])} ${r2(o.verts[i][1])}) scale(${r3(0.5 + 0.5 * prog(t, o.tv[i], o.tv[i] + 0.25, ease.outBack))})`);
      });
    }
  });
  return self;
}

const menuAt = (b, dx = 0) => ({ x: b.x + dx, y: b.y + b.h + 8 });
const chevPos = (b) => ({ cx: b.x + b.w - 11, cy: b.y + b.h - 11 });

/** Small keyboard-shortcut hint with a label (a keycap that pops up next to the canvas). */
function keyChip(t0, t1, x, y, key, label) {

  OV().appendChild(el);

  return el;

/** A keycap that is visibly pressed at time tp (and registers the keyPress audio cue). */
function keyPress(tp, key, o = {}) {

  if (el) {
    const cap = el.querySelector('.key');
    onFrame((t) => S(cap, 'transform', `translateY(${r2(pulse(t, tp, tp + 0.26) * 5)}px)`));

/** Times at which each character of `str` appears when typing starts at t0 at `cps` characters per second. */
const typeTimes = (str, t0, cps) => Array.from(str, (ch, k) => t0 + (k + 1) / cps);

// ---------------------------------------------------------------- Visual Control Box (top-left of the canvas)
// Real behaviour (TakeoffLayer.tsx + VisualControlBox.tsx): a label|value box with optional detail readouts
// (e.g. AREA 301.63 m2) and, under it, a black cyan-text prompt pill. It shows while a markup tool is armed.
const VCBK = { el: null, provs: [] };
function buildVcb() {
  const el = h('div', { class: 'vcb' }, '<div class="vbox"><span class="vlab"></span><span class="vval"><b class="vv"></b><span class="vdet"></span></span></div><div class="vprompt"></div>');

/** fn(t) -> { label, value, details: [[label, value], ...], prompt } while t0 <= t < t1. The latest-starting provider wins. */
function vcbProvider(t0, t1, fn) {
  VCBK.provs.push({ t0, t1, fn });
}

function updVcb(t) {
  let best = null;
  for (const p of VCBK.provs) if (t >= p.t0 && t < p.t1 && (!best || p.t0 >= best.t0)) best = p;
  const idleFrom = TL.vcbIdleFrom != null ? TL.vcbIdleFrom : Infinity;
  if (!best && t < idleFrom) return O(VCBK.el, 0);
  const v = best ? best.fn(t) || {} : {};
  O(VCBK.el, 1);
  setClass(VCBK.box, 'idle', !best);
  setText(VCBK.lab, v.label || 'Value');
  setText(VCBK.val, v.value || '');
  const det = (v.details || []).map(([l, x]) => `<i>${l}</i><b>${x}</b>`).join('');
  if (VCBK.det.__h !== det) {
    VCBK.det.__h = det;
    VCBK.det.innerHTML = det;
  }
  const pr = v.prompt || '';

}

// ---------------------------------------------------------------- app-style choice dialog (Close Spline, Cancel Drawing?, ...)
/**
 * Full-window scrim + centred dialog like the app's own small dialogs (bg-bb-panel, rounded, stacked full-width buttons).
 * o: { title, text, buttons: [{ label, kind: 'pri'|'sec'|'dng' }], width }
 * Returns { scrim, el, buttonPos: [{cx, cy, w, h}], show(t, t0, t1), hover(t, i) }.
 */
function choiceDialog(o) {
  const scrim = h('div', { class: 'scrimFull' });
  const btns = (o.buttons || []).map((b) => `<div class="ab ${b.kind || 'sec'}">${b.label}</div>`).join('');
  const el = h('div', { class: 'adlg', style: o.width ? `width:${o.width}px` : '' }, `<h3>${o.title}</h3><p>${o.text}</p>${btns}`);
  OV().appendChild(scrim);
  OV().appendChild(el);
  el.style.left = (STAGE_W - (o.width || 400)) / 2 + 'px';
  el.style.top = (STAGE_H - el.offsetHeight) / 2 - 20 + 'px';
  const buttonPos = Array.from(el.querySelectorAll('.ab')).map((b) => layoutRect(b));
  const api = {
    scrim,
    el,
    buttonPos,
    /** fade/scale in at t0, out at t1 */
    show(t0, t1) {
      onFrame((t) => {
        const a = prog(t, t0, t0 + 0.22, ease.outCubic) * (1 - prog(t, t1, t1 + 0.18, ease.inQuad));
        O(scrim, a);
        O(el, a);
        if (a > 0) S(el, 'transform', `scale(${r3(0.94 + 0.06 * Math.min(1, a))})`);
      });
    },
    /** highlight button i while t is in [ta, tb) */
    hover(ta, tb, i) {
      const btn = el.querySelectorAll('.ab')[i];
      onFrame((t) => setClass(btn, 'hov', t >= ta && t < tb));
    },
  };
  return api;
}

// ---------------------------------------------------------------- selection handles and on-sheet labels
/** Green square vertex grips (constant on-screen size) for a selected shape; toggle with handlesAt(). */
function makeHandles(parent, pts, o = {}) {
  const g = sv('g', {}, parent);
  const hs = pts.map(() => sv('rect', { x: -3.6, y: -3.6, width: 7.2, height: 7.2, fill: o.fill || '#22c55e', stroke: '#fff', 'stroke-width': 0.8 }, g));
  const dot = o.labelDot ? sv('circle', { r: 4.2, fill: '#3b82f6', stroke: '#fff', 'stroke-width': 0.8 }, g) : null;
  const self = {
    g,
    pts,
    place(t) {

// ---------------------------------------------------------------- geometry helpers
/** Catmull-Rom spline as cubic Bezier path data, with the same control-point rule as the app's generateSplinePath. */
function splinePathD(pts, closed) {
  const n = pts.length;
  if (n < 2) return '';
  let d = `M${r2(pts[0][0])} ${r2(pts[0][1])}`;
  const cnt = closed && n >= 3 ? n : n - 1;
  for (let i = 0; i < cnt; i++) {
    const p0 = closed ? pts[(i - 1 + n) % n] : pts[i === 0 ? 0 : i - 1];
    const p1 = pts[i];
    const p2 = pts[(i + 1) % n];
    const p3 = closed ? pts[(i + 2) % n] : pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${r2(c1[0])} ${r2(c1[1])} ${r2(c2[0])} ${r2(c2[1])} ${r2(p2[0])} ${r2(p2[1])}`;
  }
  return closed && n >= 3 ? d + 'Z' : d;
}

/** The same spline sampled to a polyline (for areas and lengths). */
function splineSample(pts, closed, per = 18) {
  const n = pts.length;
  const out = [pts[0]];
  const cnt = closed && n >= 3 ? n : n - 1;
  for (let i = 0; i < cnt; i++) {
    const p0 = closed ? pts[(i - 1 + n) % n] : pts[i === 0 ? 0 : i - 1];
    const p1 = pts[i];
    const p2 = pts[(i + 1) % n];
    const p3 = closed ? pts[(i + 2) % n] : pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    for (let k = 1; k <= per; k++) {
      const u = k / per;
      const v = 1 - u;
      out.push([v * v * v * p1[0] + 3 * v * v * u * c1[0] + 3 * v * u * u * c2[0] + u * u * u * p2[0], v * v * v * p1[1] + 3 * v * v * u * c1[1] + 3 * v * u * u * c2[1] + u * u * u * p2[1]]);
    }
  }
  return closed && n >= 3 ? out.slice(0, -1) : out;
}

/**
 * Parallel copy of a polyline at distance d to one side (miter joins, like the app's offset). `side` +1 = left of the
 * direction of travel on screen (y down), -1 = right. Closed polygons wrap around.
 */
function offsetPoly(pts, d, side = 1, closed = false) {
  const n = pts.length;
  const segs = closed ? n : n - 1;
  const nor = [];
  for (let i = 0; i < segs; i++) {
    const a = pts[i];
    const b = pts[(i + 1) % n];
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
    nor.push([((b[1] - a[1]) / len) * side, (-(b[0] - a[0]) / len) * side]);
  }
  const out = [];
  for (let i = 0; i < n; i++) {
    const n1 = closed ? nor[(i - 1 + segs) % segs] : i === 0 ? null : nor[i - 1];
    const n2 = closed ? nor[i % segs] : i === n - 1 ? null : nor[i];
    let v;
    if (!n1) v = n2;
    else if (!n2) v = n1;
    else {
      const k = 1 + n1[0] * n2[0] + n1[1] * n2[1];
      v = k < 0.06 ? n1 : [(n1[0] + n2[0]) / k, (n1[1] + n2[1]) / k];
    }
    out.push([pts[i][0] + v[0] * d, pts[i][1] + v[1] * d]);
  }
  return out;
}

/** Point at distance `dist` along a polyline (clamped). */
function pointAlong(pts, dd) {
  let rest = dd;
  for (let i = 1; i < pts.length; i++) {
    const seg = dist(pts[i - 1], pts[i]);
    if (rest <= seg) {
      const u = seg === 0 ? 0 : rest / seg;
      return { p: [lerp(pts[i - 1][0], pts[i][0], u), lerp(pts[i - 1][1], pts[i][1], u)], ang: Math.atan2(pts[i][1] - pts[i - 1][1], pts[i][0] - pts[i - 1][0]) };
    }
    rest -= seg;
  }
  const a = pts[pts.length - 2] || pts[0];
  const b = pts[pts.length - 1];
  return { p: b.slice(), ang: Math.atan2(b[1] - a[1], b[0] - a[0]) };
}

// ---------------------------------------------------------------------------
// Focus camera: the camera frames the WORKING AREA of each step, one deliberate move per focus change.
//
// Authors declare what the viewer has to watch, in sheet points, while a step runs:
//     focus(t0, t1, region, opts)
//   region   {x0,y0,x1,y1} | [[x,y], ...] (any point list, e.g. a polygon) | [x0,y0,x1,y1]    the shape / spot being worked on
//   t0, t1   the step's time window (the camera is settled on the region from about t0 until t1)
//   opts     z        preferred zoom (it is reduced when the region and the cursor's drawing points would not fit)
//            zMax     zoom cap when z is not given (default 3.6)
//            margin   extra room around the region as a fraction of its half size (default 0.06; SAFE already keeps 170 px clear)
//            at       [stageX, stageY] where the region's centre should sit (default: the canvas centre; use it when a
//                     panel covers part of the canvas)
//            lead     seconds the move starts BEFORE t0 (default 0.45)
//            merge    false = never merge this step with its neighbours
//
// What the planner does (finalizeCamera() calls focusPlan() when the page is in focus mode):
//   1. frames each region: centred on the region, zoom chosen so the region AND the cursor's sheet-space points of that
//      step fit the comfort zone SAFE;
//   2. merges neighbouring steps into ONE framing when the union fits at about the same zoom and every step stays close to
//      centre (no zoom-in / zoom-out ping-pong between adjacent steps);
//   3. plans exactly one eased move per focus change (smootherstep, 0.8 to 1.2 s), started slightly before t0, never
//      re-targeted while it runs, and timed (searched numerically) so the point the cursor works on never leaves SAFE;
//   4. holds the framing steady while the cursor works inside it.
// Focus mode is chosen by part.json {"camera": "focus"} (or useFocusCamera() in buildPart()). Without it the page keeps the
// original camera: authored cam()/camMove() keys + the cursor-follow correction. focus() calls are still recorded in that
// mode, so tools/cursor_probe.mjs can measure how well the OLD camera centres the same working areas.
// ---------------------------------------------------------------------------
const FOCUS = { hints: [], mode: null, wins: [], keys: null, zFn: null, report: null };
const FOCUS_CFG = { margin: 0.06, zMax: 3.6, lead: 0.45, durMin: 0.8, durMax: 1.2, mergeGap: 3.0, settle: 0.6, tol: 4 };

/** Select the camera model for this page ('focus' = working-area framing, anything else = original authored + follow). */
function useFocusCamera(on = true) {
  FOCUS.mode = on ? 'focus' : 'authored';
}
function focusCameraOn() {
  if (FOCUS.mode) return FOCUS.mode === 'focus';
  return typeof PART_META !== 'undefined' && PART_META.camera === 'focus';
}

/** Region argument -> {x0,y0,x1,y1} in sheet points. */
function focusBox(r) {
  if (r && r.x0 != null) return { x0: r.x0, y0: r.y0, x1: r.x1, y1: r.y1 };
  if (r && r.pts) return focusBox(r.pts);
  if (r && r.c && r.r != null) return { x0: r.c[0] - r.r, y0: r.c[1] - r.r, x1: r.c[0] + r.r, y1: r.c[1] + r.r };
  if (Array.isArray(r) && r.length === 4 && typeof r[0] === 'number') return { x0: r[0], y0: r[1], x1: r[2], y1: r[3] };
  if (Array.isArray(r) && r.length === 2 && typeof r[0] === 'number') return { x0: r[0], y0: r[1], x1: r[0], y1: r[1] };
  const flat = [];
  const walk = (a) => (Array.isArray(a) && typeof a[0] === 'number' ? flat.push(a) : Array.isArray(a) && a.forEach(walk));
  walk(r);
  if (!flat.length) throw new Error('focus(): empty region');
  return {
    x0: Math.min(...flat.map((p) => p[0])),
    y0: Math.min(...flat.map((p) => p[1])),
    x1: Math.max(...flat.map((p) => p[0])),
    y1: Math.max(...flat.map((p) => p[1])),
  };
}
const focusUnion = (a, b) => ({ x0: Math.min(a.x0, b.x0), y0: Math.min(a.y0, b.y0), x1: Math.max(a.x1, b.x1), y1: Math.max(a.y1, b.y1) });

/** Declare the working area watched from t0 to t1 (see the header of this file). */
function focus(t0, t1, region, o = {}) {
  FOCUS.hints.push({ t0, t1, box: focusBox(region), o });
}

/** Framing for one working area: centred on the region, zoom fitted to the region + the cursor's points of that step. */
function focusFrame(box, o, t0, t1, zPref) {
  const cx = (box.x0 + box.x1) / 2;
  const cy = (box.y0 + box.y1) / 2;
  let ex = (box.x1 - box.x0) / 2;
  let ey = (box.y1 - box.y0) / 2;
  for (const k of CUR) {
    if (k.sp === 'sh' && k.t >= t0 - 0.05 && k.t <= t1) {
      ex = Math.max(ex, Math.abs(k.x - cx));
      ey = Math.max(ey, Math.abs(k.y - cy));
    }
  }
  const midX = CV.x + ANCHOR.x;
  const midY = CV.y + ANCHOR.y;
  const at = o.at || [midX, midY];
  const hw = Math.max(40, Math.min(at[0] - SAFE.x0, SAFE.x1 - at[0]));
  const hh = Math.max(40, Math.min(at[1] - SAFE.y0, SAFE.y1 - at[1]));
  const m = o.margin != null ? o.margin : FOCUS_CFG.margin;
  const zFit = Math.min(hw / (Math.max(ex, 1) * (1 + m)), hh / (Math.max(ey, 1) * (1 + m)));
  const zWant = zPref != null ? zPref : o.z != null ? o.z : o.zMax != null ? o.zMax : FOCUS_CFG.zMax;
  const z = Math.min(zWant, zFit);
  return { fx: cx - (at[0] - midX) / z, fy: cy - (at[1] - midY) / z, z, cx, cy, ex, ey, hw, hh };
}

/** Neighbouring steps that fit one framing at about the same zoom, each staying near the centre, become one window. */
function focusWindows() {
  const hs = FOCUS.hints.slice().sort((a, b) => a.t0 - b.t0);
  let wins = hs.map((h) => ({ t0: h.t0, t1: h.t1, box: h.box, o: h.o, zPref: h.o.z != null ? h.o.z : null, n: 1 }));
  for (const w of wins) w.frame = focusFrame(w.box, w.o, w.t0, w.t1, w.zPref);
  for (let i = 0; i + 1 < wins.length; ) {
    const a = wins[i];
    const b = wins[i + 1];
    let merged = null;
    if (a.o.merge !== false && b.o.merge !== false && b.t0 - a.t1 <= FOCUS_CFG.mergeGap && !a.o.at && !b.o.at) {
      const box = focusUnion(a.box, b.box);
      const zp = Math.min(a.frame.z, b.frame.z);
      const u = focusFrame(box, {}, a.t0, b.t1, zp);
      const near = (w) => Math.abs(w.frame.cx - u.cx) * u.z <= 0.12 * u.hw && Math.abs(w.frame.cy - u.cy) * u.z <= 0.12 * u.hh;
      if (u.z >= 0.72 * Math.max(a.frame.z, b.frame.z) && u.z >= 0.8 * zp && near(a) && near(b)) merged = { t0: a.t0, t1: b.t1, box, o: { ...a.o, z: undefined }, zPref: zp, n: a.n + b.n, frame: u };
    }
    if (merged) wins.splice(i, 2, merged);
    else i++;
  }
  return wins;
}

const focusMoveDur = (a, b) => {
  const pan = Math.hypot(b.fx - a.fx, b.fy - a.fy) * Math.min(a.z, b.z);
  const zr = Math.abs(Math.log(b.z / a.z));
  return clamp(FOCUS_CFG.durMin + 0.3 * clamp01(pan / 1500) + 0.3 * clamp01(zr), FOCUS_CFG.durMin, FOCUS_CFG.durMax);
};

/** Worst distance (stage px) by which a point the camera has to frame leaves SAFE while t runs over [a, b]. */
function focusViolation(a, b) {
  let worst = 0;
  for (let t = Math.max(0, a); t <= b + 1e-6; t += 1 / 30) {
    const p = cursorConstraint(t);
    if (!p) continue;
    const o = overshoot(p, SAFE);
    worst = Math.max(worst, Math.abs(o[0]), Math.abs(o[1]));
  }
  return worst;
}

function focusPlan(end) {
  CUR.sort((p, q) => p.t - q.t);
  const b0 = CAMKEYS.length ? CAMKEYS[0] : { fx: SHEET_W / 2, fy: SHEET_H / 2, z: 1 };
  const wins = focusWindows();
  FOCUS.wins = wins;
  FOCUS.zFn = (t) => {
    let w = null;
    for (const c of wins) if (t >= c.t0 - FOCUS_CFG.lead) w = c;
    return w ? w.frame.z : b0.z;
  };
  const keys = [{ t: 0, fx: b0.fx, fy: b0.fy, z: b0.z, e: 'lin' }];
  let prev = { fx: b0.fx, fy: b0.fy, z: b0.z };
  let prevEnd = 0;
  const log = [];
  FOCUS.keys = keys;
  camCache = { t: NaN, v: null };
  for (let i = 0; i < wins.length; i++) {
    const w = wins[i];
    const F = w.frame;
    if (Math.hypot(F.fx - prev.fx, F.fy - prev.fy) * F.z < 8 && Math.abs(Math.log(F.z / prev.z)) < 0.02) {
      w.moveStart = w.moveEnd = null;
      continue;
    }
    const lead = w.o.lead != null ? w.o.lead : FOCUS_CFG.lead;
    const lastKeyT = keys[keys.length - 1].t;
    const lo = Math.max(prevEnd, lastKeyT) + 0.001;
    const D0 = focusMoveDur(prev, F);
    const tryMove = (ts, te) => {
      const trial = keys.concat([{ t: ts, fx: prev.fx, fy: prev.fy, z: prev.z, e: 'lin' }, { t: te, fx: F.fx, fy: F.fy, z: F.z, e: 'smoother' }]);
      FOCUS.keys = trial;
      camCache = { t: NaN, v: null };
      const v = focusViolation(ts - 0.35, Math.max(te, Math.min(te + 0.7, w.t1 + 0.1)));
      FOCUS.keys = keys;
      camCache = { t: NaN, v: null };
      return v;
    };
    const cands = [];
    const add = (ts, D) => {
      if (ts >= lo) cands.push([ts, ts + D]);
    };
    add(w.t0 - lead, D0);
    // the cursor travels straight from the previous work area to this one: let the camera travel with it
    for (let j = 0; j + 1 < CUR.length; j++) {
      const a = CUR[j];
      const c = CUR[j + 1];
      if (a.sp === 'sh' && c.sp === 'sh' && c.t >= w.t0 - 0.2 && a.t < w.t0 + 1.0) {
        const ts = travelStart(a, c) - 0.05;
        if (ts >= lo && c.t + 0.05 - ts <= FOCUS_CFG.durMax + 0.4) cands.push([ts, c.t + 0.05]);
        break;
      }
    }
    for (let k = 1; k <= 60; k++) add(w.t0 - lead + k * 0.05, D0);
    for (let k = 1; k <= 8; k++) add(w.t0 - lead - k * 0.05, D0);
    for (const D of [FOCUS_CFG.durMin, FOCUS_CFG.durMax]) for (let k = 0; k <= 30; k++) add(w.t0 - lead + k * 0.1, D);
    let best = null;
    for (const [ts, te] of cands) {
      const v = tryMove(ts, te);
      if (!best || v < best.v - 1e-6) best = { ts, te, v };
      if (v <= FOCUS_CFG.tol) break;
    }
    if (!best) best = { ts: lo, te: lo + D0, v: tryMove(lo, lo + D0) };
    keys.push({ t: best.ts, fx: prev.fx, fy: prev.fy, z: prev.z, e: 'lin' }, { t: best.te, fx: F.fx, fy: F.fy, z: F.z, e: 'smoother' });
    w.moveStart = best.ts;
    w.moveEnd = best.te;
    log.push({ i, t0: w.t0, ts: +best.ts.toFixed(2), te: +best.te.toFixed(2), z: +F.z.toFixed(2), violationPx: Math.round(best.v) });
    prev = { fx: F.fx, fy: F.fy, z: F.z };
    prevEnd = best.te;
  }
  FOCUS.keys = keys;
  camCache = { t: NaN, v: null };
  // final check of the whole timeline
  const bad = [];
  for (let t = 0; t <= end; t += 1 / 60) {
    const p = cursorConstraint(t);
    if (!p) continue;
    const o = overshoot(p, SAFE);
    const m = Math.max(Math.abs(o[0]), Math.abs(o[1]));
    if (m > 6) bad.push([+t.toFixed(2), Math.round(m)]);
  }
  FOCUS.report = { windows: wins.length, hints: FOCUS.hints.length, frames: wins.map((w) => ({ t0: +w.t0.toFixed(2), t1: +w.t1.toFixed(2), merged: w.n, z: +w.frame.z.toFixed(2), halfW: Math.round(w.frame.ex), halfH: Math.round(w.frame.ey) })), moves: log, constraintViolations: bad.length, first: bad.slice(0, 8) };
  if (bad.length) console.warn('focus camera: ' + bad.length + ' frames keep the cursor outside the comfort zone', JSON.stringify(bad.slice(0, 8)));
}

/**
 * Probe view: the working area active at time t (as the author declared it) and where its centre is on the stage.
 * The last second of a step belongs to the camera's move to the next one (a move may start up to ~1 s early when the cursor
 * travels straight to the next work area), so it is not counted as "the task is on screen".
 */
function focusDebug(t) {
  let idx = -1;
  FOCUS.hints.forEach((h, i) => {
    if (t >= h.t0 && t <= h.t1 - 1.0) idx = i;
  });
  if (idx < 0) return null;
  const h = FOCUS.hints[idx];
  const s = sheetToStage((h.box.x0 + h.box.x1) / 2, (h.box.y0 + h.box.y1) / 2, t);
  return { i: idx, t0: h.t0, t1: h.t1, x: s[0], y: s[1], age: t - h.t0 };
}

/* ---- shared/50-timeline.js ---- */
// ---------------------------------------------------------------------------
// Timeline orchestration shared by every part.
//
// Part contract: a part's scripts (parts/<id>/js/*.js) define
//     function buildPart()  ->  end time in seconds of its last scene
// and build their scenes with the shared scene helpers (sceneIntroCard, sceneOpen, sceneCalibrate, sceneEndCard, ...)
// in the order they want. buildPart() must call sceneIntroCard() first (it fixes TL.zoomA/zoomB for the world zoom-through)
// and should finish with sceneEndCard() (it fixes TL.finA/finB, the sheen and the rain the audio export needs).
// Chapters: CHAPTERS.push({ t, label }) at the start of each scene. A chapter with `sweep: false` gets no gold light line.
// ---------------------------------------------------------------------------
const TL = {}; // key times shared between scenes (filled while building)

function buildTimeline() {
  buildTip();
  buildChip();
  buildVcb();
  buildOptionBars();
  buildCursor();
  tool(-1, 'select');
  cam(0, 595.5, 421, 1);
  CUR.push({ t: 0, sp: 'st', x: 2100, y: 420, e: 'lin' });

  if (typeof buildPart !== 'function') throw new Error('the part defines no buildPart()');
  const end = buildPart();
  window.SCENE_END = end;
  finalizeCamera(end + 4); // camera follows the cursor with look-ahead (40-engine.js); must precede anything that reads camAt/cursorPos
  chapterSweeps();
  globalFrames();
  buildAudioCues(); // 70-audio-cues.js: exports window.AUDIO_CUES from the finished timeline
}

/** A gold light-line sweeps under the toolbar whenever a new chapter (after the first two) starts. */
function chapterSweeps() {
  const bar = h('div', { style: `position:absolute;left:${CV.x}px;top:${CV.y - 3}px;width:${CV.w}px;height:5px;overflow:hidden;z-index:6` }, '<i style="position:absolute;top:0;left:0;width:560px;height:5px;background:linear-gradient(90deg,transparent,#f0d58a 40%,#fff3cf 60%,transparent);box-shadow:0 0 20px 5px rgba(240,213,138,0.55)"></i>');
  OV().appendChild(bar);
  const knob = bar.firstChild;
  const sweepChapters = CHAPTERS.slice(2).filter((c) => c.sweep !== false);
  const starts = sweepChapters.map((c) => c.t);
  const SWEEP_DUR = 0.9;
  sweepChapters.forEach((c) => cue('chapterSweep', c.t, { t1: c.t + SWEEP_DUR, label: c.label }));
  onFrame((t) => {
    let u = -1;
    for (const s of starts) if (t >= s && t < s + SWEEP_DUR) u = (t - s) / SWEEP_DUR;
    O(bar, u >= 0 ? 1 : 0);
    if (u >= 0) S(knob, 'transform', `translateX(${r2(lerp(-560, CV.w, ease.inOutCubic(u)))}px)`);
  });
}

function globalFrames() {
  onFrame((t) => {
    const c = camAt(t);
    A(SH.world, 'transform', `translate(${r2(c.tx)} ${r2(c.ty)}) scale(${Math.round(c.z * 10000) / 10000})`);
    setText(UI.stZoom, Math.round(c.z * 100) + '%');
    updToolbar(t);
    updTip(t);
    updChip(t);
    updVcb(t);
    updOptionBars(t);
    updWorld(t);
    updCursor(t);
  });
}

function updWorld(t) {
  const zt = prog(t, TL.zoomA, TL.zoomB, ease.outExpo);
  let s = lerp(0.72, 1, zt);
  let blur = 0;
  let o = prog(t, TL.zoomA + 0.1, TL.zoomA + 0.75, ease.outCubic);
  if (TL.finA != null) {
    const f = prog(t, TL.finA, TL.finB, ease.inOutCubic);
    s *= lerp(1, 0.9, f);
    blur = f * 9;
    o *= 1 - prog(t, TL.finA + 0.8, TL.finB, ease.inQuad);
  }
  let sx = 0;
  let sy = 0;
  let sr = 0;
  for (const k of SHAKES) {
    const u = (t - k.t) / k.dur;
    if (u >= 0 && u < 1) {
      const d = (1 - u) * (1 - u);
      sx += Math.sin(u * 47) * k.amp * d;
      sy += Math.cos(u * 39) * k.amp * d * 0.8;
      sr += Math.sin(u * 31) * 0.4 * d;
    }
  }
  const w = $('world');
  O(w, o);
  const shk = Math.min(1, (Math.abs(sx) + Math.abs(sy)) / 12);
  S(w, 'transform', `translate(${r2(sx)}px, ${r2(sy)}px) rotate(${r2(sr)}deg) scale(${r3(s * (1 + 0.014 * shk))})`);
  S(w, 'filter', blur > 0.05 ? `blur(${r2(blur)}px) brightness(${r2(1 - blur * 0.03)})` : '');
}

/* ---- shared/51-scene-intro.js ---- */
// ---------------------------------------------------------------------------
// Intro card: gold grid wipe, logo sheen, a "PART X" kicker + title, then the zoom-through into the app.
//   sceneIntroCard({ kicker: 'Part 1', title: 'Take-off in depth' })  -> 5.0 (end time, seconds)
// ---------------------------------------------------------------------------
function sceneIntroCard(o = {}) {
  TL.zoomA = 3.55;
  TL.zoomB = 5.0;
  const kicker = o.kicker || `Part ${PART_META.letter}`;
  const title = o.title || PART_META.title;
  const root = $('intro');
  let motes = '';
  for (let i = 0; i < 20; i++) motes += `<div class="mote" data-m="${i}"></div>`;
  root.innerHTML = `
    <div class="gridbg" id="inGrid"></div>
    <div class="logobox" id="inBox">
      <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
      <div class="logostage" id="inStage"><img class="logoimg" id="inImg" src="${SPLASH_URI}" alt="SAVEstimate logo"><div class="glow" id="inGlow"></div><img class="sheenimg" id="inSheen" src="${SHEEN_URI}" alt=""></div>
      <div class="scan" id="inScan"></div>
    </div>
    <div class="ptitle" id="inTag" style="top:812px"><div class="kick">${kicker}</div><div class="ttl">${title}</div></div>
    ${motes}
    <div class="flash" id="inFlash"></div>`;
  const grid = $('inGrid');
  const stg = $('inStage');
  const img = $('inImg');
  const sheen = $('inSheen');
  const glow = $('inGlow');
  const scan = $('inScan');
  const tag = Array.from($('inTag').children);
  const box = $('inBox');
  const flash = $('inFlash');
  const mote = Array.from(root.querySelectorAll('.mote'));
  root.style.transformOrigin = '960px 470px';
  // timing constants shared by the visuals and the audio cues
  const tWipe0 = 0.35;
  const tWipe1 = 1.5;
  const tSheen0 = 1.55;
  const tSheen1 = 3.2;
  const tTag0 = 1.95;
  const tTagStep = 0.5;
  cue('logoWipe', tWipe0, { t1: tWipe1, scene: 'intro' });
  cue('logoSheen', tSheen0, { t1: tSheen1, scene: 'intro' });
  tag.forEach((w, i) => cue('tagline', tTag0 + i * tTagStep, { t1: tTag0 + i * tTagStep + 0.6, n: i + 1, scene: 'intro' }));
  cue('introZoom', TL.zoomA, { t1: TL.zoomB });
  anchor('intro.wipe', tWipe0);
  anchor('intro.title', tTag0);
  anchor('intro.zoom', TL.zoomA);
  onFrame((t) => {
    const vis = 1 - prog(t, TL.zoomA + 0.5, TL.zoomB - 0.15, ease.inQuad);
    O(root, vis);
    if (vis <= 0) return;
    S(root, 'transform', `scale(${r3(1 + 9 * prog(t, TL.zoomA, TL.zoomB, ease.inCubic))})`);
    S(root, 'filter', t > TL.zoomA ? `blur(${r2(prog(t, TL.zoomA, TL.zoomB, ease.inQuad) * 14)}px)` : '');
    const g = prog(t, 0, 1.3, ease.outCubic);
    S(grid, 'opacity', g);
    S(grid, 'transform', `scale(${r3(1.25 - 0.25 * g)}) translateY(${r2(-t * 6)}px)`);
    const p = prog(t, tWipe0, tWipe1, ease.inOutCubic);
    S(stg, 'clipPath', `inset(0 ${r2((1 - p) * 100)}% 0 0)`);
    S(img, 'transform', `scale(${r3(1.07 - 0.07 * prog(t, tWipe0, 1.9, ease.outCubic))})`);
    S(scan, 'left', r2(p * 100) + '%');
    S(scan, 'opacity', p > 0.001 && p < 0.999 ? 1 : 0);
    box.querySelectorAll('.corner').forEach((c) => S(c, 'opacity', prog(t, 0.15, 0.8, ease.outCubic)));
    const sh = prog(t, tSheen0, tSheen1, ease.inOutCubic);
    S(sheen, 'maskPosition', `${r2(lerp(100, 0, sh))}% 0`);
    S(sheen, 'webkitMaskPosition', `${r2(lerp(100, 0, sh))}% 0`);
    S(glow, 'opacity', 0.6 + 0.4 * Math.sin(t * 2.2));
    tag.forEach((w, i) => {
      const u = prog(t, tTag0 + i * tTagStep, tTag0 + 0.6 + i * tTagStep, ease.outCubic);
      S(w, 'opacity', u);
      S(w, 'transform', `translateY(${r2((1 - u) * 26)}px)`);
      S(w, 'filter', u < 1 ? `blur(${r2((1 - u) * 6)}px)` : '');
    });
    mote.forEach((m, i) => {
      const sp = 0.08 + rnd(i + 3) * 0.1;
      const ph = rnd(i * 7 + 1);
      const u = (t * sp + ph) % 1;
      const size = 2 + rnd(i * 5 + 2) * 4;
      S(m, 'width', r2(size) + 'px');
      S(m, 'height', r2(size) + 'px');
      S(m, 'left', r2(200 + rnd(i * 3 + 9) * 1520 + Math.sin(t * 0.8 + i) * 18) + 'px');
      S(m, 'top', r2(1090 - u * 1140) + 'px');
      S(m, 'opacity', r3(Math.sin(u * Math.PI) * 0.85 * g));
    });
    const f = pulse(t, TL.zoomA - 0.05, TL.zoomA + 0.75);
    S(flash, 'opacity', r3(f * 0.9));
  });
  return 5.0;
}

// Shared scenes: open a PDF (Ctrl+O / File > Open PDF, Markup mode) and calibrate the scale from the 12.00 m dimension.

function sceneOpen(t0, o = {}) {

  // "press Ctrl+O" keycaps
  const keys = h('div', { class: 'keys', style: 'left:989px;top:690px' }, '<div class="key">Ctrl</div><div class="plus">+</div><div class="key">O</div>');
  OV().appendChild(keys);
  timed(keys, t0 - 0.3, tSheet + 0.1, { dy: 18, base: 'translateX(-50%)', fin: 0.5 });
  const keyEls = Array.from(keys.querySelectorAll('.key'));

  onFrame((t) => {

  });

  // File menu (real menu items)
  const fm = POS.menu.File;
  const fileMenu = makePop(
    menuHTML([
      { label: 'New Document…', k: 'Ctrl+N' },
      { label: 'Open PDF…', k: 'Ctrl+O' },
      { label: 'Open Images…' },
      { label: 'Open Project…' },
      { sep: true },
      { label: 'Save…', k: 'Ctrl+S' },
      { label: 'Close Document', k: 'Ctrl+W' },
      { label: 'Export Image…' },
      { label: 'Print / Export PDF…', k: 'Ctrl+P' },
      { sep: true },

    ]),
    fm.x - 6,

  // cursor path
  curVisKeys = [[0, 0], [t0 + 0.2, 0], [t0 + 0.7, 1]];

  cGo(t0 + 0.4, 1620, 560, { e: 'outCubic' });
  cGoP(tFile, fm, { click: true, hold: 0.32 });
  cGo(tOpenClick, openItem.cx, openItem.cy, { click: true, hold: 0.2 });
  cGoP(tMarkup, POS.markupBtn, { click: true });

  // page-load bar + sheet slide-in + shimmer
  const loadBar = h('div', { style: `position:absolute;left:${CV.x}px;top:${CV.y}px;height:4px;width:0;background:linear-gradient(90deg,#00a2ff,#7fd0ff);box-shadow:0 0 14px #00a2ff;z-index:6` });
  OV().appendChild(loadBar);
  const shim = sv('rect', { x: -300, y: -40, width: 210, height: SHEET_H + 80, fill: 'url(#shimGrad)', opacity: 0 }, null);
  const defs = UI.cvSvg.querySelector('defs');
  defs.insertAdjacentHTML('beforeend', `<linearGradient id="shimGrad" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#7fd0ff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="sheetClip"><rect x="0" y="0" width="${SHEET_W}" height="${SHEET_H}"/></clipPath>`);
  const shimG = sv('g', { 'clip-path': 'url(#sheetClip)' }, SH.overlay);
  shimG.appendChild(shim);
  cue('sheetIn', tSheet, { t1: tSheet + 1.35 });
  cue('pageShimmer', tSheet + 0.7, { t1: tSheet + 2.0 });
  onFrame((t) => {
    const p = prog(t, tSheet, tSheet + 1.35, ease.outCubic);
    O(UI.cvEmpty, 1 - prog(t, tSheet - 0.1, tSheet + 0.35, ease.inOutQuad));

    const sp = prog(t, tSheet + 0.7, tSheet + 2.0, ease.inOutCubic);
    A(shim, 'x', r2(lerp(-320, SHEET_W + 120, sp)));
    A(shim, 'transform', `skewX(-16)`);
